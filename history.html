<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>History</title>

    <link
        rel="stylesheet"
        href="history.css"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    >

</head>


<body>


<!-- =================================================
     HEADER
================================================== -->

<header class="header">

    <div class="left-section">

        <button
            type="button"
            class="back-btn"
            onclick="disableBack()"
        >

            <i class="fa fa-arrow-left"></i>

            <span>Back</span>

        </button>


        <h2
            class="history-title"
            onclick="toggleFilter()"
            title="Show / Hide Filter"
        >

            <i class="fa fa-clock-rotate-left"></i>

            <span>History</span>

        </h2>

    </div>



    <!-- PROFILE -->

    <div class="profile">

        <div
            class="profile-head"
            onclick="toggleProfile()"
        >

            <img
                id="profileImg"
                src="assets/profile.png"
                alt="Profile"
            >

            <span id="username">
                User
            </span>

            <i class="fa fa-angle-down"></i>

        </div>


        <div
            class="profile-menu"
            id="profileMenu"
        >

            <button
                type="button"
                onclick="myAccount()"
            >

                <i class="fa fa-user"></i>

                My Account

            </button>


            <button
                type="button"
                onclick="logout()"
            >

                <i class="fa fa-sign-out"></i>

                Logout

            </button>

        </div>

    </div>

</header>



<!-- =================================================
     FILTER BAR
================================================== -->

<section
    class="filter-panel"
    id="filterPanel"
>

    <div class="filter-group">

        <label for="fromDate">
            From
        </label>

        <input
            type="date"
            id="fromDate"
        >

    </div>


    <div class="filter-group">

        <label for="toDate">
            To
        </label>

        <input
            type="date"
            id="toDate"
        >

    </div>


    <div class="filter-group search-group">

        <label for="historySearch">
            Search
        </label>

        <input
            type="text"
            id="historySearch"
            placeholder="Customer ID / Problem / Reference"
            autocomplete="off"
        >

    </div>


    <button
        type="button"
        class="filter-btn"
        onclick="applyFilter()"
    >

        <i class="fa-solid fa-filter"></i>

        Filter

    </button>


    <button
        type="button"
        class="reset-btn"
        onclick="resetFilter()"
    >

        <i class="fa-solid fa-rotate-left"></i>

        Reset

    </button>

</section>



<!-- =================================================
     TABLE
================================================== -->

<main class="table-box">

    <table>

        <thead>

            <tr>

                <th>Customer ID</th>

                <th>Problem</th>

                <th>Reference</th>

                <th>Date</th>

                <th>Support</th>

                <th>Support Work</th>

                <th>Action</th>

            </tr>

        </thead>


        <tbody id="historyList">

            <tr>

                <td
                    colspan="7"
                    class="loading-cell"
                >

                    <i class="fa fa-spinner fa-spin"></i>

                    Loading History...

                </td>

            </tr>

        </tbody>

    </table>

</main>



<!-- =================================================
     EDIT / VIEW MODAL
================================================== -->

<div
    class="modal"
    id="historyModal"
>

    <div class="popup">

        <button
            type="button"
            class="close-btn"
            onclick="closeHistoryModal()"
        >

            ×

        </button>


        <h2>

            <i class="fa fa-clock-rotate-left"></i>

            Edit History

        </h2>



        <!-- CUSTOMER ID -->

        <label for="customerId">
            Customer ID
        </label>

        <input
            type="text"
            id="customerId"
        >



        <!-- PROBLEM -->

        <label for="problem">
            Problem
        </label>

        <textarea
            id="problem"
            rows="3"
        ></textarea>



        <!-- REFERENCE -->

        <label for="reference">
            Reference
        </label>

        <input
            type="text"
            id="reference"
        >



        <!-- DATE -->

        <label for="date">
            Date
        </label>

        <input
            type="date"
            id="date"
        >



        <!-- SUPPORT -->

        <label for="support">
            Support
        </label>

        <input
            type="text"
            id="support"
        >



        <!-- SUPPORT WORK -->

        <label for="supportWork">
            Support Work
        </label>

        <textarea
            id="supportWork"
            rows="3"
        ></textarea>



        <!-- CALL -->

        <label for="call">
            Call
        </label>

        <input
            type="text"
            id="call"
        >



        <!-- CALL WORK -->

        <label for="callWork">
            Call Work
        </label>

        <textarea
            id="callWork"
            rows="3"
        ></textarea>



        <!-- BUTTONS -->

        <div class="popup-buttons">

            <button
                type="button"
                class="submit-btn"
                id="saveHistoryBtn"
                onclick="updateHistory()"
            >

                <i class="fa fa-save"></i>

                Submit

            </button>


            <button
                type="button"
                class="cancel-btn"
                onclick="closeHistoryModal()"
            >

                <i class="fa fa-xmark"></i>

                Cancel

            </button>

        </div>

    </div>

</div>



<!-- =================================================
     SUCCESS POPUP
================================================== -->

<div
    class="custom-popup-overlay"
    id="successPopup"
>

    <div class="custom-popup">

        <div class="popup-icon success">

            <i class="fa fa-check"></i>

        </div>


        <h3 id="successTitle">
            Success
        </h3>


        <p id="successMessage">
            Operation completed successfully.
        </p>


        <button
            type="button"
            class="popup-ok-btn"
            onclick="closeSuccessPopup()"
        >

            OK

        </button>

    </div>

</div>



<!-- =================================================
     ERROR POPUP
================================================== -->

<div
    class="custom-popup-overlay"
    id="errorPopup"
>

    <div class="custom-popup">

        <div class="popup-icon error">

            <i class="fa fa-xmark"></i>

        </div>


        <h3 id="errorTitle">
            Error
        </h3>


        <p id="errorMessage">
            Something went wrong.
        </p>


        <button
            type="button"
            class="popup-ok-btn error-btn"
            onclick="closeErrorPopup()"
        >

            OK

        </button>

    </div>

</div>



<!-- =================================================
     JAVASCRIPT
================================================== -->

<script src="history.js"></script>


</body>

</html>
