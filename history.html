<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>History</title>


    <!-- HISTORY CSS -->

    <link
        rel="stylesheet"
        href="history.css"
    >


    <!-- FONT AWESOME -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    >

</head>


<body>


<!-- =================================================
     HEADER
================================================== -->

<header class="header">


    <div class="left-section">


        <button
            type="button"
            class="back-btn"
            onclick="goBack()"
        >

            <i class="fa fa-arrow-left"></i>

            <span>Back</span>

        </button>



        <!-- HISTORY TITLE
             CLICK = FILTER SHOW/HIDE -->

        <h2
            class="history-title"
            onclick="toggleFilter()"
        >

            <i class="fa fa-clock-rotate-left"></i>

            <span>History</span>

        </h2>


    </div>



    <!-- =================================================
         PROFILE
    ================================================== -->

    <div class="profile">


        <div
            class="profile-head"
            onclick="toggleProfile()"
        >

            <img
                id="profileImg"
                src="assets/profile.png"
                alt="Profile"
            >


            <span id="username">
                User
            </span>


            <i class="fa fa-angle-down"></i>

        </div>



        <div
            class="profile-menu"
            id="profileMenu"
        >


            <button
                type="button"
                onclick="myAccount()"
            >

                <i class="fa fa-user"></i>

                My Account

            </button>



            <button
                type="button"
                onclick="logout()"
            >

                <i class="fa fa-sign-out"></i>

                Logout

            </button>


        </div>


    </div>


</header>



<!-- =================================================
     FILTER BAR
     HIDDEN BY DEFAULT
================================================== -->

<div
    class="filter-bar"
    id="filterBar"
>


    <!-- FROM -->

    <div class="filter-group">

        <label for="fromDate">
            From
        </label>

        <input
            type="date"
            id="fromDate"
        >

    </div>



    <!-- TO -->

    <div class="filter-group">

        <label for="toDate">
            To
        </label>

        <input
            type="date"
            id="toDate"
        >

    </div>



    <!-- SEARCH -->

    <div class="filter-group search-group">

        <label for="searchHistory">
            Search
        </label>

        <input
            type="text"
            id="searchHistory"
            placeholder="Customer ID / Problem / Reference"
            autocomplete="off"
        >

    </div>



    <!-- RESET -->

    <button
        type="button"
        class="reset-btn"
        onclick="resetFilter()"
    >

        <i class="fa-solid fa-rotate-left"></i>

        Reset

    </button>


</div>



<!-- =================================================
     HISTORY TABLE
================================================== -->

<div class="table-box">


    <table>


        <thead>

            <tr>


                <th>
                    Customer ID
                </th>


                <th>
                    Problem
                </th>


                <th>
                    Reference
                </th>


                <th>
                    Date
                </th>


                <th>
                    Action
                </th>


            </tr>

        </thead>



        <tbody id="historyList">


            <tr>

                <td
                    colspan="5"
                    class="loading-cell"
                >

                    <i class="fa fa-spinner fa-spin"></i>

                    Loading...

                </td>

            </tr>


        </tbody>


    </table>


</div>



<!-- =================================================
     HISTORY VIEW POPUP
================================================== -->

<div
    class="modal"
    id="historyModal"
>


    <div class="history-popup">


        <!-- CLOSE -->

        <button
            type="button"
            class="close-btn"
            onclick="closeHistory()"
        >

            ×

        </button>



        <!-- TITLE -->

        <h2>

            <i class="fa fa-clock-rotate-left"></i>

            History Details

        </h2>



        <!-- =================================================
             BASIC INFORMATION
        ================================================== -->

        <div class="popup-section">


            <div class="section-title">

                <i class="fa fa-circle-info"></i>

                Basic Information

            </div>



            <!-- CUSTOMER ID -->

            <label for="viewCustomerId">
                Customer ID
            </label>

            <input
                type="text"
                id="viewCustomerId"
                readonly
            >



            <!-- PROBLEM -->

            <label for="viewProblem">
                Problem
            </label>

            <textarea
                id="viewProblem"
                readonly
            ></textarea>



            <!-- REFERENCE -->

            <label for="viewReference">
                Reference
            </label>

            <input
                type="text"
                id="viewReference"
                readonly
            >



            <!-- DATE -->

            <label for="viewDate">
                Date
            </label>

            <input
                type="text"
                id="viewDate"
                readonly
            >


        </div>



        <!-- =================================================
             SUPPORT INFORMATION
        ================================================== -->

        <div class="popup-section">


            <div class="section-title">

                <i class="fa fa-headset"></i>

                Support Information

            </div>



            <!-- SUPPORT -->

            <label for="viewSupport">
                Support
            </label>

            <input
                type="text"
                id="viewSupport"
                readonly
            >



            <!-- SUPPORT WORK -->

            <label for="viewSupportWork">
                Support Work
            </label>

            <textarea
                id="viewSupportWork"
                readonly
            ></textarea>


        </div>



        <!-- =================================================
             CALL INFORMATION
        ================================================== -->

        <div class="popup-section">


            <div class="section-title">

                <i class="fa fa-phone-volume"></i>

                Call Information

            </div>



            <!-- CALL -->

            <label for="viewCall">
                Call
            </label>

            <input
                type="text"
                id="viewCall"
                readonly
            >



            <!-- CALL WORK -->

            <label for="viewCallWork">
                Call Work
            </label>

            <textarea
                id="viewCallWork"
                readonly
            ></textarea>


        </div>



        <!-- =================================================
             OTHER INFORMATION
        ================================================== -->

        <div
            class="popup-section"
            id="otherInformationSection"
        >


            <div class="section-title">

                <i class="fa fa-list"></i>

                Other Information

            </div>



            <div id="otherInformation">


                <!-- JS WILL INSERT OTHER DATA -->


            </div>


        </div>



        <!-- =================================================
             POPUP BUTTON
        ================================================== -->

        <div class="popup-buttons">


            <button
                type="button"
                class="cancel-btn"
                onclick="closeHistory()"
            >

                <i class="fa fa-xmark"></i>

                Close

            </button>


        </div>


    </div>


</div>



<!-- =================================================
     ERROR POPUP
================================================== -->

<div
    class="custom-popup-overlay"
    id="errorPopup"
>


    <div class="custom-popup">


        <div class="popup-icon error">

            <i class="fa fa-xmark"></i>

        </div>



        <h3 id="errorTitle">
            Error
        </h3>



        <p id="errorMessage">
            Something went wrong.
        </p>



        <button
            type="button"
            class="popup-ok-btn error-btn"
            onclick="closeErrorPopup()"
        >

            OK

        </button>


    </div>


</div>



<!-- =================================================
     JAVASCRIPT
================================================== -->

<script src="history.js"></script>


</body>

</html>
