<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>History</title>

    <!-- HISTORY CSS -->
    <link
        rel="stylesheet"
        href="history.css"
    >

    <!-- FONT AWESOME -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    >

</head>


<body>


<!-- =====================================================
     HEADER
====================================================== -->

<header class="header">


    <div class="left-section">


        <!-- HISTORY FILTER BUTTON -->

        <button
            type="button"
            class="history-filter-btn"
            id="historyFilterBtn"
            onclick="toggleFilter()"
            title="History Filter"
        >

            <i class="fa-solid fa-clock-rotate-left"></i>

        </button>


        <h2>

            <i class="fa-solid fa-clock-rotate-left"></i>

            <span>History</span>

        </h2>


    </div>



    <!-- =================================================
         PROFILE
    ================================================== -->

    <div class="profile">


        <div
            class="profile-head"
            onclick="toggleProfile()"
        >

            <img
                id="profileImg"
                src="assets/profile.png"
                alt="Profile"
            >


            <span id="username">
                User
            </span>


            <i class="fa-solid fa-angle-down"></i>

        </div>



        <div
            class="profile-menu"
            id="profileMenu"
        >


            <button
                type="button"
                onclick="myAccount()"
            >

                <i class="fa-solid fa-user"></i>

                My Account

            </button>


            <button
                type="button"
                onclick="logout()"
            >

                <i class="fa-solid fa-right-from-bracket"></i>

                Logout

            </button>


        </div>


    </div>


</header>



<!-- =====================================================
     FILTER PANEL
====================================================== -->

<div
    class="filter-panel"
    id="filterPanel"
>


    <div class="filter-group">


        <label for="fromDate">

            From

        </label>


        <input
            type="date"
            id="fromDate"
        >


    </div>



    <div class="filter-group">


        <label for="toDate">

            To

        </label>


        <input
            type="date"
            id="toDate"
        >


    </div>



    <div class="filter-group search-group">


        <label for="historySearch">

            Search

        </label>


        <input
            type="text"
            id="historySearch"
            placeholder="Customer ID / Problem / Reference"
            autocomplete="off"
        >


    </div>



</div>



<!-- =====================================================
     HISTORY TABLE
====================================================== -->

<div class="table-box">


    <table>


        <thead>


            <tr>


                <th>
                    Customer ID
                </th>


                <th>
                    Problem
                </th>


                <th>
                    Reference
                </th>


                <th>
                    Date
                </th>


                <th>
                    Action
                </th>


            </tr>


        </thead>



        <tbody id="historyList">


            <tr>


                <td
                    colspan="5"
                    class="loading-cell"
                >

                    <i class="fa-solid fa-spinner fa-spin"></i>

                    Loading...

                </td>


            </tr>


        </tbody>


    </table>


</div>



<!-- =====================================================
     PAGINATION
====================================================== -->

<div class="pagination">


    <button
        type="button"
        id="prevBtn"
        onclick="previousPage()"
    >

        <i class="fa-solid fa-chevron-left"></i>

        Previous

    </button>



    <span id="pageInfo">

        Page 1 of 1

    </span>



    <button
        type="button"
        id="nextBtn"
        onclick="nextPage()"
    >

        Next

        <i class="fa-solid fa-chevron-right"></i>

    </button>


</div>



<!-- =====================================================
     EDIT HISTORY MODAL
====================================================== -->

<div
    class="modal"
    id="editModal"
>


    <div class="popup">


        <button
            type="button"
            class="close-btn"
            onclick="closeEdit()"
        >

            ×

        </button>



        <h2>

            <i class="fa-solid fa-clock-rotate-left"></i>

            History Details

        </h2>



        <!-- CUSTOMER ID -->

        <label for="customerId">

            Customer ID

        </label>


        <input
            type="text"
            id="customerId"
        >



        <!-- PROBLEM -->

        <label for="problem">

            Problem

        </label>


        <textarea
            id="problem"
            rows="3"
        ></textarea>



        <!-- REFERENCE -->

        <label for="reference">

            Reference

        </label>


        <input
            type="text"
            id="reference"
        >



        <!-- DATE -->

        <label for="date">

            Date

        </label>


        <input
            type="datetime-local"
            id="date"
        >



        <!-- SUPPORT -->

        <label for="support">

            Support

        </label>


        <input
            type="text"
            id="support"
        >



        <!-- SUPPORT WORK -->

        <label for="supportWork">

            Support Work

        </label>


        <textarea
            id="supportWork"
            rows="3"
        ></textarea>



        <!-- SUPPORT TIME -->

        <label for="supportTime">

            Support Time

        </label>


        <input
            type="text"
            id="supportTime"
        >



        <!-- CALL -->

        <label for="call">

            Call

        </label>


        <input
            type="text"
            id="call"
        >



        <!-- CALL WORK -->

        <label for="callWork">

            Call Work

        </label>


        <textarea
            id="callWork"
            rows="3"
        ></textarea>



        <!-- BUTTONS -->

        <div class="popup-buttons">


            <button
                type="button"
                class="submit-btn"
                id="saveHistoryBtn"
                onclick="updateHistory()"
            >

                <i class="fa-solid fa-save"></i>

                Submit

            </button>



            <button
                type="button"
                class="cancel-btn"
                onclick="closeEdit()"
            >

                <i class="fa-solid fa-xmark"></i>

                Cancel

            </button>


        </div>


    </div>


</div>



<!-- =====================================================
     SUCCESS MESSAGE
====================================================== -->

<div
    class="custom-popup-overlay"
    id="successPopup"
>


    <div class="message-box">


        <div class="message-icon">


            <i class="fa-solid fa-circle-check"></i>


        </div>


        <h3 id="successTitle">

            Success

        </h3>


        <p id="successMessage">

            Done

        </p>


        <button
            type="button"
            onclick="closeSuccessPopup()"
        >

            OK

        </button>


    </div>


</div>



<!-- =====================================================
     ERROR MESSAGE
====================================================== -->

<div
    class="custom-popup-overlay"
    id="errorPopup"
>


    <div class="message-box error-message-box">


        <div class="message-icon error-icon">


            <i class="fa-solid fa-circle-xmark"></i>


        </div>


        <h3 id="errorTitle">

            Error

        </h3>


        <p id="errorMessage">

            Something went wrong.

        </p>


        <button
            type="button"
            onclick="closeErrorPopup()"
        >

            OK

        </button>


    </div>


</div>



<!-- =====================================================
     JAVASCRIPT
====================================================== -->

<script
    src="history.js"
></script>


</body>

</html>
