<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>History</title>


    <!-- CSS -->

    <link
        rel="stylesheet"
        href="support.css"
    >


    <!-- Font Awesome -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    >

</head>


<body>


    <!-- =====================================================
         HEADER
    ====================================================== -->

    <header class="top-header">


        <div class="header-left">


            <!-- BACK BUTTON -->

            <button
                type="button"
                class="back-btn"
                onclick="goBack()"
            >

                <i class="fa fa-arrow-left"></i>

                Back

            </button>


            <!-- PAGE TITLE -->

            <h2>

                <i class="fa fa-clock-rotate-left"></i>

                History

            </h2>


        </div>



        <!-- =================================================
             USER PROFILE
        ================================================== -->

        <div class="profile">


            <!-- PROFILE HEAD -->

            <div
                class="profile-head"
                onclick="toggleProfile()"
            >


                <img
                    id="profileImg"
                    src="assets/profile.png"
                    alt="Profile"
                >


                <span id="username">
                    User
                </span>


                <i class="fa fa-angle-down"></i>


            </div>



            <!-- PROFILE MENU -->

            <div
                class="profile-menu"
                id="profileMenu"
            >


                <!-- MY ACCOUNT -->

                <button
                    type="button"
                    onclick="myAccount()"
                >

                    <i class="fa fa-user"></i>

                    My Account

                </button>



                <!-- LOGOUT -->

                <button
                    type="button"
                    onclick="logout()"
                >

                    <i class="fa fa-sign-out"></i>

                    Logout

                </button>


            </div>


        </div>


    </header>



    <!-- =====================================================
         MAIN
    ====================================================== -->

    <main>


        <!-- =================================================
             SEARCH + DATE FILTER
        ================================================== -->

        <div class="tools-row">


            <!-- SEARCH -->

            <div class="search-box">


                <i class="fa fa-search"></i>


                <input
                    type="text"
                    id="historySearch"
                    placeholder="Search Customer ID, Problem, Reference..."
                    autocomplete="off"
                >


            </div>



            <!-- FROM DATE -->

            <div class="date-filter">


                <label for="fromDate">
                    From
                </label>


                <input
                    type="date"
                    id="fromDate"
                >


            </div>



            <!-- TO DATE -->

            <div class="date-filter">


                <label for="toDate">
                    To
                </label>


                <input
                    type="date"
                    id="toDate"
                >


            </div>



            <!-- CLEAR -->

            <button
                type="button"
                class="clear-filter-btn"
                onclick="clearFilters()"
            >

                <i class="fa fa-rotate-left"></i>

                Clear

            </button>


        </div>



        <!-- =================================================
             TABLE
        ================================================== -->

        <div class="table-wrapper">


            <table>


                <thead>


                    <tr>


                        <th>
                            Customer ID
                        </th>


                        <th>
                            Problem
                        </th>


                        <th>
                            Reference
                        </th>


                        <th>
                            Date
                        </th>


                        <th>
                            Action
                        </th>


                    </tr>


                </thead>



                <tbody id="historyList">


                    <tr>


                        <td
                            colspan="5"
                            class="loading-cell"
                        >

                            Loading...


                        </td>


                    </tr>


                </tbody>


            </table>


        </div>



        <!-- =================================================
             PAGINATION
        ================================================== -->

        <div
            class="pagination"
            id="pagination"
        ></div>


    </main>



    <!-- =====================================================
         EDIT POPUP
    ====================================================== -->

    <div
        class="popup-overlay"
        id="editPopup"
    >


        <div class="popup">


            <!-- CLOSE -->

            <button
                type="button"
                class="close-btn"
                onclick="closeEdit()"
            >

                <i class="fa fa-xmark"></i>

            </button>



            <!-- TITLE -->

            <h2>

                <i class="fa fa-pen-to-square"></i>

                Edit History

            </h2>



            <!-- HIDDEN INDEX -->

            <input
                type="hidden"
                id="editIndex"
            >



            <!-- CUSTOMER ID -->

            <label for="customerId">

                Customer ID

            </label>


            <input
                type="text"
                id="customerId"
            >



            <!-- PROBLEM -->

            <label for="problem">

                Problem

            </label>


            <textarea
                id="problem"
            ></textarea>



            <!-- REFERENCE -->

            <label for="reference">

                Reference

            </label>


            <input
                type="text"
                id="reference"
            >



            <!-- DATE -->

            <label for="date">

                Date

            </label>


            <input
                type="date"
                id="date"
            >



            <!-- SUPPORT -->

            <label for="support">

                Support

            </label>


            <input
                type="text"
                id="support"
            >



            <!-- SUPPORT WORK -->

            <label for="supportWork">

                Support Work

            </label>


            <textarea
                id="supportWork"
            ></textarea>



            <!-- BUTTONS -->

            <div class="popup-buttons">


                <!-- SUBMIT -->

                <button
                    type="button"
                    class="submit-btn"
                    onclick="updateHistory()"
                >

                    <i class="fa fa-paper-plane"></i>

                    Submit

                </button>



                <!-- CANCEL -->

                <button
                    type="button"
                    class="cancel-btn"
                    onclick="closeEdit()"
                >

                    <i class="fa fa-xmark"></i>

                    Cancel

                </button>



                <!-- DELETE -->

                <button
                    type="button"
                    class="delete-btn"
                    onclick="askDelete()"
                >

                    <i class="fa fa-trash"></i>

                    Delete

                </button>


            </div>


        </div>


    </div>



    <!-- =====================================================
         DELETE CONFIRM POPUP
    ====================================================== -->

    <div
        class="custom-popup-overlay"
        id="confirmPopup"
    >


        <div class="custom-popup">


            <!-- ICON -->

            <div class="popup-icon warning">

                <i class="fa fa-triangle-exclamation"></i>

            </div>



            <!-- TITLE -->

            <h3 id="confirmTitle">

                Confirm Delete

            </h3>



            <!-- MESSAGE -->

            <p id="confirmMessage">

                Are you sure you want to delete this history?

            </p>



            <!-- BUTTONS -->

            <div class="custom-popup-buttons">


                <!-- CANCEL -->

                <button
                    type="button"
                    class="popup-cancel-btn"
                    onclick="closeConfirmPopup()"
                >

                    Cancel

                </button>



                <!-- DELETE -->

                <button
                    type="button"
                    class="popup-confirm-btn"
                    onclick="confirmDelete()"
                >

                    <i class="fa fa-trash"></i>

                    Delete

                </button>


            </div>


        </div>


    </div>



    <!-- =====================================================
         SUCCESS POPUP
    ====================================================== -->

    <div
        class="custom-popup-overlay"
        id="successPopup"
    >


        <div class="custom-popup">


            <div class="popup-icon success">

                <i class="fa fa-check"></i>

            </div>



            <h3 id="successTitle">

                Success

            </h3>



            <p id="successMessage">

                Operation completed successfully.

            </p>



            <button
                type="button"
                class="popup-ok-btn"
                onclick="closeSuccessPopup()"
            >

                OK

            </button>


        </div>


    </div>



    <!-- =====================================================
         ERROR POPUP
    ====================================================== -->

    <div
        class="custom-popup-overlay"
        id="errorPopup"
    >


        <div class="custom-popup">


            <div class="popup-icon error">

                <i class="fa fa-xmark"></i>

            </div>



            <h3 id="errorTitle">

                Error

            </h3>



            <p id="errorMessage">

                Something went wrong.

            </p>



            <button
                type="button"
                class="popup-ok-btn error-btn"
                onclick="closeErrorPopup()"
            >

                OK

            </button>


        </div>


    </div>



    <!-- =====================================================
         JAVASCRIPT
    ====================================================== -->

    <script src="history.js"></script>


</body>

</html>
