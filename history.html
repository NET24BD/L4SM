<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>History</title>


    <!-- HISTORY CSS -->
    <link
        rel="stylesheet"
        href="history.css"
    >


    <!-- FONT AWESOME -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    >

</head>


<body>


<!-- =================================================
     HEADER
================================================== -->

<header class="header">

    <div class="left-section">


        <!-- BACK BUTTON
             IMPORTANT:
             CLICK করলে কিছুই করবে না
        -->

        <button
            type="button"
            class="back-btn"
            onclick="goBack()"
        >

            <i class="fa fa-arrow-left"></i>

            <span>Back</span>

        </button>


        <!-- HISTORY TITLE -->

        <h2
            class="history-title"
            onclick="toggleFilter()"
        >

            <i class="fa fa-clock-rotate-left"></i>

            <span>History</span>

        </h2>

    </div>



    <!-- =================================================
         PROFILE
    ================================================== -->

    <div class="profile">

        <div
            class="profile-head"
            onclick="toggleProfile()"
        >

            <img
                id="profileImg"
                src="assets/profile.png"
                alt="Profile"
            >


            <span id="username">
                User
            </span>


            <i class="fa fa-angle-down"></i>

        </div>


        <div
            class="profile-menu"
            id="profileMenu"
        >

            <button
                type="button"
                onclick="myAccount()"
            >

                <i class="fa fa-user"></i>

                My Account

            </button>


            <button
                type="button"
                onclick="logout()"
            >

                <i class="fa fa-sign-out"></i>

                Logout

            </button>

        </div>

    </div>

</header>



<!-- =================================================
     FILTER BAR
     Hidden by default
================================================== -->

<div
    class="filter-bar"
    id="filterBar"
>


    <!-- FROM -->

    <div class="filter-group">

        <label for="fromDate">
            From
        </label>

        <input
            type="date"
            id="fromDate"
        >

    </div>



    <!-- TO -->

    <div class="filter-group">

        <label for="toDate">
            To
        </label>

        <input
            type="date"
            id="toDate"
        >

    </div>



    <!-- SEARCH -->

    <div class="filter-group search-group">

        <label for="historySearch">
            Search
        </label>

        <input
            type="text"
            id="historySearch"
            placeholder="Customer ID / Problem / Reference"
            autocomplete="off"
        >

    </div>



    <!-- FILTER -->

    <button
        type="button"
        class="filter-btn"
        onclick="applyDateFilter()"
    >

        <i class="fa-solid fa-filter"></i>

        Filter

    </button>



    <!-- RESET -->

    <button
        type="button"
        class="reset-btn"
        onclick="resetFilter()"
    >

        <i class="fa-solid fa-rotate-left"></i>

        Reset

    </button>

</div>



<!-- =================================================
     HISTORY TABLE
================================================== -->

<div class="table-box">

    <table>

        <thead>

            <tr>

                <!-- MAIN INFORMATION ONLY -->

                <th>
                    Customer ID
                </th>


                <th>
                    Problem
                </th>


                <th>
                    Reference
                </th>


                <th>
                    Date
                </th>


                <th>
                    Support
                </th>


                <th>
                    Support Work
                </th>


                <th>
                    Action
                </th>

            </tr>

        </thead>


        <tbody id="historyList">

            <tr>

                <td
                    colspan="7"
                    class="loading-cell"
                >

                    <i class="fa fa-spinner fa-spin"></i>

                    Loading History...

                </td>

            </tr>

        </tbody>

    </table>

</div>



<!-- =================================================
     HISTORY VIEW MODAL
================================================== -->

<div
    class="modal"
    id="historyModal"
>


    <div class="popup history-popup">


        <!-- CLOSE -->

        <button
            type="button"
            class="close-btn"
            onclick="closeHistory()"
        >

            ×

        </button>



        <!-- TITLE -->

        <h2>

            <i class="fa fa-clock-rotate-left"></i>

            History Details

        </h2>



        <!-- =================================================
             MAIN INFORMATION
        ================================================== -->

        <div class="popup-section">

            <div class="section-title">

                <i class="fa fa-user"></i>

                Customer Information

            </div>


            <!-- CUSTOMER ID -->

            <label for="customerId">
                Customer ID
            </label>

            <input
                type="text"
                id="customerId"
                readonly
            >


            <!-- PROBLEM -->

            <label for="problem">
                Problem
            </label>

            <textarea
                id="problem"
                rows="3"
                readonly
            ></textarea>


            <!-- REFERENCE -->

            <label for="reference">
                Reference
            </label>

            <input
                type="text"
                id="reference"
                readonly
            >


            <!-- DATE -->

            <label for="date">
                Date
            </label>

            <input
                type="text"
                id="date"
                readonly
            >

        </div>



        <!-- =================================================
             FROM / TO
        ================================================== -->

        <div class="popup-section">

            <div class="section-title">

                <i class="fa fa-calendar"></i>

                Date Information

            </div>


            <div class="two-column">


                <!-- FROM -->

                <div>

                    <label for="from">
                        From
                    </label>

                    <input
                        type="text"
                        id="from"
                        readonly
                    >

                </div>



                <!-- TO -->

                <div>

                    <label for="to">
                        To
                    </label>

                    <input
                        type="text"
                        id="to"
                        readonly
                    >

                </div>

            </div>

        </div>



        <!-- =================================================
             SUPPORT INFORMATION
        ================================================== -->

        <div class="popup-section">

            <div class="section-title">

                <i class="fa fa-headset"></i>

                Support Information

            </div>


            <!-- SUPPORT -->

            <label for="support">
                Support
            </label>

            <input
                type="text"
                id="support"
                readonly
            >


            <!-- SUPPORT WORK -->

            <label for="supportWork">
                Support Work
            </label>

            <textarea
                id="supportWork"
                rows="3"
                readonly
            ></textarea>


            <!-- SUPPORT TIME -->

            <label for="supportTime">
                Support Time
            </label>

            <input
                type="text"
                id="supportTime"
                readonly
            >

        </div>



        <!-- =================================================
             CALL INFORMATION
        ================================================== -->

        <div class="popup-section">

            <div class="section-title">

                <i class="fa fa-phone-volume"></i>

                Call Information

            </div>


            <!-- CALL -->

            <label for="call">
                Call
            </label>

            <input
                type="text"
                id="call"
                readonly
            >


            <!-- CALL WORK -->

            <label for="callWork">
                Call Work
            </label>

            <textarea
                id="callWork"
                rows="3"
                readonly
            ></textarea>


            <!-- CALL TIME -->

            <label for="callTime">
                Call Time
            </label>

            <input
                type="text"
                id="callTime"
                readonly
            >

        </div>



        <!-- =================================================
             OTHER INFORMATION
        ================================================== -->

        <div class="popup-section">

            <div class="section-title">

                <i class="fa fa-circle-info"></i>

                Other Information

            </div>


            <!-- STATUS -->

            <label for="status">
                Status
            </label>

            <input
                type="text"
                id="status"
                readonly
            >


            <!-- USERNAME -->

            <label for="historyUsername">
                Username
            </label>

            <input
                type="text"
                id="historyUsername"
                readonly
            >


            <!-- NAME -->

            <label for="name">
                Name
            </label>

            <input
                type="text"
                id="name"
                readonly
            >


            <!-- ROLE -->

            <label for="role">
                Role
            </label>

            <input
                type="text"
                id="role"
                readonly
            >

        </div>



        <!-- =================================================
             CLOSE BUTTON
        ================================================== -->

        <div class="popup-buttons">

            <button
                type="button"
                class="cancel-btn"
                onclick="closeHistory()"
            >

                <i class="fa fa-xmark"></i>

                Close

            </button>

        </div>


    </div>

</div>



<!-- =================================================
     ERROR POPUP
================================================== -->

<div
    class="custom-popup-overlay"
    id="errorPopup"
>

    <div class="custom-popup">

        <div class="popup-icon error">

            <i class="fa fa-xmark"></i>

        </div>


        <h3 id="errorTitle">
            Error
        </h3>


        <p id="errorMessage">
            Something went wrong.
        </p>


        <button
            type="button"
            class="popup-ok-btn error-btn"
            onclick="closeErrorPopup()"
        >

            OK

        </button>

    </div>

</div>



<!-- =================================================
     JAVASCRIPT
================================================== -->

<script src="history.js"></script>


</body>

</html>
