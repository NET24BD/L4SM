<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">


<title>History</title>


<link rel="stylesheet" href="history.css">


<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">


</head>


<body>


<!-- ================= HEADER ================= -->


<header>


<div class="left-section">


<button
class="back-btn"
onclick="goBack()">

<i class="fa fa-arrow-left"></i>

Back

</button>


<h2>

<i class="fa fa-clock-rotate-left"></i>

History

</h2>


</div>




<!-- PROFILE -->


<div class="profile">


<div class="profile-head"
onclick="toggleProfile()">


<img
id="profileImg"
src="assets/profile.png">


<span id="username">
User
</span>


<i class="fa fa-angle-down"></i>


</div>



<div
id="profileMenu"
class="profile-menu">


<button onclick="myAccount()">

<i class="fa fa-user"></i>

My Account

</button>


<button onclick="logout()">

<i class="fa fa-sign-out"></i>

Logout

</button>


</div>


</div>


</header>





<!-- ================= FILTER ================= -->


<section class="filter-area">



<div class="search-box">


<i class="fa fa-search"></i>


<input
id="historySearch"
type="text"
placeholder="Search Customer ID, Problem, Reference">


</div>




<div class="date-filter">


<label>
From
</label>


<input
type="date"
id="fromDate">



<label>
To
</label>


<input
type="date"
id="toDate">



</div>


</section>






<!-- ================= TABLE ================= -->


<div class="table-box">


<table>


<thead>

<tr>


<th>
Customer ID
</th>


<th>
Problem
</th>


<th>
Reference
</th>


<th>
Date
</th>


<th>
Action
</th>


</tr>

</thead>



<tbody id="historyList">


<tr>

<td colspan="5">

Loading...

</td>

</tr>


</tbody>



</table>


</div>





<!-- PAGINATION -->


<div
id="pagination"
class="pagination">

</div>









<!-- ================= EDIT POPUP ================= -->


<div
class="popup-overlay"
id="editPopup">


<div class="popup">



<button
class="close-btn"
onclick="closeEdit()">

×

</button>



<h2>

<i class="fa fa-pen"></i>

Edit History

</h2>




<label>
Customer ID
</label>


<input
id="customerId"
type="text">





<label>
Problem
</label>


<textarea
id="problem"></textarea>





<label>
Reference
</label>


<input
id="reference"
type="text">





<label>
Date
</label>


<input
id="date"
type="date">





<label>
Support
</label>


<input
id="support"
type="text">





<label>
Support Work
</label>


<textarea
id="supportWork"></textarea>







<div class="popup-buttons">


<button
class="submit-btn"
onclick="updateSupport()">


<i class="fa fa-check"></i>

Submit


</button>




<button
class="cancel-btn"
onclick="closeEdit()">


Cancel


</button>




<button
class="delete-btn"
onclick="deleteSupport()">


<i class="fa fa-trash"></i>

Delete


</button>



</div>



</div>

</div>









<!-- ================= DELETE CONFIRM ================= -->



<div
class="popup-overlay"
id="confirmPopup">


<div class="confirm-box">


<div class="icon warning">

<i class="fa fa-triangle-exclamation"></i>

</div>



<h3>
Confirm Delete
</h3>



<p>
Are you sure you want to delete?
</p>




<div>


<button
onclick="closeConfirmPopup()"
class="cancel-btn">

Cancel

</button>




<button
onclick="confirmDelete()"
class="delete-btn">

Delete

</button>



</div>



</div>

</div>









<!-- ================= SUCCESS ================= -->


<div
class="popup-overlay"
id="successPopup">


<div class="confirm-box">


<div class="icon success">

<i class="fa fa-check"></i>

</div>



<h3>
Success
</h3>


<p id="successMessage">

Operation completed successfully.

</p>



<button
onclick="closeSuccessPopup()"
class="submit-btn">

OK

</button>


</div>


</div>









<!-- JS -->


<script src="history.js"></script>


</body>

</html>
