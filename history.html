<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Support History</title>


<link 
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">


<style>


*{

margin:0;
padding:0;
box-sizing:border-box;
font-family:"Segoe UI",sans-serif;

}


body{

background:#f1f5f9;

color:#334155;

}



/* =====================
HEADER
===================== */


header{

height:80px;

background:white;

display:flex;

align-items:center;

gap:20px;

padding:0 30px;

box-shadow:0 3px 10px #0001;

}




.back-btn{

background:#064e3b;

color:white;

border:none;

padding:12px 18px;

border-radius:10px;

cursor:pointer;

display:flex;

align-items:center;

gap:8px;

font-size:14px;

}



.back-btn:hover{

background:#10b981;

}





.history-title{

flex:1;

font-size:24px;

color:#064e3b;

cursor:pointer;

user-select:none;

}



.history-title:hover{

color:#10b981;

}







/* =====================
PROFILE
===================== */


.profile{

position:relative;

display:flex;

align-items:center;

gap:10px;

cursor:pointer;

}



.profile img{

width:45px;

height:45px;

border-radius:50%;

object-fit:cover;

}



.profile p{

font-size:12px;

color:#64748b;

}







/* PROFILE MENU */


.profile-menu{

display:none;

position:absolute;

right:0;

top:60px;

width:180px;

background:white;

border-radius:12px;

box-shadow:0 5px 20px #0002;

overflow:hidden;

z-index:999;

}



.profile-menu a,
.profile-menu button{

width:100%;

padding:13px 15px;

display:flex;

align-items:center;

gap:10px;

background:white;

border:none;

text-decoration:none;

color:#334155;

cursor:pointer;

}



.profile-menu a:hover,
.profile-menu button:hover{

background:#f1f5f9;

}



.profile-menu button{

color:#dc2626;

}





/* =====================
MAIN CONTENT
===================== */


.container{

padding:30px;

}



.card{

background:white;

padding:25px;

border-radius:18px;

box-shadow:0 5px 20px #0001;

}






/* =====================
FILTER
===================== */


.filter-box{

display:none;

gap:15px;

align-items:end;

margin-bottom:25px;

}



.filter-box.show{

display:flex;

}



.filter-item{

display:flex;

flex-direction:column;

gap:7px;

}



.filter-item label{

font-size:13px;

color:#64748b;

}



.filter-item input{

padding:11px;

border:1px solid #ddd;

border-radius:8px;

outline:none;

}



.search-box{

flex:1;

}



.search-box input{

width:100%;

}





.filter-btn{

display:flex;

gap:10px;

}



.filter-btn button{

padding:11px 18px;

border:none;

border-radius:8px;

background:#064e3b;

color:white;

cursor:pointer;

}



.filter-btn .reset{

background:#64748b;

}






/* =====================
TABLE
===================== */


.table-box{

overflow-x:auto;

}



table{

width:100%;

border-collapse:collapse;

}



thead{

background:#064e3b;

color:white;

}



th{

padding:15px;

text-align:left;

}



td{

padding:14px;

border-bottom:1px solid #eee;

}



tr:hover{

background:#f8fafc;

}





/* ACTION */


.action button{

border:none;

padding:8px 12px;

border-radius:8px;

cursor:pointer;

margin-right:5px;

}



.view{

background:#dbeafe;

color:#1d4ed8;

}



.delete{

background:#fee2e2;

color:#dc2626;

}





/* MOBILE */


@media(max-width:768px){


header{

padding:0 15px;

}



.history-title{

font-size:18px;

}



.profile div{

display:none;

}



.container{

padding:15px;

}



.filter-box.show{

flex-direction:column;

align-items:stretch;

}



.filter-btn{

display:flex;

}



.filter-btn button{

flex:1;

}



}



</style>


</head>



<body>



<header>


<button class="back-btn" onclick="goBack()">

<i class="fa fa-arrow-left"></i>

Back

</button>





<h2 class="history-title" onclick="toggleFilter()">

<i class="fa fa-history"></i>

Support History

</h2>






<div class="profile" onclick="toggleProfileMenu()">



<img src="https://i.pravatar.cc/100">


<div>

<h4>Admin</h4>

<p>Administrator</p>

</div>



<div class="profile-menu" id="profileMenu">


<a href="my-account.html">

<i class="fa fa-user"></i>

My Account

</a>



<button onclick="logout()">

<i class="fa fa-sign-out"></i>

Logout

</button>


</div>



</div>



</header>
<!-- =========================
MAIN CONTENT
========================= -->


<div class="container">


<div class="card">



<!-- FILTER BOX -->


<div class="filter-box" id="filterBox">



<div class="filter-item">


<label>

From Date

</label>


<input 
type="date"
id="fromDate"
>


</div>




<div class="filter-item">


<label>

To Date

</label>


<input 
type="date"
id="toDate"
>


</div>





<div class="filter-item search-box">


<label>

Search

</label>


<input 
type="text"
id="search"
placeholder="Customer ID / Problem / Reference"
>


</div>






<div class="filter-btn">


<button onclick="filterData()">


<i class="fa fa-filter"></i>


Filter


</button>





<button 
class="reset"
onclick="resetFilter()"
>


<i class="fa fa-refresh"></i>


Reset


</button>



</div>



</div>







<!-- HISTORY TABLE -->


<div class="table-box">


<table>


<thead>


<tr>


<th>

Customer ID

</th>



<th>

Problem

</th>



<th>

Reference

</th>



<th>

Date

</th>



<th>

Action

</th>



</tr>


</thead>






<tbody id="historyTable">



<tr

data-support="Support Team"

data-support-work="Internet checked"

data-call="Call Team"

data-call-work="Customer confirmed"

>


<td>

CUS-1001

</td>



<td>

Internet Problem

</td>



<td>

Router Issue

</td>



<td>

10-08-2026

</td>




<td class="action">



<button

class="view"

onclick="openModal(this)"

>


<i class="fa fa-eye"></i>


View


</button>





<button

class="delete"

onclick="deleteRow(this)"

>


<i class="fa fa-trash"></i>


Delete


</button>




</td>


</tr>







<tr

data-support="Support Team"

data-support-work="Line checked"

data-call="Call Team"

data-call-work="Customer contacted"

>


<td>

CUS-1002

</td>



<td>

Slow Speed

</td>



<td>

Line Issue

</td>



<td>

08-08-2026

</td>




<td class="action">



<button

class="view"

onclick="openModal(this)"

>


<i class="fa fa-eye"></i>


View


</button>





<button

class="delete"

onclick="deleteRow(this)"

>


<i class="fa fa-trash"></i>


Delete


</button>




</td>


</tr>





</tbody>



</table>



</div>




</div>


</div>









<!-- =========================
VIEW POPUP
========================= -->



<div 
class="modal"
id="viewModal"
>



<div class="modal-box">





<div class="modal-header">


<h3>

<i class="fa fa-history"></i>

History Details

</h3>




<button

class="close-btn"

onclick="closeModal()"

>


<i class="fa fa-times"></i>


</button>



</div>







<div class="form-grid">





<div>


<label>

Customer ID

</label>


<input 
id="mCustomer"
type="text"
>


</div>






<div>


<label>

Date

</label>


<input 
id="mDate"
type="text"
>


</div>







<div class="full">


<label>

Problem

</label>


<input 
id="mProblem"
type="text"
>


</div>







<div class="full">


<label>

Reference

</label>


<input 
id="mReference"
type="text"
>


</div>







<div>


<label>

Support

</label>


<input 
id="mSupport"
type="text"
>


</div>







<div>


<label>

Support Work

</label>


<input 
id="mSupportWork"
type="text"
>


</div>







<div>


<label>

Call

</label>


<input 
id="mCall"
type="text"
>


</div>







<div>


<label>

Call Work

</label>


<input 
id="mCallWork"
type="text"
>


</div>





</div>









<div class="modal-buttons">





<button

class="submit-btn"

onclick="submitData()"

>


<i class="fa fa-check"></i>


Submit


</button>







<button

class="cancel-btn"

onclick="closeModal()"

>


<i class="fa fa-times"></i>


Cancel


</button>







<button

class="delete-btn"

onclick="deleteData()"

>


<i class="fa fa-trash"></i>


Delete


</button>





</div>





</div>



</div>
<script>


"use strict";



let selectedRow = null;



// =====================
// BACK BUTTON
// =====================

function goBack(){

    window.history.back();

}





// =====================
// FILTER SHOW / HIDE
// =====================

function toggleFilter(){

    document
    .getElementById("filterBox")
    .classList.toggle("show");

}





// =====================
// PROFILE MENU
// =====================


function toggleProfileMenu(){


let menu =
document.getElementById("profileMenu");



menu.style.display =
menu.style.display==="block"
?
"none"
:
"block";


}





document.addEventListener(
"click",
function(e){


let profile =
document.querySelector(".profile");


let menu =
document.getElementById("profileMenu");



if(
profile &&
!profile.contains(e.target)
){

menu.style.display="none";


}


});







// =====================
// LOGOUT
// =====================


function logout(){


let confirmLogout =
confirm(
"Are you sure you want to logout?"
);



if(confirmLogout){


localStorage.clear();

sessionStorage.clear();



window.location.href="login.html";


}


}








// =====================
// OPEN VIEW POPUP
// =====================


function openModal(btn){


selectedRow =
btn.closest("tr");



let data =
selectedRow.children;




document.getElementById("mCustomer").value =
data[0].innerText;



document.getElementById("mProblem").value =
data[1].innerText;



document.getElementById("mReference").value =
data[2].innerText;



document.getElementById("mDate").value =
data[3].innerText;






document.getElementById("mSupport").value =
selectedRow.dataset.support;



document.getElementById("mSupportWork").value =
selectedRow.dataset.supportWork;



document.getElementById("mCall").value =
selectedRow.dataset.call;



document.getElementById("mCallWork").value =
selectedRow.dataset.callWork;






document.getElementById("viewModal")
.style.display="flex";



}








// =====================
// CLOSE POPUP
// =====================


function closeModal(){


document
.getElementById("viewModal")
.style.display="none";


selectedRow=null;


}









// =====================
// SUBMIT UPDATE
// =====================


function submitData(){



if(!selectedRow)
return;




selectedRow.children[0].innerText =
document.getElementById("mCustomer").value;



selectedRow.children[1].innerText =
document.getElementById("mProblem").value;



selectedRow.children[2].innerText =
document.getElementById("mReference").value;



selectedRow.children[3].innerText =
document.getElementById("mDate").value;






selectedRow.dataset.support =
document.getElementById("mSupport").value;



selectedRow.dataset.supportWork =
document.getElementById("mSupportWork").value;



selectedRow.dataset.call =
document.getElementById("mCall").value;



selectedRow.dataset.callWork =
document.getElementById("mCallWork").value;




alert(
"History Updated Successfully"
);



closeModal();


}








// =====================
// DELETE ROW
// =====================


function deleteRow(btn){


let row =
btn.closest("tr");



if(
confirm("Delete this history?")
){


row.remove();


}


}







// DELETE FROM POPUP


function deleteData(){


if(selectedRow){


if(
confirm("Delete this history?")
){


selectedRow.remove();

closeModal();


}


}


}









// =====================
// FILTER FUNCTION
// =====================


function filterData(){


let from =
document.getElementById("fromDate").value;



let to =
document.getElementById("toDate").value;




let search =
document.getElementById("search")
.value
.toLowerCase();





document
.querySelectorAll("#historyTable tr")
.forEach(row=>{



let date =
row.children[3]
.innerText;



let rowDate =
new Date(
date.split("-").reverse().join("-")
);



let show=true;





if(from){


show =
rowDate >=
new Date(from);


}





if(to && show){


show =
rowDate <=
new Date(to);


}






if(search && show){


show =
row.innerText
.toLowerCase()
.includes(search);



}






row.style.display =
show
?
""
:
"none";



});



}









// =====================
// RESET FILTER
// =====================


function resetFilter(){



document.getElementById("fromDate").value="";


document.getElementById("toDate").value="";


document.getElementById("search").value="";





document
.querySelectorAll("#historyTable tr")
.forEach(row=>{


row.style.display="";


});


}







</script>
