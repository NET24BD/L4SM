<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>Support History</title>


<link rel="stylesheet" href="history.css">


<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">


</head>


<body>



<!-- ================= HEADER ================= -->


<header>



<button 
class="back-btn"
onclick="goBack()">

<i class="fa fa-arrow-left"></i>

Back

</button>







<h2 
class="history-title"
onclick="toggleFilter()">


<i class="fa fa-history"></i>

History


</h2>









<!-- USER PROFILE -->


<div 
class="profile"
onclick="toggleProfile()">



<img 
id="userPhoto"
src="https://i.pravatar.cc/100"
alt="Profile">






<div class="user-info">


<h4 id="userName">

Loading...

</h4>



<p id="userRole">

User

</p>



</div>









<!-- PROFILE MENU -->


<div 
class="profile-menu"
id="profileMenu">





<a href="my-account.html">


<i class="fa fa-user"></i>


My Account


</a>







<button onclick="logout()">



<i class="fa fa-sign-out"></i>



Logout



</button>





</div>







</div>




</header>









<!-- ================= MAIN ================= -->


<div class="container">



<div class="card">







<!-- FILTER BOX -->


<div 
class="filter-box"
id="filterBox">





<div class="filter-item">


<label>

From Date

</label>


<input 
type="date"
id="fromDate">


</div>








<div class="filter-item">


<label>

To Date

</label>


<input 
type="date"
id="toDate">


</div>








<div class="filter-item search-box">


<label>

Search

</label>


<input 
type="text"
id="search"
placeholder="Customer ID / Problem / Reference">


</div>







<div class="filter-btn">



<button onclick="filterData()">


<i class="fa fa-filter"></i>


Filter


</button>







<button 
class="reset"
onclick="resetFilter()">



<i class="fa fa-refresh"></i>


Reset


</button>






</div>






</div>









<!-- HISTORY TABLE -->


<div class="table-box">


<table>



<thead>


<tr>



<th>

Customer ID

</th>



<th>

Problem

</th>



<th>

Reference

</th>



<th>

Date

</th>



<th>

Action

</th>



</tr>



</thead>









<tbody id="historyTable">






<tr

data-support="Support Team"

data-support-work="Internet Checked"

data-call="Call Team"

data-call-work="Customer Confirmed"

>




<td>

CUS-1001

</td>



<td>

Internet Problem

</td>



<td>

Router Issue

</td>



<td>

10-08-2026

</td>






<td class="action">



<button
class="view"
onclick="openModal(this)">



<i class="fa fa-eye"></i>


View


</button>






<button
class="delete"
onclick="deleteRow(this)">



<i class="fa fa-trash"></i>


Delete


</button>




</td>





</tr>








<tr

data-support="Support Team"

data-support-work="Line Checked"

data-call="Call Team"

data-call-work="Customer Called"

>




<td>

CUS-1002

</td>



<td>

Slow Speed

</td>



<td>

Line Issue

</td>



<td>

08-08-2026

</td>






<td class="action">



<button
class="view"
onclick="openModal(this)">



<i class="fa fa-eye"></i>


View


</button>







<button
class="delete"
onclick="deleteRow(this)">



<i class="fa fa-trash"></i>


Delete


</button>





</td>





</tr>







</tbody>





</table>



</div>







<!-- PAGINATION -->


<div 
class="pagination"
id="pagination">


</div>






</div>


</div>
<!-- ==========================
VIEW DETAILS POPUP
========================== -->


<div 
class="modal"
id="viewModal">





<div class="modal-box">







<!-- POPUP HEADER -->


<div class="modal-header">


<h3>

<i class="fa fa-history"></i>

History Details

</h3>






<button
class="close-btn"
onclick="closeModal()">



<i class="fa fa-times"></i>



</button>



</div>









<!-- DETAILS FORM -->


<div class="form-grid">






<div>


<label>

Customer ID

</label>


<input
type="text"
id="mCustomer">



</div>








<div>


<label>

Date

</label>


<input
type="text"
id="mDate">



</div>








<div class="full">


<label>

Problem

</label>


<input
type="text"
id="mProblem">



</div>








<div class="full">


<label>

Reference

</label>


<input
type="text"
id="mReference">



</div>









<div>


<label>

Support

</label>


<input
type="text"
id="mSupport">



</div>








<div>


<label>

Support Work

</label>


<input
type="text"
id="mSupportWork">



</div>








<div>


<label>

Call

</label>


<input
type="text"
id="mCall">



</div>








<div>


<label>

Call Work

</label>


<input
type="text"
id="mCallWork">



</div>







</div>









<!-- BUTTON AREA -->


<div class="modal-buttons">






<button
class="submit-btn"
onclick="submitData()">



<i class="fa fa-check"></i>


Submit


</button>







<button
class="cancel-btn"
onclick="closeModal()">



<i class="fa fa-times"></i>


Cancel


</button>







<button
class="delete-btn"
onclick="deleteData()">



<i class="fa fa-trash"></i>


Delete


</button>







</div>









</div>


</div>









<!-- JS FILE -->


<script src="history.js"></script>





</body>


</html>
