<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>History</title>


    <!-- CSS -->
    <link
        rel="stylesheet"
        href="history.css"
    >


    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    >

</head>


<body>


    <!-- =========================
         HEADER
    ========================== -->

    <header class="top-header">


        <div class="header-left">

            <button
                type="button"
                class="back-btn"
                onclick="goBack()"
            >

                <i class="fa fa-arrow-left"></i>

                Back

            </button>


            <h2>

                <i class="fa fa-clock-rotate-left"></i>

                History

            </h2>

        </div>



        <!-- PROFILE -->

        <div class="profile">


            <div
                class="profile-head"
                onclick="toggleProfile()"
            >

                <img
                    id="profileImg"
                    src="assets/profile.png"
                    alt="Profile"
                >


                <span id="username">
                    Shemanto
                </span>


                <i class="fa fa-angle-down"></i>

            </div>


            <div
                class="profile-menu"
                id="profileMenu"
            >

                <button
                    type="button"
                    onclick="myAccount()"
                >

                    <i class="fa fa-user"></i>

                    My Account

                </button>


                <button
                    type="button"
                    onclick="logout()"
                >

                    <i class="fa fa-sign-out"></i>

                    Logout

                </button>

            </div>

        </div>

    </header>



    <!-- =========================
         SEARCH
    ========================== -->

    <main>


        <div class="search-box">

            <i class="fa fa-search"></i>

            <input
                type="text"
                id="historySearch"
                placeholder="Search Customer ID, Problem, Reference..."
                autocomplete="off"
            >

        </div>



        <!-- =========================
             HISTORY TABLE
        ========================== -->

        <div class="table-wrapper">

            <table>

                <thead>

                    <tr>

                        <th>Customer ID</th>

                        <th>Problem</th>

                        <th>Reference</th>

                        <th>Date</th>

                        <th>Action</th>

                    </tr>

                </thead>


                <tbody id="historyList">

                    <tr>

                        <td
                            colspan="5"
                            class="loading-cell"
                        >

                            Loading...

                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

    </main>



    <!-- =========================
         DETAILS POPUP
    ========================== -->

    <div
        class="popup-overlay"
        id="editPopup"
    >

        <div class="popup">


            <button
                type="button"
                class="close-btn"
                onclick="closeEdit()"
            >

                <i class="fa fa-xmark"></i>

            </button>


            <h2>

                <i class="fa fa-clock-rotate-left"></i>

                History Details

            </h2>



            <!-- CUSTOMER ID -->

            <label>
                Customer ID
            </label>

            <input
                type="text"
                id="customerId"
                readonly
            >



            <!-- PROBLEM -->

            <label>
                Problem
            </label>

            <textarea
                id="problem"
                readonly
            ></textarea>



            <!-- REFERENCE -->

            <label>
                Reference
            </label>

            <input
                type="text"
                id="reference"
                readonly
            >



            <!-- DATE -->

            <label>
                Date
            </label>

            <input
                type="text"
                id="date"
                readonly
            >



            <!-- SUPPORT -->

            <label>
                Support
            </label>

            <input
                type="text"
                id="support"
                readonly
            >



            <!-- SUPPORT WORK -->

            <label>
                Support Work
            </label>

            <textarea
                id="supportWork"
                readonly
            ></textarea>



            <!-- CLOSE -->

            <div class="popup-buttons">

                <button
                    type="button"
                    class="cancel-btn"
                    onclick="closeEdit()"
                >

                    <i class="fa fa-xmark"></i>

                    Close

                </button>

            </div>


        </div>

    </div>



    <!-- =========================
         CONFIRM POPUP
    ========================== -->

    <div
        class="custom-popup-overlay"
        id="confirmPopup"
    >

        <div class="custom-popup">


            <div class="popup-icon warning">

                <i class="fa fa-triangle-exclamation"></i>

            </div>


            <h3 id="confirmTitle">
                Confirm Delete
            </h3>


            <p id="confirmMessage">
                Are you sure you want to delete this history?
            </p>


            <div class="custom-popup-buttons">


                <button
                    type="button"
                    class="popup-cancel-btn"
                    onclick="closeConfirmPopup()"
                >

                    Cancel

                </button>


                <button
                    type="button"
                    class="popup-confirm-btn"
                    id="confirmActionBtn"
                >

                    <i class="fa fa-trash"></i>

                    Delete

                </button>


            </div>

        </div>

    </div>



    <!-- =========================
         SUCCESS POPUP
    ========================== -->

    <div
        class="custom-popup-overlay"
        id="successPopup"
    >

        <div class="custom-popup">


            <div class="popup-icon success">

                <i class="fa fa-check"></i>

            </div>


            <h3 id="successTitle">
                Success
            </h3>


            <p id="successMessage">
                Operation completed successfully.
            </p>


            <button
                type="button"
                class="popup-ok-btn"
                onclick="closeSuccessPopup()"
            >

                OK

            </button>


        </div>

    </div>



    <!-- =========================
         ERROR POPUP
    ========================== -->

    <div
        class="custom-popup-overlay"
        id="errorPopup"
    >

        <div class="custom-popup">


            <div class="popup-icon error">

                <i class="fa fa-xmark"></i>

            </div>


            <h3 id="errorTitle">
                Error
            </h3>


            <p id="errorMessage">
                Something went wrong.
            </p>


            <button
                type="button"
                class="popup-ok-btn error-btn"
                onclick="closeErrorPopup()"
            >

                OK

            </button>


        </div>

    </div>



    <!-- JAVASCRIPT -->

    <script src="history.js"></script>


</body>

</html>
