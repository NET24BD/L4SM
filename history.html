<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>History</title>


    <!-- HISTORY CSS -->

    <link
        rel="stylesheet"
        href="history.css"
    >


    <!-- FONT AWESOME -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    >

</head>


<body>


<!-- =====================================================
     HEADER
===================================================== -->

<header class="header">


    <!-- LEFT -->

    <div class="left-section">


        <!-- BACK BUTTON
             বর্তমানে Back button কোনো কাজ করবে না -->

        <button
            type="button"
            class="back-btn"
            onclick="goBack()"
        >

            <i class="fa fa-arrow-left"></i>

            <span>Back</span>

        </button>


        <!-- HISTORY TITLE -->

        <h2
            class="history-title"
            onclick="toggleFilter()"
        >

            <i class="fa fa-clock-rotate-left"></i>

            <span>History</span>

        </h2>

    </div>



    <!-- =================================================
         PROFILE
    ================================================== -->

    <div class="profile">


        <div
            class="profile-head"
            onclick="toggleProfile()"
        >

            <img
                id="profileImg"
                src="assets/profile.png"
                alt="Profile"
            >


            <span id="username">
                User
            </span>


            <i class="fa fa-angle-down"></i>

        </div>



        <div
            class="profile-menu"
            id="profileMenu"
        >


            <button
                type="button"
                onclick="myAccount()"
            >

                <i class="fa fa-user"></i>

                My Account

            </button>



            <button
                type="button"
                onclick="logout()"
            >

                <i class="fa fa-sign-out"></i>

                Logout

            </button>


        </div>

    </div>


</header>



<!-- =====================================================
     FILTER BAR
     
     History icon/title click করলে show হবে।
     আবার click করলে hide হবে।
===================================================== -->

<section
    class="filter-bar"
    id="filterBar"
>


    <!-- FROM DATE -->

    <div class="filter-group">

        <label for="fromDate">

            From

        </label>


        <input
            type="date"
            id="fromDate"
        >

    </div>



    <!-- TO DATE -->

    <div class="filter-group">

        <label for="toDate">

            To

        </label>


        <input
            type="date"
            id="toDate"
        >

    </div>



    <!-- SEARCH -->

    <div class="filter-group search-group">

        <label for="searchHistory">

            Search

        </label>


        <div class="filter-search">

            <i class="fa fa-search"></i>


            <input
                type="text"
                id="searchHistory"
                placeholder="Customer ID / Problem / Reference"
                autocomplete="off"
            >

        </div>

    </div>



    <!-- RESET -->

    <button
        type="button"
        class="reset-btn"
        onclick="resetFilter()"
    >

        <i class="fa-solid fa-rotate-left"></i>

        Reset

    </button>


</section>



<!-- =====================================================
     HISTORY TABLE
     
     সামনে শুধু:
     Customer ID
     Problem
     Reference
     Date
     Action
===================================================== -->

<main class="history-container">


    <div class="table-box">


        <table>


            <thead>

                <tr>


                    <th>
                        Customer ID
                    </th>


                    <th>
                        Problem
                    </th>


                    <th>
                        Reference
                    </th>


                    <th>
                        Date
                    </th>


                    <th>
                        Action
                    </th>


                </tr>

            </thead>



            <tbody id="historyList">


                <tr>


                    <td
                        colspan="5"
                        class="loading-cell"
                    >

                        <i class="fa fa-spinner fa-spin"></i>

                        Loading History...

                    </td>


                </tr>


            </tbody>


        </table>


    </div>


</main>



<!-- =====================================================
     VIEW HISTORY POPUP
     
     সামনে table-এ থাকবে:
     Customer ID
     Problem
     Reference
     Date

     নিচের information popup-এর ভিতরে থাকবে:
     Support
     Support Work
     Call
     Call Work
     Name
     Number
     Status
     Created By
===================================================== -->

<div
    class="modal"
    id="viewModal"
>


    <div class="popup">


        <!-- CLOSE -->

        <button
            type="button"
            class="close-btn"
            onclick="closeView()"
        >

            ×

        </button>



        <!-- TITLE -->

        <h2>

            <i class="fa fa-clock-rotate-left"></i>

            History Details

        </h2>



        <!-- =============================================
             MAIN INFORMATION
        ============================================== -->


        <div class="popup-section">


            <h3>

                <i class="fa fa-circle-info"></i>

                Basic Information

            </h3>



            <!-- CUSTOMER ID -->

            <label for="viewCustomerId">

                Customer ID

            </label>


            <input
                type="text"
                id="viewCustomerId"
                readonly
            >



            <!-- PROBLEM -->

            <label for="viewProblem">

                Problem

            </label>


            <textarea
                id="viewProblem"
                rows="3"
                readonly
            ></textarea>



            <!-- REFERENCE -->

            <label for="viewReference">

                Reference

            </label>


            <input
                type="text"
                id="viewReference"
                readonly
            >



            <!-- DATE -->

            <label for="viewDate">

                Date

            </label>


            <input
                type="text"
                id="viewDate"
                readonly
            >


        </div>



        <!-- =============================================
             OTHER INFORMATION
        ============================================== -->


        <div class="popup-section">


            <h3>

                <i class="fa fa-layer-group"></i>

                Other Information

            </h3>



            <!-- SUPPORT -->

            <label for="viewSupport">

                Support

            </label>


            <input
                type="text"
                id="viewSupport"
                readonly
            >



            <!-- SUPPORT WORK -->

            <label for="viewSupportWork">

                Support Work

            </label>


            <textarea
                id="viewSupportWork"
                rows="3"
                readonly
            ></textarea>



            <!-- CALL -->

            <label for="viewCall">

                Call

            </label>


            <input
                type="text"
                id="viewCall"
                readonly
            >



            <!-- CALL WORK -->

            <label for="viewCallWork">

                Call Work

            </label>


            <textarea
                id="viewCallWork"
                rows="3"
                readonly
            ></textarea>



            <!-- NAME -->

            <label for="viewName">

                Name

            </label>


            <input
                type="text"
                id="viewName"
                readonly
            >



            <!-- NUMBER -->

            <label for="viewNumber">

                Number

            </label>


            <input
                type="text"
                id="viewNumber"
                readonly
            >



            <!-- STATUS -->

            <label for="viewStatus">

                Status

            </label>


            <input
                type="text"
                id="viewStatus"
                readonly
            >



            <!-- CREATED BY -->

            <label for="viewCreatedBy">

                Created By

            </label>


            <input
                type="text"
                id="viewCreatedBy"
                readonly
            >


        </div>



        <!-- CLOSE BUTTON -->

        <div class="popup-buttons">


            <button
                type="button"
                class="cancel-btn"
                onclick="closeView()"
            >

                <i class="fa fa-xmark"></i>

                Close

            </button>


        </div>


    </div>


</div>



<!-- =====================================================
     ERROR POPUP
===================================================== -->

<div
    class="custom-popup-overlay"
    id="errorPopup"
>


    <div class="custom-popup">


        <div class="popup-icon error">

            <i class="fa fa-xmark"></i>

        </div>



        <h3 id="errorTitle">

            Error

        </h3>



        <p id="errorMessage">

            Something went wrong.

        </p>



        <button
            type="button"
            class="popup-ok-btn error-btn"
            onclick="closeErrorPopup()"
        >

            OK

        </button>


    </div>


</div>



<!-- =====================================================
     JAVASCRIPT
===================================================== -->

<script
    src="history.js"
></script>


</body>

</html>
