<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Support History</title>


    <!-- CSS -->

    <link
        rel="stylesheet"
        href="history.css"
    >


    <!-- Font Awesome -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    >

</head>


<body>


<!-- =================================================
     HEADER
================================================== -->

<header class="header">

    <div class="left-section">

        <h2>

            <i class="fa fa-clock-rotate-left"></i>

            <span>Support History</span>

        </h2>

    </div>



    <!-- PROFILE -->

    <div class="profile">

        <div
            class="profile-head"
            onclick="toggleProfile()"
        >

            <img
                id="profileImg"
                src="assets/profile.png"
                alt="Profile"
            >


            <span id="username">
                User
            </span>


            <i class="fa fa-angle-down"></i>

        </div>


        <div
            class="profile-menu"
            id="profileMenu"
        >


            <!-- MY ACCOUNT -->

            <button
                type="button"
                onclick="myAccount()"
            >

                <i class="fa fa-user"></i>

                My Account

            </button>


            <!-- LOGOUT -->

            <button
                type="button"
                onclick="logout()"
            >

                <i class="fa fa-sign-out"></i>

                Logout

            </button>


        </div>

    </div>

</header>



<!-- =================================================
     SEARCH
================================================== -->

<div class="search-section">

    <div class="search-box">

        <i class="fa fa-search"></i>


        <input
            type="text"
            id="historySearch"
            placeholder="Search Customer ID, Problem, Reference..."
            autocomplete="off"
        >

    </div>

</div>



<!-- =================================================
     TABLE
================================================== -->

<div class="table-box">

    <table>

        <thead>

            <tr>

                <th>
                    Customer ID
                </th>


                <th>
                    Problem
                </th>


                <th>
                    Reference
                </th>


                <th>
                    Date
                </th>


                <th>
                    Support
                </th>


                <th>
                    Support Work
                </th>


                <th>
                    Call
                </th>


                <th>
                    Call Work
                </th>

            </tr>

        </thead>


        <tbody id="historyList">

            <tr>

                <td
                    colspan="8"
                    class="loading-cell"
                >

                    <i class="fa fa-spinner fa-spin"></i>

                    Loading...

                </td>

            </tr>

        </tbody>

    </table>

</div>



<!-- =================================================
     DETAILS MODAL
================================================== -->

<div
    class="modal"
    id="detailsModal"
>

    <div class="popup">


        <!-- CLOSE -->

        <button
            type="button"
            class="close-btn"
            onclick="closeDetails()"
        >

            ×

        </button>


        <!-- TITLE -->

        <h2>

            <i class="fa fa-clock-rotate-left"></i>

            Support History Details

        </h2>



        <!-- CUSTOMER ID -->

        <label for="historyCustomerId">

            Customer ID

        </label>


        <input
            type="text"
            id="historyCustomerId"
            readonly
        >



        <!-- PROBLEM -->

        <label for="historyProblem">

            Problem

        </label>


        <textarea
            id="historyProblem"
            readonly
        ></textarea>



        <!-- REFERENCE -->

        <label for="historyReference">

            Reference

        </label>


        <input
            type="text"
            id="historyReference"
            readonly
        >



        <!-- DATE -->

        <label for="historyDate">

            Date

        </label>


        <input
            type="text"
            id="historyDate"
            readonly
        >



        <!-- SUPPORT -->

        <label for="historySupport">

            Support

        </label>


        <input
            type="text"
            id="historySupport"
            readonly
        >



        <!-- SUPPORT WORK -->

        <label for="historySupportWork">

            Support Work

        </label>


        <textarea
            id="historySupportWork"
            readonly
        ></textarea>



        <!-- CALL -->

        <label for="historyCall">

            Call

        </label>


        <input
            type="text"
            id="historyCall"
            readonly
        >



        <!-- CALL WORK -->

        <label for="historyCallWork">

            Call Work

        </label>


        <textarea
            id="historyCallWork"
            readonly
        ></textarea>


    </div>

</div>



<!-- =================================================
     JAVASCRIPT
================================================== -->

<script src="history.js"></script>


</body>

</html>
