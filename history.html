<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>History</title>


    <!-- CSS -->

    <link
        rel="stylesheet"
        href="history.css"
    >


    <!-- Font Awesome -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    >

</head>


<body>



<!-- =================================================
     HEADER
================================================== -->

<div class="left-section">


    <button
        class="back-btn"
        type="button"
        onclick="goBack()"
    >

        <i class="fa fa-arrow-left"></i>

        Back

    </button>


    <!-- CLICK HISTORY ICON / TITLE TO SHOW FILTER -->

    <h2
        class="history-title"
        onclick="toggleFilter()"
    >

        <i class="fa fa-clock-rotate-left"></i>

        History

    </h2>


</div>



<!-- =================================================
     PROFILE
================================================== -->

<div class="profile">


    <div
        class="profile-head"
        onclick="toggleProfile()"
    >

        <img
            id="profileImg"
            src="assets/profile.png"
            alt="Profile"
        >


        <span id="username">
            User
        </span>


        <i class="fa fa-angle-down"></i>

    </div>



    <div
        class="profile-menu"
        id="profileMenu"
    >


        <button
            type="button"
            onclick="myAccount()"
        >

            <i class="fa fa-user"></i>

            My Account

        </button>



        <button
            type="button"
            onclick="logout()"
        >

            <i class="fa fa-sign-out"></i>

            Logout

        </button>


    </div>


</div>



<!-- =================================================
     FILTER
================================================== -->

<div
    class="filter-container"
    id="filterContainer"
>


    <!-- FROM -->

    <div class="filter-group">


        <label for="fromDate">

            From

        </label>


        <input
            type="date"
            id="fromDate"
        >


    </div>



    <!-- TO -->

    <div class="filter-group">


        <label for="toDate">

            To

        </label>


        <input
            type="date"
            id="toDate"
        >


    </div>



    <!-- SEARCH -->

    <div
        class="filter-group search-group"
    >


        <label for="searchHistory">

            Search

        </label>


        <input
            type="text"
            id="searchHistory"
            placeholder="Customer ID / Problem / Reference"
            autocomplete="off"
        >


    </div>



    <!-- RESET -->

    <button
        type="button"
        class="reset-btn"
        onclick="resetFilter()"
    >

        <i class="fa-solid fa-rotate-left"></i>

        Reset

    </button>


</div>



<!-- =================================================
     HISTORY TABLE
================================================== -->

<table>


    <thead>


        <tr>


            <th>

                Customer ID

            </th>



            <th>

                Problem

            </th>



            <th>

                Reference

            </th>



            <th>

                Date

            </th>



            <th>

                Support

            </th>



            <th>

                Support Work

            </th>



            <th>

                Action

            </th>


        </tr>


    </thead>



    <tbody id="historyList">


        <tr>


            <td colspan="7">


                <i
                    class="fa fa-spinner fa-spin"
                ></i>


                Loading...


            </td>


        </tr>


    </tbody>


</table>



<!-- =================================================
     HISTORY DETAILS POPUP
================================================== -->

<div
    class="popup-overlay"
    id="historyPopup"
>


    <div class="popup">


        <!-- CLOSE -->

        <button
            type="button"
            class="close-btn"
            onclick="closeEdit()"
        >

            ×

        </button>



        <h2>


            <i
                class="fa fa-clock-rotate-left"
            ></i>


            History Details


        </h2>



        <!-- CUSTOMER ID -->

        <label for="customerId">

            Customer ID

        </label>


        <input
            id="customerId"
            type="text"
            readonly
        >



        <!-- PROBLEM -->

        <label for="problem">

            Problem

        </label>


        <textarea
            id="problem"
            rows="4"
            readonly
        ></textarea>



        <!-- REFERENCE -->

        <label for="reference">

            Reference

        </label>


        <input
            id="reference"
            type="text"
            readonly
        >



        <!-- DATE -->

        <label for="date">

            Date

        </label>


        <input
            id="date"
            type="date"
            readonly
        >



        <!-- SUPPORT -->

        <label for="support">

            Support

        </label>


        <input
            id="support"
            type="text"
            readonly
        >



        <!-- SUPPORT WORK -->

        <label for="supportWork">

            Support Work

        </label>


        <textarea
            id="supportWork"
            rows="3"
            readonly
        ></textarea>



        <!-- CALL -->

        <label for="call">

            Call

        </label>


        <input
            id="call"
            type="text"
            readonly
        >



        <!-- CALL WORK -->

        <label for="callWork">

            Call Work

        </label>


        <textarea
            id="callWork"
            rows="3"
            readonly
        ></textarea>



        <!-- BUTTONS -->

        <div class="popup-buttons">


            <button
                type="button"
                class="cancel-btn"
                onclick="closeEdit()"
            >

                <i class="fa-solid fa-xmark"></i>

                Close

            </button>


        </div>


    </div>


</div>



<!-- =================================================
     MESSAGE POPUP
================================================== -->

<div
    class="message-overlay"
    id="messagePopup"
>


    <div class="message-box">


        <div class="message-icon">


            <i
                class="fa-solid fa-circle-check"
            ></i>


        </div>



        <h3 id="messageTitle">

            Success

        </h3>



        <p id="messageText">

            Done

        </p>



        <button
            type="button"
            onclick="closeMessage()"
        >

            OK

        </button>


    </div>


</div>



<!-- =================================================
     CONFIRM POPUP
================================================== -->

<div
    class="confirm-overlay"
    id="confirmPopup"
>


    <div class="confirm-box">


        <div class="confirm-icon">


            <i
                class="fa-solid fa-triangle-exclamation"
            ></i>


        </div>



        <h3>

            Confirm?

        </h3>



        <p>

            Are you sure you want to continue?

        </p>



        <div class="confirm-buttons">


            <button
                type="button"
                class="confirm-delete"
                onclick="confirmAction()"
            >

                <i
                    class="fa-solid fa-check"
                ></i>

                Confirm

            </button>



            <button
                type="button"
                class="confirm-cancel"
                onclick="closeConfirm()"
            >

                Cancel

            </button>


        </div>


    </div>


</div>



<!-- =================================================
     JAVASCRIPT
================================================== -->

<script src="history.js"></script>


</body>

</html>
