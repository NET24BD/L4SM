<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>Loading</title>


<style>


/* =========================
LOADING BOX
========================= */


.loading-box{


display:none;


position:fixed;


top:50%;


left:50%;


transform:translate(-50%,-50%);



width:280px;



padding:30px 25px;



background:white;



border-radius:22px;



box-shadow:

0 20px 50px rgba(0,0,0,.30);



z-index:99999;



text-align:center;



font-family:Arial,sans-serif;


}







/* =========================
OVERLAY
========================= */


.loading-overlay{


display:none;


position:fixed;


top:0;


left:0;


width:100%;


height:100%;



background:rgba(0,0,0,.35);



z-index:99998;


}






/* =========================
CIRCLE
========================= */


.loader-icon{


width:80px;


height:80px;


margin:auto;


display:flex;


justify-content:center;


align-items:center;


}



.circle{


width:60px;


height:60px;


border-radius:50%;



border:6px solid #e5e7eb;



border-top-color:#2563eb;



border-right-color:#16a34a;



animation:rotate 1s linear infinite;


}



@keyframes rotate{


0%{

transform:rotate(0deg);

}


100%{

transform:rotate(360deg);

}


}






/* =========================
PERCENT
========================= */


.percent{


margin-top:15px;



font-size:35px;



font-weight:700;



color:#2563eb;


}






/* =========================
PROGRESS
========================= */


.progress{


width:100%;



height:12px;



background:#e5e7eb;



border-radius:20px;



overflow:hidden;



margin-top:15px;


}




.progress-bar{


width:0%;



height:100%;



background:


linear-gradient(

90deg,

#2563eb,

#16a34a

);



border-radius:20px;



transition:.3s ease;


}






/* =========================
TEXT
========================= */


.loading-box h3{


margin-top:18px;



font-size:16px;



font-weight:600;



color:#1e3a8a;



}



</style>


</head>


<body>



<div class="loading-overlay" id="loadingOverlay"></div>



<div class="loading-box" id="loadingBox">


<div class="loader-icon">


<div class="circle"></div>


</div>




<div class="percent" id="percent">

0%

</div>




<div class="progress">


<div class="progress-bar" id="progressBar"></div>


</div>




<h3 id="loadingText">

Loading...

</h3>



</div>







<script>


let loadingInterval;



let count=0;





// =========================
// SHOW LOADING
// =========================


function showLoading(text="Loading..."){



let box=document.getElementById("loadingBox");


let overlay=document.getElementById("loadingOverlay");



if(!box){

return;

}



box.style.display="block";


overlay.style.display="block";



document.getElementById("loadingText").innerHTML=text;



count=0;



document.getElementById("percent").innerHTML="0%";


document.getElementById("progressBar").style.width="0%";



clearInterval(loadingInterval);



loadingInterval=setInterval(function(){



if(count<100){


count++;



document.getElementById("percent").innerHTML=
count+"%";



document.getElementById("progressBar").style.width=
count+"%";



}



},30);



}









// =========================
// HIDE LOADING
// =========================


function hideLoading(){



clearInterval(loadingInterval);



let bar=document.getElementById("progressBar");

let percent=document.getElementById("percent");



if(percent){

percent.innerHTML="100%";

}



if(bar){

bar.style.width="100%";

}





setTimeout(function(){



let box=document.getElementById("loadingBox");

let overlay=document.getElementById("loadingOverlay");



if(box){

box.style.display="none";

}



if(overlay){

overlay.style.display="none";

}




},400);



}









// =========================
// AUTO READY
// =========================


document.addEventListener(
"DOMContentLoaded",
function(){


console.log("Loading System Ready");


});



</script>



</body>


</html>
