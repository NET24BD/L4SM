<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Loading</title>


<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}


body{

    width:100%;
    height:100vh;

    overflow:hidden;

    background:transparent;

    font-family:Arial,sans-serif;

}


/* =========================
OVERLAY
========================= */

.loading-overlay{

    position:fixed;

    inset:0;

    width:100%;
    height:100%;

    background:rgba(0,0,0,.35);

    display:flex;

    align-items:center;

    justify-content:center;

    z-index:99998;

}


/* =========================
LOADING BOX
========================= */

.loading-box{

    width:280px;

    padding:30px 25px;

    background:white;

    border-radius:22px;

    box-shadow:
        0 20px 50px rgba(0,0,0,.30);

    text-align:center;

}


/* =========================
LOADER
========================= */

.loader-icon{

    width:80px;
    height:80px;

    margin:auto;

    display:flex;

    justify-content:center;

    align-items:center;

}


.circle{

    width:60px;
    height:60px;

    border-radius:50%;

    border:6px solid #e5e7eb;

    border-top-color:#2563eb;

    border-right-color:#16a34a;

    animation:
        rotate 1s linear infinite;

}


@keyframes rotate{

    0%{
        transform:rotate(0deg);
    }

    100%{
        transform:rotate(360deg);
    }

}


/* =========================
PERCENT
========================= */

.percent{

    margin-top:15px;

    font-size:35px;

    font-weight:700;

    color:#2563eb;

}


/* =========================
PROGRESS
========================= */

.progress{

    width:100%;

    height:12px;

    background:#e5e7eb;

    border-radius:20px;

    overflow:hidden;

    margin-top:15px;

}


.progress-bar{

    width:0%;

    height:100%;

    background:
        linear-gradient(
            90deg,
            #2563eb,
            #16a34a
        );

    border-radius:20px;

    transition:
        width .25s ease;

}


/* =========================
TEXT
========================= */

.loading-box h3{

    margin-top:18px;

    font-size:16px;

    font-weight:600;

    color:#1e3a8a;

}


</style>

</head>


<body>


<div
    class="loading-overlay"
    id="loadingOverlay"
>


    <div
        class="loading-box"
        id="loadingBox"
    >


        <div class="loader-icon">

            <div class="circle"></div>

        </div>


        <div
            class="percent"
            id="percent"
        >
            0%
        </div>


        <div class="progress">

            <div
                class="progress-bar"
                id="progressBar"
            ></div>

        </div>


        <h3 id="loadingText">
            Loading...
        </h3>


    </div>


</div>


<script>


/* =========================================================
   LOADING SYSTEM
========================================================= */

let loadingInterval = null;

let count = 0;


/* =========================================================
   GET MESSAGE FROM URL
========================================================= */

const params =
    new URLSearchParams(
        window.location.search
    );


const message =
    params.get("message");


if(message){

    document.getElementById(
        "loadingText"
    ).textContent = message;

}


/* =========================================================
   START LOADING
========================================================= */

function startLoading(){

    const percent =
        document.getElementById(
            "percent"
        );

    const progressBar =
        document.getElementById(
            "progressBar"
        );


    count = 0;


    clearInterval(
        loadingInterval
    );


    loadingInterval =
        setInterval(function(){


            if(count < 95){

                count++;


                percent.textContent =
                    count + "%";


                progressBar.style.width =
                    count + "%";

            }


        },30);

}


/* =========================================================
   AUTO START
========================================================= */

startLoading();


/* =========================================================
   READY
========================================================= */

console.log(
    "Loading System Ready"
);


</script>


</body>

</html>
