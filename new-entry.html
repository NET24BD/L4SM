<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Support Entry - eSupport System</title>
    <link rel="stylesheet" href="entry.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.3/css/all.min.css">
</head>
<body>

    <ul class="background-emojis">
        <li>🚀</li><li>💻</li><li>⚡</li><li>🛡️</li><li>✨</li><li>🔒</li><li>🎧</li><li>🌐</li>
    </ul>

    <div class="entry-box">
        <!-- Back to Dashboard -->
        <div class="top-bar" style="text-align: left; margin-bottom: 15px;">
            <a href="1d.html" style="color: #4f46e5; text-decoration: none; font-size: 14px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px;">
                <i class="fa-solid fa-arrow-left"></i> Back to Dashboard
            </a>
        </div>

        <div class="header">
            <div class="logo">
                <i class="fa-solid fa-headset"></i>
            </div>
            <h2>New Support Entry</h2>
            <p>Submit a new technical issue or ticket</p>
        </div>

        <form id="entryForm">
            <!-- 1. Customer ID -->
            <div class="input-group">
                <label for="customerId">
                    <i class="fa-solid fa-id-card icon"></i> Customer ID
                </label>
                <input type="text" id="customerId" placeholder="e.g. CUST-1001" required>
            </div>

            <!-- 2. Problem Details -->
            <div class="input-group">
                <label for="problem">
                    <i class="fa-solid fa-triangle-exclamation icon"></i> Problem Details
                </label>
                <textarea id="problem" rows="4" placeholder="Describe the issue in detail..." required></textarea>
            </div>

            <!-- 3. Reference User (Sobar Niche & Auto Loaded) -->
            <div class="input-group">
                <label for="reference">
                    <i class="fa-solid fa-user icon"></i> Reference User
                </label>
                <input type="text" id="reference" readonly placeholder="Loading User..." autocomplete="off">
            </div>

            <div id="message"></div>

            <button id="submitBtn" type="submit">
                <i class="fa-solid fa-paper-plane"></i> SUBMIT ENTRY
            </button>
        </form>
    </div>

    <script src="entry.js"></script>
</body>
</html>
