<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Account | Link4</title>


<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}


body{

min-height:100vh;
background:linear-gradient(135deg,#07111f,#0b5c45);
display:flex;
justify-content:center;
align-items:center;
color:white;

}



.account-box{

width:380px;
background:#101c30;
padding:25px;
border-radius:20px;
box-shadow:0 0 30px #000;

}



.profile{

text-align:center;

}



.profile img{

width:120px;
height:120px;
border-radius:50%;
object-fit:cover;
border:4px solid #00d4ff;

}



.profile h2{

margin-top:15px;

}



.role{

color:#00d4ff;
margin-top:8px;

}



.info{

margin-top:20px;
background:#07111f;
padding:15px;
border-radius:15px;

}



.row{

display:flex;
justify-content:space-between;
padding:10px 0;
border-bottom:1px solid #26364f;

}


.row:last-child{

border:none;

}



.label{

color:#aaa;

}



.value{

font-weight:bold;
max-width:180px;
text-align:right;
word-break:break-word;

}



#loading{

text-align:center;
font-size:18px;

}


</style>


</head>



<body>



<div class="account-box">



<div id="loading">

Loading Account...

</div>





<div id="account" style="display:none;">



<div class="profile">


<img id="photo"
src="https://i.imgur.com/6VBx3io.png">



<h2 id="name"></h2>


<div class="role" id="role"></div>


</div>





<div class="info">



<div class="row">

<span class="label">
Username
</span>

<span class="value" id="username"></span>

</div>




<div class="row">

<span class="label">
Status
</span>

<span class="value" id="status"></span>

</div>




<div class="row">

<span class="label">
Number
</span>

<span class="value" id="number"></span>

</div>




<div class="row">

<span class="label">
Email
</span>

<span class="value" id="email"></span>

</div>




<div class="row">

<span class="label">
Department
</span>

<span class="value" id="department"></span>

</div>




<div class="row">

<span class="label">
Join Date
</span>

<span class="value" id="joinDate"></span>

</div>



</div>



</div>


</div>






<script>


const API_URL = 
"https://script.google.com/macros/s/AKfycbzNw_d6tW3L3cFHtusSqUujnFSKC4gRYvIplxcNy2h9pUAO8AU1-K2XcBzeRNNelVtXog/exec";




// Get login user

let user = JSON.parse(localStorage.getItem("user"));



if(!user){


window.location.href="login.html";


}

else{


let username = user.username;




fetch(API_URL,{

method:"POST",

headers:{

"Content-Type":
"application/x-www-form-urlencoded;charset=UTF-8"

},

body:

"action=account&username="+encodeURIComponent(username)


})



.then(response=>response.text())



.then(text=>{


console.log(text);



let data = JSON.parse(text);



if(data.success){



document.getElementById("loading").style.display="none";


document.getElementById("account").style.display="block";





document.getElementById("photo").src =

data.picture ||

"https://i.imgur.com/6VBx3io.png";



document.getElementById("name").innerHTML =
data.name;



document.getElementById("role").innerHTML =
data.role;



document.getElementById("username").innerHTML =
data.username;



document.getElementById("status").innerHTML =
data.status;



document.getElementById("number").innerHTML =
data.number;



document.getElementById("email").innerHTML =
data.email;



document.getElementById("department").innerHTML =
data.department;



document.getElementById("joinDate").innerHTML =
data.joinDate;



}

else{


document.getElementById("loading").innerHTML =
data.message;


}



})



.catch(error=>{


console.log(error);


document.getElementById("loading").innerHTML =
"Connection Error";


});



}



</script>


</body>

</html>
