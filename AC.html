<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Account | Link4</title>


<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}


body{

min-height:100vh;
background:linear-gradient(135deg,#07111f,#0b5c45);
display:flex;
justify-content:center;
align-items:center;
padding:20px;

}



.account-container{

width:95%;
max-width:900px;
background:#101c30;
border-radius:25px;
padding:40px;
box-shadow:0 20px 50px rgba(0,0,0,.5);
color:white;

}



/* Profile Header */

.profile-header{

text-align:center;
padding-bottom:30px;
border-bottom:1px solid #26364f;

}



.profile-header img{

width:170px;
height:170px;
border-radius:50%;
object-fit:cover;
border:6px solid #00d4ff;
box-shadow:0 0 25px #00d4ff;

}



.profile-header h1{

margin-top:20px;
font-size:32px;

}



.profile-header .role{

margin-top:8px;
font-size:18px;
color:#00d4ff;

}





/* Information */

.info-title{

margin-top:35px;
font-size:22px;
color:#00d4ff;
}



.info-box{

margin-top:20px;
display:grid;
grid-template-columns:1fr 1fr;
gap:20px;

}



.field{

background:#07111f;
padding:20px;
border-radius:15px;
border:1px solid #26364f;

}



.field label{

display:block;
color:#999;
font-size:14px;
margin-bottom:8px;

}



.field span{

font-size:18px;
font-weight:bold;
word-break:break-word;

}





@media(max-width:700px){


.info-box{

grid-template-columns:1fr;

}



.account-container{

padding:25px;

}



.profile-header img{

width:130px;
height:130px;

}


}


#loading{

text-align:center;
font-size:22px;

}


</style>


</head>


<body>




<div class="account-container">



<div id="loading">

Loading Account...

</div>




<div id="account" style="display:none;">



<div class="profile-header">


<img id="photo"
src="https://i.imgur.com/6VBx3io.png">



<h1 id="name">
</h1>


<div class="role" id="role">
</div>



</div>





<h2 class="info-title">
Account Information
</h2>



<div class="info-box">



<div class="field">

<label>
Username
</label>

<span id="username"></span>

</div>



<div class="field">

<label>
Status
</label>

<span id="status"></span>

</div>



<div class="field">

<label>
Phone Number
</label>

<span id="number"></span>

</div>




<div class="field">

<label>
Email
</label>

<span id="email"></span>

</div>




<div class="field">

<label>
Department
</label>

<span id="department"></span>

</div>




<div class="field">

<label>
Join Date
</label>

<span id="joinDate"></span>

</div>



</div>



</div>


</div>







<script>


const API_URL =
"https://script.google.com/macros/s/AKfycbzNw_d6tW3L3cFHtusSqUujnFSKC4gRYvIplxcNy2h9pUAO8AU1-K2XcBzeRNNelVtXog/exec";




// Get Login Data

let user = JSON.parse(localStorage.getItem("user"));



if(!user){


window.location.href="login.html";


}

else{


fetch(API_URL,{

method:"POST",

headers:{

"Content-Type":
"application/x-www-form-urlencoded;charset=UTF-8"

},


body:

"action=account&username="+encodeURIComponent(user.username)



})


.then(response=>response.text())


.then(result=>{


let data=JSON.parse(result);



if(data.success){



document.getElementById("loading").style.display="none";


document.getElementById("account").style.display="block";



document.getElementById("photo").src =

data.picture ||

"https://i.imgur.com/6VBx3io.png";



document.getElementById("name").innerHTML=data.name;


document.getElementById("role").innerHTML=data.role;


document.getElementById("username").innerHTML=data.username;


document.getElementById("status").innerHTML=data.status;


document.getElementById("number").innerHTML=data.number;


document.getElementById("email").innerHTML=data.email;


document.getElementById("department").innerHTML=data.department;


document.getElementById("joinDate").innerHTML=data.joinDate;



}

else{


document.getElementById("loading").innerHTML=
"Account Not Found";


}



})



.catch(error=>{


document.getElementById("loading").innerHTML=
"Connection Error";


});



}



</script>



</body>

</html>
