<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Account</title>


<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}


body{

    min-height:100vh;
    background:#07111f;
    display:flex;
    justify-content:center;
    align-items:center;
    color:white;

}



.account-box{

    width:380px;
    background:#101c30;
    padding:25px;
    border-radius:20px;
    box-shadow:0 0 30px #000;

}



.profile{

    text-align:center;

}



.profile img{

    width:120px;
    height:120px;
    border-radius:50%;
    object-fit:cover;
    border:4px solid #00d4ff;

}



.profile h2{

    margin-top:15px;

}



.role{

    color:#00d4ff;
    margin:8px;

}



.info{

    margin-top:20px;
    background:#07111f;
    padding:15px;
    border-radius:15px;

}



.row{

    display:flex;
    justify-content:space-between;
    padding:10px 0;
    border-bottom:1px solid #26364f;

}



.row:last-child{

    border:none;

}



.label{

    color:#aaa;

}



.value{

    font-weight:bold;
    max-width:180px;
    text-align:right;
    overflow-wrap:break-word;

}



#loading{

    text-align:center;
    font-size:18px;

}


</style>


</head>



<body>



<div class="account-box">



<div id="loading">

Loading Account...

</div>



<div id="account" style="display:none;">



<div class="profile">


<img id="photo" src="https://i.imgur.com/6VBx3io.png">


<h2 id="name"></h2>


<div class="role" id="role"></div>


</div>




<div class="info">



<div class="row">

<span class="label">
Username
</span>

<span class="value" id="username"></span>

</div>



<div class="row">

<span class="label">
Status
</span>

<span class="value" id="status"></span>

</div>



<div class="row">

<span class="label">
Number
</span>

<span class="value" id="number"></span>

</div>



<div class="row">

<span class="label">
Email
</span>

<span class="value" id="email"></span>

</div>



<div class="row">

<span class="label">
Department
</span>

<span class="value" id="department"></span>

</div>



<div class="row">

<span class="label">
Join Date
</span>

<span class="value" id="joinDate"></span>

</div>



</div>


</div>


</div>






<script>


// আপনার Apps Script Web App URL

const API_URL = "YOUR_WEB_APP_URL";




// Login User

const username = localStorage.getItem("username");



// যদি login না থাকে

if(!username){

    window.location.href="login.html";

}

else{


fetch(API_URL,{

method:"POST",

headers:{

"Content-Type":"application/x-www-form-urlencoded"

},


body:

"action=account&username="+encodeURIComponent(username)


})


.then(response=>response.json())


.then(data=>{


if(data.success){



document.getElementById("loading").style.display="none";


document.getElementById("account").style.display="block";



document.getElementById("photo").src =

data.picture ||

"https://i.imgur.com/6VBx3io.png";



document.getElementById("name").innerHTML=data.name;


document.getElementById("username").innerHTML=data.username;


document.getElementById("role").innerHTML=data.role;


document.getElementById("status").innerHTML=data.status;


document.getElementById("number").innerHTML=data.number;


document.getElementById("email").innerHTML=data.email;


document.getElementById("department").innerHTML=data.department;


document.getElementById("joinDate").innerHTML=data.joinDate;



}



else{


document.getElementById("loading").innerHTML=

"Account Not Found";


}



})



.catch(error=>{


document.getElementById("loading").innerHTML=

"Connection Error";


});



}



</script>



</body>

</html>
