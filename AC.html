<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Account | Link4</title>


<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}


body{

min-height:100vh;
background:linear-gradient(135deg,#07111f,#0b5c45);
display:flex;
justify-content:center;
align-items:center;
padding:20px;

}



.account-box{

width:100%;
max-width:850px;
background:#101c30;
padding:40px;
border-radius:25px;
box-shadow:0 20px 50px rgba(0,0,0,.5);
color:white;

}



.profile{

text-align:center;
border-bottom:1px solid #26364f;
padding-bottom:30px;

}



.profile img{

width:160px;
height:160px;
border-radius:50%;
object-fit:cover;
border:5px solid #00d4ff;

}



.profile h1{

margin-top:20px;
font-size:32px;

}



.profile p{

color:#00d4ff;
font-size:18px;

}




.title{

margin-top:30px;
font-size:24px;
color:#00d4ff;

}




.info{

margin-top:20px;

}



.row{

display:flex;
justify-content:space-between;
align-items:center;
background:#07111f;
padding:18px;
margin-bottom:12px;
border-radius:12px;

}



.label{

color:#aaa;
font-size:16px;

}



.value{

font-weight:bold;
font-size:17px;
text-align:right;
max-width:350px;
word-break:break-word;

}




.password-box{

display:flex;
gap:10px;
align-items:center;

}



.eye{

cursor:pointer;
color:#00d4ff;
font-size:20px;

}




#loading{

text-align:center;
font-size:22px;

}




@media(max-width:600px){

.account-box{

padding:25px;

}


.row{

flex-direction:column;
align-items:flex-start;
gap:8px;

}


.value{

text-align:left;

}

}


</style>


</head>



<body>



<div class="account-box">



<div id="loading">

Loading Account...

</div>




<div id="account" style="display:none;">



<div class="profile">


<img id="photo"
src="https://i.imgur.com/6VBx3io.png">


<h1 id="name"></h1>


<p id="role"></p>


</div>





<div class="title">

Account Information

</div>




<div class="info">



<div class="row">

<div class="label">
Username
</div>

<div class="value" id="username"></div>

</div>





<div class="row">

<div class="label">
Password
</div>


<div class="value password-box">

<span id="password">
********
</span>

<span class="eye" onclick="showPassword()">
👁
</span>

</div>

</div>





<div class="row">

<div class="label">
Status
</div>

<div class="value" id="status"></div>

</div>





<div class="row">

<div class="label">
Role
</div>

<div class="value" id="role2"></div>

</div>





<div class="row">

<div class="label">
Phone Number
</div>

<div class="value" id="number"></div>

</div>





<div class="row">

<div class="label">
Email
</div>

<div class="value" id="email"></div>

</div>





<div class="row">

<div class="label">
Department
</div>

<div class="value" id="department"></div>

</div>





<div class="row">

<div class="label">
Join Date
</div>

<div class="value" id="joinDate"></div>

</div>




</div>


</div>


</div>






<script>


const API_URL =
"https://script.google.com/macros/s/AKfycbzNw_d6tW3L3cFHtusSqUujnFSKC4gRYvIplxcNy2h9pUAO8AU1-K2XcBzeRNNelVtXog/exec";



let user = JSON.parse(localStorage.getItem("user"));



let realPassword="";





if(!user){

window.location.href="login.html";

}

else{


fetch(API_URL,{

method:"POST",

headers:{

"Content-Type":
"application/x-www-form-urlencoded;charset=UTF-8"

},

body:

"action=account&username="+encodeURIComponent(user.username)


})



.then(res=>res.json())


.then(data=>{


if(data.success){



document.getElementById("loading").style.display="none";


document.getElementById("account").style.display="block";



document.getElementById("photo").src =

data.picture || 
"https://i.imgur.com/6VBx3io.png";



document.getElementById("name").innerHTML=data.name;


document.getElementById("role").innerHTML=data.role;


document.getElementById("role2").innerHTML=data.role;


document.getElementById("username").innerHTML=data.username;


realPassword=data.password;


document.getElementById("status").innerHTML=data.status;


document.getElementById("number").innerHTML=data.number;


document.getElementById("email").innerHTML=data.email;


document.getElementById("department").innerHTML=data.department;


document.getElementById("joinDate").innerHTML=data.joinDate;



}

else{

document.getElementById("loading").innerHTML="Account Not Found";

}


})

.catch(()=>{

document.getElementById("loading").innerHTML="Connection Error";

});


}




function showPassword(){


let box=document.getElementById("password");


if(box.innerHTML=="********"){

box.innerHTML=realPassword;

}

else{

box.innerHTML="********";

}


}


</script>


</body>

</html>
