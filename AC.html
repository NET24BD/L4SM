<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Account</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}


body{

    min-height:100vh;
    background:#07111f;
    display:flex;
    justify-content:center;
    align-items:center;
    color:white;

}


.account-box{

    width:360px;
    background:#101c30;
    border-radius:20px;
    padding:25px;
    box-shadow:0 0 30px #000;

}


.profile{

    text-align:center;

}


.profile img{

    width:110px;
    height:110px;
    border-radius:50%;
    object-fit:cover;
    border:4px solid #00d4ff;
    margin-bottom:15px;

}


.profile h2{

    font-size:24px;
    margin-bottom:5px;

}


.role{

    color:#00d4ff;
    margin-bottom:20px;

}



.info{

    background:#07111f;
    padding:15px;
    border-radius:15px;

}



.row{

    display:flex;
    justify-content:space-between;
    padding:10px 0;
    border-bottom:1px solid #26364f;

}


.row:last-child{

    border:none;

}


.label{

    color:#aaa;

}


.value{

    font-weight:bold;
    text-align:right;

}


.loading{

    text-align:center;
    font-size:18px;

}


</style>

</head>


<body>


<div class="account-box">


<div id="loading" class="loading">

Loading Account...

</div>



<div id="account" style="display:none;">


<div class="profile">


<img id="photo" src="https://i.imgur.com/6VBx3io.png">


<h2 id="name">Name</h2>

<div class="role" id="role">
Role
</div>


</div>




<div class="info">


<div class="row">

<span class="label">Username</span>

<span class="value" id="username"></span>

</div>



<div class="row">

<span class="label">Status</span>

<span class="value" id="status"></span>

</div>



<div class="row">

<span class="label">Number</span>

<span class="value" id="number"></span>

</div>



<div class="row">

<span class="label">Email</span>

<span class="value" id="email"></span>

</div>



<div class="row">

<span class="label">Department</span>

<span class="value" id="department"></span>

</div>



<div class="row">

<span class="label">Join Date</span>

<span class="value" id="joinDate"></span>

</div>


</div>


</div>


</div>





<script>


const API_URL = "YOUR_WEB_APP_URL";



const username = localStorage.getItem("username");



if(!username){

    alert("Login Required");
    window.location.href="login.html";

}




fetch(API_URL,{

method:"POST",

headers:{

"Content-Type":"application/x-www-form-urlencoded"

},

body:

"action=account&username="+encodeURIComponent(username)


})


.then(res=>res.json())


.then(data=>{


if(data.success){



document.getElementById("loading").style.display="none";

document.getElementById("account").style.display="block";



document.getElementById("name").innerHTML=data.name;

document.getElementById("username").innerHTML=data.username;

document.getElementById("role").innerHTML=data.role;

document.getElementById("status").innerHTML=data.status;

document.getElementById("number").innerHTML=data.number;

document.getElementById("email").innerHTML=data.email;

document.getElementById("department").innerHTML=data.department;

document.getElementById("joinDate").innerHTML=data.joinDate;



if(data.picture){

document.getElementById("photo").src=data.picture;

}



}

else{


document.getElementById("loading").innerHTML="Account Not Found";


}



})

.catch(error=>{


document.getElementById("loading").innerHTML="Server Error";


});



</script>


</body>

</html>
