<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Control Dashboard</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <link rel="stylesheet" href="usercontrol.css">
</head>
<body>

<main class="main">
  <!-- TOP BAR -->
  <header class="topbar">
    <div class="page-title">
      <h1>User Control</h1>
      <p>Simple Management System</p>
    </div>

    <div class="top-right">
      <div class="search-box">
        <i class="fas fa-search"></i>
        <input id="searchUser" type="text" placeholder="Search User...">
      </div>

      <div class="profile-dropdown">
        <div class="profile" id="profileBtn">
          <img id="profileImage" src="https://i.imgur.com/2DhmtJ4.png" alt="Profile">
          <div>
            <h4 id="profileName">Administrator</h4>
            <span id="profileRole">Admin</span>
          </div>
        </div>
      </div>
    </div>
  </header>

  <!-- DASHBOARD CARDS -->
  <section class="dashboard-cards">
    <div class="card blue">
      <div class="card-icon"><i class="fas fa-users"></i></div>
      <div class="card-info">
        <h2 id="totalUsers">0</h2>
        <p>Total Users</p>
      </div>
    </div>

    <div class="card green">
      <div class="card-icon"><i class="fas fa-user-check"></i></div>
      <div class="card-info">
        <h2 id="activeUsers">0</h2>
        <p>Active Users</p>
      </div>
    </div>

    <div class="card red">
      <div class="card-icon"><i class="fas fa-user-slash"></i></div>
      <div class="card-info">
        <h2 id="inactiveUsers">0</h2>
        <p>Inactive/Blocked</p>
      </div>
    </div>
  </section>

  <!-- USER TABLE -->
  <section class="table-section">
    <div class="table-header">
      <h2><i class="fas fa-users"></i> User List</h2>
      <div class="table-buttons">
        <button id="refreshBtn" class="btn btn-primary"><i class="fas fa-rotate"></i> Refresh</button>
        <button id="addUserBtn" class="btn btn-success"><i class="fas fa-user-plus"></i> Add User</button>
      </div>
    </div>

    <div class="table-responsive">
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>Picture</th>
            <th>Username</th>
            <th>Password</th>
            <th>Name</th>
            <th>Role</th>
            <th>Status</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="userTableBody">
          <tr>
            <td colspan="8"><i class="fas fa-spinner fa-spin"></i> Loading Users...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </section>

  <!-- USER MODAL -->
  <div class="modal" id="userModal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="modalTitle">Add New User</h2>
        <button id="closeModal" class="close-btn"><i class="fas fa-times"></i></button>
      </div>

      <form id="userForm">
        <input type="hidden" id="row">

        <div class="form-grid">
          <div class="form-group">
            <label>Username</label>
            <input id="username" required>
          </div>

          <div class="form-group">
            <label>Password</label>
            <input id="password" required>
          </div>

          <div class="form-group">
            <label>Name</label>
            <input id="name" required>
          </div>

          <div class="form-group">
            <label>Role</label>
            <select id="role">
              <option>Admin</option>
              <option>Manager</option>
              <option>User</option>
            </select>
          </div>

          <div class="form-group">
            <label>Status</label>
            <select id="status">
              <option>Active</option>
              <option>Inactive</option>
              <option>Blocked</option>
            </select>
          </div>

          <div class="form-group">
            <label>Picture URL</label>
            <input id="picture" placeholder="https://...">
          </div>
        </div>

        <div class="modal-footer">
          <button type="button" id="cancelBtn" class="btn btn-secondary">Cancel</button>
          <button type="submit" class="btn btn-success">Save User</button>
        </div>
      </form>
    </div>
  </div>

  <!-- LOADING OVERLAY -->
  <div id="loading" class="loading-overlay">
    <div class="loader">
      <i class="fas fa-spinner fa-spin"></i>
      <p>Please Wait...</p>
    </div>
  </div>

  <!-- TOAST ALERT -->
  <div id="toast" class="toast"></div>
</main>

<script src="usercontrol.js"></script>
</body>
</html>
