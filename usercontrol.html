<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>User Control</title>

<link rel="stylesheet" href="usercontrol.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

</head>


<body>


<div class="container">



<header>


<!-- BACK BUTTON -->

<button class="back-btn" id="backBtn">

<i class="fa-solid fa-arrow-left"></i>

</button>




<!-- TITLE -->

<div class="title">

<h2>User Control</h2>

</div>






<!-- PROFILE -->

<div class="profile" id="profileBtn">


<img id="profileImg" src="profile.png">


<div class="profile-info">

<h4 id="userName">
Username
</h4>


<p>
Online
</p>


</div>





<!-- MENU -->

<div class="profile-menu" id="profileMenu">


<div id="accountBtn">

<i class="fa-solid fa-user"></i>

<span>My Account</span>

</div>



<div id="logoutBtn">

<i class="fa-solid fa-right-from-bracket"></i>

<span>Logout</span>

</div>



</div>




</div>



</header>








<!-- USER LIST -->


<div class="user-box">


<div class="top">


<h3>

<i class="fa-solid fa-users"></i>

Users List

</h3>



<button id="addUserBtn">

<i class="fa-solid fa-user-plus"></i>

Add User

</button>



</div>





<table>


<thead>

<tr>

<th>Picture</th>

<th>Username</th>

<th>Name</th>

<th>Role</th>

<th>Status</th>

<th>Action</th>

</tr>


</thead>



<tbody id="userTable">


<tr>

<td colspan="6">

Loading...

</td>

</tr>


</tbody>


</table>


</div>





</div>





<script src="usercontrol.js"></script>


</body>

</html>
