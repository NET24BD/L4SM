<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>User Control</title>


<!-- USER CONTROL CSS -->
<link
    rel="stylesheet"
    href="usercontrol.css"
>


<!-- FONT AWESOME -->
<link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
>


</head>


<body>


<!-- =====================================================
     MAIN CONTAINER
===================================================== -->

<div class="container">


    <!-- =================================================
         HEADER
    ================================================== -->

    <header>


        <!-- BACK BUTTON -->

        <button
            class="back-btn"
            id="backBtn"
            type="button"
        >

            <i class="fa-solid fa-arrow-left"></i>

        </button>


        <!-- TITLE -->

        <div class="title">

            <h2>
                User Control
            </h2>

        </div>


        <!-- =================================================
             PROFILE
        ================================================== -->

        <div
            class="profile"
            id="profileBtn"
        >


            <img
                id="profileImg"
                src="profile.png"
                alt="Profile"
            >


            <div class="profile-info">

                <h4 id="userName">
                    Username
                </h4>

                <p>
                    Online
                </p>

            </div>


            <!-- PROFILE MENU -->

            <div
                class="profile-menu"
                id="profileMenu"
            >


                <div id="accountBtn">

                    <i class="fa-solid fa-user"></i>

                    <span>
                        My Account
                    </span>

                </div>


                <div id="logoutBtn">

                    <i class="fa-solid fa-right-from-bracket"></i>

                    <span>
                        Logout
                    </span>

                </div>


            </div>


        </div>


    </header>



    <!-- =================================================
         USER LIST
    ================================================== -->

    <div class="user-box">


        <!-- TOP -->

        <div class="top">


            <!-- TITLE -->

            <h3>

                <i class="fa-solid fa-users"></i>

                Users List

            </h3>


            <!-- SEARCH -->

            <div class="search-box">

                <i class="fa-solid fa-search"></i>

                <input
                    type="text"
                    id="searchUser"
                    placeholder="Search User..."
                    autocomplete="off"
                >

            </div>


            <!-- ADD USER -->

            <button
                id="addUserBtn"
                type="button"
            >

                <i class="fa-solid fa-user-plus"></i>

                Add User

            </button>


        </div>



        <!-- =================================================
             TABLE
        ================================================== -->

        <div class="table-area">


            <table>


                <thead>

                    <tr>

                        <th>
                            Picture
                        </th>

                        <th>
                            Username
                        </th>

                        <th>
                            Name
                        </th>

                        <th>
                            Role
                        </th>

                        <th>
                            Status
                        </th>

                        <th>
                            Action
                        </th>

                    </tr>

                </thead>


                <tbody id="userTable">


                    <tr>

                        <td
                            colspan="6"
                        >

                            Loading...

                        </td>

                    </tr>


                </tbody>


            </table>


        </div>


    </div>



</div>



<!-- =====================================================
     USER FORM MODAL
===================================================== -->

<div
    class="modal"
    id="userModal"
>


    <div class="modal-box">


        <!-- CLOSE -->

        <button
            class="close-modal"
            id="closeModal"
            type="button"
        >

            <i class="fa-solid fa-xmark"></i>

        </button>


        <!-- TITLE -->

        <h2 id="formTitle">

            Add User

        </h2>


        <!-- USERNAME -->

        <input
            type="text"
            id="username"
            placeholder="Username"
            autocomplete="off"
        >


        <!-- PASSWORD -->

        <input
            type="password"
            id="password"
            placeholder="Password"
            autocomplete="new-password"
        >


        <!-- NAME -->

        <input
            type="text"
            id="name"
            placeholder="Full Name"
            autocomplete="off"
        >


        <!-- ROLE -->

        <select id="role">

            <option value="Admin">
                Admin
            </option>

            <option value="Support">
                Support
            </option>

            <option value="Caller">
                Caller
            </option>

            <option value="Manager">
                Manager
            </option>

            <option value="Guest">
                Guest
            </option>

        </select>


        <!-- STATUS -->

        <select id="status">

            <option value="Active">
                Active
            </option>

            <option value="Block">
                Block
            </option>

        </select>


        <!-- PICTURE URL -->

        <input
            type="text"
            id="picture"
            placeholder="Picture URL"
            autocomplete="off"
        >


        <!-- PICTURE PREVIEW -->

        <div
            id="picturePreview"
            class="picture-preview"
            style="display:none;"
        >

            <img
                id="picturePreviewImg"
                src=""
                alt="Picture Preview"
            >

        </div>


        <!-- FORM BUTTONS -->

        <div class="form-buttons">


            <button
                id="saveUser"
                type="button"
            >

                <i class="fa-solid fa-save"></i>

                Save

            </button>


            <button
                id="cancelUser"
                type="button"
            >

                Cancel

            </button>


        </div>


    </div>


</div>



<!-- =====================================================
     CUSTOM DELETE CONFIRMATION
===================================================== -->

<div
    class="delete-confirm-modal"
    id="deleteConfirmModal"
>


    <div class="delete-confirm-box">


        <!-- ICON -->

        <div class="delete-confirm-icon">

            <i class="fa-solid fa-trash-can"></i>

        </div>


        <!-- TITLE -->

        <h2>
            Delete User?
        </h2>


        <!-- MESSAGE -->

        <p id="deleteConfirmMessage">

            Are you sure you want to delete this user?

        </p>


        <!-- BUTTONS -->

        <div class="delete-confirm-buttons">


            <button
                type="button"
                id="deleteCancelBtn"
            >

                Cancel

            </button>


            <button
                type="button"
                id="deleteConfirmBtn"
            >

                <i class="fa-solid fa-trash"></i>

                Delete

            </button>


        </div>


    </div>


</div>



<!-- =====================================================
     SUCCESS / ERROR POPUP
===================================================== -->

<div
    class="popup"
    id="popupBox"
>


    <div class="popup-content">


        <!-- ICON -->

        <i
            id="popupIcon"
            class="fa-solid fa-circle-check"
        ></i>


        <!-- TITLE -->

        <h3 id="popupTitle">

            Success

        </h3>


        <!-- MESSAGE -->

        <p id="popupMessage">

            Done

        </p>


        <!-- OK -->

        <button
            id="popupBtn"
            type="button"
            onclick="closePopup()"
        >

            OK

        </button>


    </div>


</div>



<!-- =====================================================
     USER CONTROL JS
===================================================== -->

<script src="usercontrol.js"></script>


</body>

</html>
