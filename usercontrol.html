<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>User Control - L4SM</title>


<link rel="stylesheet" href="usercontrol.css">


<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">


</head>


<body>



<!-- =========================
TOP BAR
========================= -->

<header class="topbar">


<div class="logo">

<i class="fa-solid fa-users"></i>

L4SM User Control

</div>





<div class="profile">


<div class="profile-box"
onclick="toggleProfileMenu()">



<img id="profileImg"
src="assets/profile.png">



<span id="username">
User
</span>



<i class="fa-solid fa-chevron-down"></i>



</div>






<div id="profileMenu"
class="profile-menu">



<button onclick="openMyAccount()">

<i class="fa-solid fa-user"></i>

My Account

</button>



<button onclick="logout()">

<i class="fa-solid fa-right-from-bracket"></i>

Logout

</button>



</div>



</div>


</header>









<!-- =========================
MAIN
========================= -->


<div class="container">





<div class="page-header">


<h2>

<i class="fa-solid fa-user-gear"></i>

Manage Users

</h2>




<button class="add-btn"
onclick="openAddUser()">



<i class="fa-solid fa-plus"></i>

Add User


</button>



</div>









<!-- SEARCH -->

<div class="search-box">


<i class="fa-solid fa-search"></i>


<input 
type="text"
id="searchInput"
placeholder="Search user...">



</div>









<!-- USER TABLE -->


<div class="table-box">


<table>


<thead>

<tr>

<th>Picture</th>

<th>Username</th>

<th>Name</th>

<th>Role</th>

<th>Status</th>

<th>Action</th>


</tr>

</thead>



<tbody id="userTable">


<tr>

<td colspan="6">

Loading...

</td>


</tr>


</tbody>



</table>



</div>








</div>









<!-- =========================
ADD EDIT MODAL
========================= -->


<div id="userModal"
class="modal">



<div class="modal-content">



<div class="modal-header">


<h3 id="formTitle">

Add User

</h3>



<button onclick="closeModal()">

<i class="fa-solid fa-xmark"></i>

</button>



</div>









<div class="form-group">


<label>
Username
</label>


<input id="formUsername"
type="text">



</div>








<div class="form-group">


<label>
Password
</label>


<input id="formPassword"
type="password">



</div>








<div class="form-group">


<label>
Name
</label>


<input id="formName"
type="text">



</div>








<div class="form-group">


<label>
Role
</label>


<select id="formRole">


<option>Admin</option>

<option>Support</option>

<option>Caller</option>

<option>Manager</option>

<option>Guest</option>


</select>


</div>








<div class="form-group">


<label>
Status
</label>


<select id="formStatus">


<option>Active</option>

<option>Inactive</option>


</select>


</div>








<div class="form-group">


<label>
Picture URL
</label>


<input id="formPicture"
type="text">


</div>








<button class="save-btn"
onclick="saveUser()">



<i class="fa-solid fa-save"></i>

Save User



</button>





</div>



</div>









<!-- =========================
LOADING BOX
========================= -->


<div id="loadingBox"
class="loading-box">


<div class="loader"></div>


<span>
Please Wait...
</span>


</div>









<!-- =========================
MESSAGE POPUP
========================= -->


<div id="popup"
class="popup">


</div>









<script src="session.js"></script>

<script src="usercontrol.js"></script>



</body>

</html>
