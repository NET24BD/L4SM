<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>User Control</title>

<link rel="stylesheet" href="usercontrol.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

</head>


<body>


<div class="container">


<header>

<h2>
<i class="fa-solid fa-user-gear"></i>
User Control
</h2>


<button onclick="goBack()">
<i class="fa-solid fa-arrow-left"></i>
Back
</button>


</header>



<div class="user-box">


<div class="top">


<h3>Users List</h3>


<button onclick="addUser()">

<i class="fa-solid fa-user-plus"></i>
Add User

</button>


</div>




<table>


<thead>

<tr>

<th>Picture</th>

<th>Username</th>

<th>Name</th>

<th>Role</th>

<th>Status</th>

<th>Action</th>

</tr>

</thead>



<tbody id="userTable">


<tr>

<td colspan="6">
Loading Users...
</td>


</tr>


</tbody>


</table>



</div>



</div>



<script src="usercontrol.js"></script>


</body>

</html>
