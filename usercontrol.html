<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>User Control - L4SM</title>

    <link rel="stylesheet" href="usercontrol.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

</head>

<body>

    <!-- Sidebar -->

    <div class="sidebar" id="sidebar">

        <div class="menu-btn" onclick="toggleSidebar()">
            <i class="fa-solid fa-bars"></i>
        </div>

        <div class="logo">
            <i class="fa-solid fa-layer-group"></i>
            <span>L4SM</span>
        </div>

        <ul>

            <li onclick="openPage('dashboard.html')">
                <i class="fa-solid fa-house"></i>
                <span>Dashboard</span>
            </li>

            <li class="active">
                <i class="fa-solid fa-users"></i>
                <span>User Control</span>
            </li>

            <li onclick="openPage('support.html')">
                <i class="fa-solid fa-headset"></i>
                <span>Support</span>
            </li>

            <li onclick="openPage('call.html')">
                <i class="fa-solid fa-phone"></i>
                <span>Call</span>
            </li>

            <li onclick="openPage('manager.html')">
                <i class="fa-solid fa-user-tie"></i>
                <span>Manager</span>
            </li>

        </ul>

    </div>

    <!-- Main -->

    <div class="main">

        <header>

            <h2>User Control</h2>

            <div class="profile" onclick="toggleProfileMenu()">

                <img id="profileImg" src="assets/profile.png">

                <span id="headerName">User</span>

                <i class="fa-solid fa-angle-down"></i>

                <div class="profile-menu" id="profileMenu" onclick="event.stopPropagation()">

                    <button onclick="openPage('my-account.html')">
                        <i class="fa-solid fa-user"></i>
                        My Account
                    </button>

                    <button id="logoutBtn">
                        <i class="fa-solid fa-right-from-bracket"></i>
                        Logout
                    </button>

                </div>

            </div>

        </header>

        <!-- Top Bar -->

        <div class="top-bar">

            <div class="left">

                <h3>User Management</h3>

                <p>Manage all system users.</p>

            </div>

            <div class="right">

                <input type="text"
                    id="searchInput"
                    placeholder="Search user...">

                <button id="addUserBtn">
                    <i class="fa-solid fa-user-plus"></i>
                    Add User
                </button>

            </div>

        </div>

        <!-- Table -->

        <div class="table-box">

            <table>

                <thead>

                    <tr>

                        <th>Picture</th>

                        <th>Username</th>

                        <th>Name</th>

                        <th>Role</th>

                        <th>Status</th>

                        <th>Action</th>

                    </tr>

                </thead>

                <tbody id="userTable">

                    <!-- JS Load -->

                </tbody>

            </table>

        </div>

    </div>

    <!-- Add / Edit User Modal -->

    <div class="modal" id="userModal">

        <div class="modal-content">

            <div class="modal-header">

                <h2 id="modalTitle">

                    Add User

                </h2>

                <span class="close" id="closeModal">

                    &times;

                </span>

            </div>

            <div class="modal-body">

                <input type="hidden" id="oldUsername">

                <div class="form-group">

                    <label>Username</label>

                    <input type="text" id="username">

                </div>

                <div class="form-group">

                    <label>Password</label>

                    <input type="text" id="password">

                </div>

                <div class="form-group">

                    <label>Name</label>

                    <input type="text" id="name">

                </div>

                <div class="form-group">

                    <label>Role</label>

                    <select id="role">

                        <option>Admin</option>

                        <option>Support</option>

                        <option>Caller</option>

                        <option>Manager</option>

                    </select>

                </div>

                <div class="form-group">

                    <label>Status</label>

                    <select id="status">

                        <option>Active</option>

                        <option>Inactive</option>

                    </select>

                </div>

                <div class="form-group">

                    <label>Picture URL</label>

                    <input type="text" id="picture">
                </div>

            </div>

            <div class="modal-footer">

                <button class="save-btn" id="saveUser">

                    Save User

                </button>

                <button class="cancel-btn" id="cancelUser">

                    Cancel

                </button>

            </div>

        </div>

    </div>

    <!-- Loading -->

    <div id="loadingContainer"></div>

    <script src="session.js"></script>
    <script src="loading.js"></script>
    <script src="usercontrol.js"></script>

</body>

</html>
