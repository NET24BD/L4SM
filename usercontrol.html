<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>User Control</title>


<link rel="stylesheet" href="usercontrol.css">


<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">


</head>


<body>


<div class="container">



<!-- HEADER -->

<header>



<button class="back-btn" id="backBtn">

<i class="fa-solid fa-arrow-left"></i>

</button>




<div class="title">

<h2>User Control</h2>

</div>






<!-- PROFILE -->

<div class="profile" id="profileBtn">


<img id="profileImg" src="profile.png">



<div class="profile-info">


<h4 id="userName">
User
</h4>


<p>
Online
</p>


</div>





<div class="profile-menu" id="profileMenu">


<div id="accountBtn">

<i class="fa-solid fa-user"></i>

My Account

</div>



<div id="logoutBtn">

<i class="fa-solid fa-right-from-bracket"></i>

Logout

</div>



</div>



</div>



</header>









<!-- ADD USER BOX -->


<div class="user-box">



<div class="top">


<h3>

<i class="fa-solid fa-users"></i>

Users List

</h3>




<button id="addUserBtn">


<i class="fa-solid fa-user-plus"></i>

Add User


</button>



</div>






<!-- ADD FORM -->


<div class="add-form" id="addForm">



<input id="username"
placeholder="Username">



<input id="password"
placeholder="Password">



<input id="name"
placeholder="Name">



<select id="role">


<option value="Admin">
Admin
</option>


<option value="Support">
Support
</option>


<option value="Caller">
Caller
</option>


<option value="Guest">
Guest
</option>


</select>




<select id="status">


<option value="Active">
Active
</option>


<option value="Block">
Block
</option>


</select>




<input id="picture"
placeholder="Picture URL">





<button id="saveUser">


Save User

</button>



<button id="cancelUser">


Cancel

</button>



</div>









<!-- TABLE -->


<table>


<thead>


<tr>


<th>
Picture
</th>


<th>
Username
</th>


<th>
Name
</th>


<th>
Role
</th>


<th>
Status
</th>


<th>
Action
</th>



</tr>



</thead>




<tbody id="userTable">


<tr>

<td colspan="6">

Loading...

</td>

</tr>


</tbody>




</table>





</div>





</div>





<script src="usercontrol.js"></script>


</body>


</html>
