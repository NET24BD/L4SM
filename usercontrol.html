<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>User Control Dashboard</title>

<link rel="stylesheet" href="usercontrol.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

<div class="container">

    <!-- Header -->

    <header>

        <div class="logo">
            <i class="fa-solid fa-users-gear"></i>
            <h2>User Control</h2>
        </div>

        <div class="header-right">

            <div class="search">

                <i class="fa-solid fa-search"></i>

                <input
                type="text"
                id="searchUser"
                placeholder="Search User...">

            </div>

            <button id="addUserBtn">
                <i class="fa-solid fa-user-plus"></i>
                Add User
            </button>

        </div>

    </header>

    <!-- Cards -->

    <div class="cards">

        <div class="card blue">

            <i class="fa-solid fa-users"></i>

            <h3>Total User</h3>

            <span id="totalUser">0</span>

        </div>

        <div class="card green">

            <i class="fa-solid fa-user-check"></i>

            <h3>Active</h3>

            <span id="activeUser">0</span>

        </div>

        <div class="card red">

            <i class="fa-solid fa-user-xmark"></i>

            <h3>Blocked</h3>

            <span id="blockedUser">0</span>

        </div>

        <div class="card orange">

            <i class="fa-solid fa-user-clock"></i>

            <h3>Pending</h3>

            <span id="pendingUser">0</span>

        </div>

    </div>

    <!-- Table -->

    <div class="table-box">

        <table>

            <thead>

                <tr>

                    <th>Photo</th>

                    <th>Name</th>

                    <th>Username</th>

                    <th>Role</th>

                    <th>Status</th>

                    <th>Department</th>

                    <th>Join Date</th>

                    <th>Action</th>

                </tr>

            </thead>

            <tbody id="userTable">

            </tbody>

        </table>

    </div>

</div>

<!-- Popup -->

<div class="popup" id="popup">

    <div class="popup-content">

        <div class="popup-header">

            <h2>Add User</h2>

            <button id="closePopup">

                <i class="fa-solid fa-xmark"></i>

            </button>

        </div>

        <div class="form-grid">

            <input
            id="name"
            type="text"
            placeholder="Full Name">

            <input
            id="username"
            type="text"
            placeholder="Username">

            <input
            id="password"
            type="password"
            placeholder="Password">

            <select id="role">

                <option>Admin</option>

                <option>Support</option>

                <option>Call</option>

                <option>Manager</option>

            </select>

            <select id="status">

                <option>Active</option>

                <option>Blocked</option>

                <option>Pending</option>

            </select>

            <input
            id="department"
            type="text"
            placeholder="Department">

            <input
            id="joinDate"
            type="date">

            <input
            id="photo"
            type="text"
            placeholder="Photo URL">

        </div>

        <button id="saveUser">

            <i class="fa-solid fa-floppy-disk"></i>

            Save User

        </button>

    </div>

</div>

<script src="usercontrol.js"></script>

</body>

</html>
