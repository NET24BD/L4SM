<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>User Control Dashboard</title>

    <link rel="stylesheet" href="usercontrol.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

<div class="container">

    <!-- ===========================
         TOP BAR
    ============================ -->

    <div class="topbar">

        <a href="dashboard.html" class="back-btn">

            <i class="fa-solid fa-arrow-left"></i>

            Back to Dashboard

        </a>

        <div class="profile" id="profileMenu">

            <img
                src="images/default.png"
                id="profilePic">

            <div class="profile-info">

                <span id="loginName">

                    Loading...

                </span>

                <small id="loginRole">

                    User

                </small>

            </div>

            <i class="fa-solid fa-chevron-down"></i>

            <div class="profile-dropdown">

                <a href="#" id="logoutBtn">

                    <i class="fa-solid fa-right-from-bracket"></i>

                    Logout

                </a>

            </div>

        </div>

    </div>

    <!-- ===========================
         PAGE TITLE
    ============================ -->

    <div class="page-title">

        <h2>

            <i class="fa-solid fa-users-gear"></i>

            User Control

        </h2>

    </div>

    <!-- ===========================
         DASHBOARD CARD
    ============================ -->

    <div class="cards">

        <div class="card total">

            <div>

                <h4>Total User</h4>

                <h2 id="totalUser">

                    0

                </h2>

            </div>

            <i class="fa-solid fa-users"></i>

        </div>

        <div class="card active">

            <div>

                <h4>Active User</h4>

                <h2 id="activeUser">

                    0

                </h2>

            </div>

            <i class="fa-solid fa-user-check"></i>

        </div>

        <div class="card blocked">

            <div>

                <h4>Blocked User</h4>

                <h2 id="blockedUser">

                    0

                </h2>

            </div>

            <i class="fa-solid fa-user-lock"></i>

        </div>

    </div>

    <!-- ===========================
         TOOLBAR
    ============================ -->

    <div class="toolbar">

        <button id="addUserBtn">

            <i class="fa-solid fa-user-plus"></i>

            Add User

        </button>

        <div class="search-box">

            <i class="fa-solid fa-search"></i>

            <input
                type="text"
                id="searchUser"
                placeholder="Search User...">

        </div>

    </div>

    <!-- ===========================
         USER TABLE
    ============================ -->

    <div class="table-area">

        <table>

            <thead>

                <tr>

                    <th>Name</th>

                    <th>Username</th>

                    <th>Role</th>

                    <th>Status</th>

                    <th width="70">

                        Action

                    </th>

                </tr>

            </thead>

            <tbody id="userTable">

                <!-- JavaScript Load -->

            </tbody>

        </table>

    </div>
        <!-- ==========================================
         ADD / EDIT USER POPUP
    =========================================== -->

    <div class="popup" id="userPopup">

        <div class="popup-content">

            <div class="popup-header">

                <h2 id="popupTitle">

                    <i class="fa-solid fa-user-plus"></i>
                    Add User

                </h2>

                <button type="button" id="closePopup">

                    <i class="fa-solid fa-xmark"></i>

                </button>

            </div>

            <form id="userForm">

                <div class="form-grid">

                    <div class="form-group">

                        <label>Full Name</label>

                        <input
                            type="text"
                            id="name"
                            placeholder="Enter Full Name"
                            required>

                    </div>

                    <div class="form-group">

                        <label>Username</label>

                        <input
                            type="text"
                            id="username"
                            placeholder="Enter Username"
                            required>

                    </div>

                    <div class="form-group">

                        <label>Password</label>

                        <input
                            type="password"
                            id="password"
                            placeholder="Enter Password"
                            required>

                    </div>

                    <div class="form-group">

                        <label>Role</label>

                        <select id="role">

                            <option value="Admin">Admin</option>
                            <option value="Support">Support</option>
                            <option value="Call">Call</option>
                            <option value="Manager">Manager</option>
                            <option value="Guest">Guest</option>

                        </select>

                    </div>

                    <div class="form-group">

                        <label>Status</label>

                        <select id="status">

                            <option value="Active">Active</option>
                            <option value="Blocked">Blocked</option>

                        </select>

                    </div>

                    <div class="form-group">

                        <label>Profile Photo URL</label>

                        <input
                            type="url"
                            id="photo"
                            placeholder="https://example.com/photo.jpg">

                    </div>

                </div>

                <div class="popup-footer">

                    <button
                        type="button"
                        class="cancel-btn"
                        id="cancelBtn">

                        Cancel

                    </button>

                    <button
                        type="submit"
                        class="save-btn">

                        <i class="fa-solid fa-floppy-disk"></i>

                        Save User

                    </button>

                </div>

            </form>

        </div>

    </div>

    <!-- ==========================================
         ACTION MENU
    =========================================== -->

    <div class="action-menu" id="actionMenu">

        <button id="editUser">

            <i class="fa-solid fa-pen"></i>

            Edit User

        </button>

        <button id="blockUser">

            <i class="fa-solid fa-user-lock"></i>

            Block / Unblock

        </button>

        <button class="delete" id="deleteUser">

            <i class="fa-solid fa-trash"></i>

            Delete User

        </button>

    </div>

    <!-- ==========================================
         DELETE CONFIRMATION
    =========================================== -->

    <div class="confirm-box" id="deletePopup">

        <div class="confirm-content">

            <i class="fa-solid fa-circle-exclamation warning-icon"></i>

            <h2>Delete User?</h2>

            <p>

                Are you sure you want to delete this user?
                This action cannot be undone.

            </p>

            <div class="confirm-btn">

                <button
                    type="button"
                    id="cancelDelete">

                    Cancel

                </button>

                <button
                    type="button"
                    id="confirmDelete">

                    Delete

                </button>

            </div>

        </div>

    </div>

</div>

<!-- ==========================
     JAVASCRIPT
========================== -->

<script src="usercontrol.js"></script>

</body>

</html>
