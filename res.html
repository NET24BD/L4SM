<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Access Denied</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:linear-gradient(135deg,#0f172a,#1e293b);
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.card{
    width:380px;
    max-width:90%;
    background:#fff;
    border-radius:20px;
    padding:35px;
    text-align:center;
    box-shadow:0 15px 40px rgba(0,0,0,.35);
    animation:show .4s ease;
}

@keyframes show{
    from{
        opacity:0;
        transform:translateY(20px) scale(.95);
    }
    to{
        opacity:1;
        transform:translateY(0) scale(1);
    }
}

.icon{
    font-size:70px;
    margin-bottom:15px;
}

h1{
    color:#d32f2f;
    margin-bottom:10px;
}

p{
    color:#555;
    line-height:24px;
    margin-bottom:30px;
}

.btn{
    display:inline-block;
    background:#2563eb;
    color:#fff;
    text-decoration:none;
    padding:12px 28px;
    border-radius:10px;
    font-size:16px;
    transition:.3s;
}

.btn:hover{
    background:#1d4ed8;
}
</style>

</head>
<body>

<div class="card">

    <div class="icon">🔒</div>

    <h1>Access Denied</h1>

    <p>
        You don't have permission to access this page.<br>
        Please login with an authorized account.
    </p>

    <a href="login.html" class="btn">Login</a>

</div>

</body>
</html>
