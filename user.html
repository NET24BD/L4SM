<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>User Control Dashboard</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">


<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}


body{
background:#f1f5f9;
}


/* SIDEBAR */

.sidebar{

position:fixed;
top:0;
left:0;
width:260px;
height:100vh;
background:#0f172a;
color:white;
padding:20px;
transition:.3s;

}


.sidebar.hide{
left:-260px;
}


.logo{

font-size:24px;
font-weight:bold;
margin-bottom:35px;

}


.menu a{

display:flex;
gap:15px;
padding:14px;
color:white;
text-decoration:none;
border-radius:8px;
margin-bottom:8px;

}


.menu a:hover{

background:#1e293b;

}



/* MAIN */

.main{

margin-left:260px;
padding:25px;
transition:.3s;

}


.main.full{

margin-left:0;

}



.topbar{

background:white;
padding:15px 20px;
border-radius:12px;
display:flex;
justify-content:space-between;
align-items:center;

}


.toggle{

font-size:25px;
cursor:pointer;

}




/* CARDS */

.cards{

display:grid;
grid-template-columns:repeat(4,1fr);
gap:20px;
margin-top:25px;

}



.card{

background:white;
padding:25px;
border-radius:15px;
box-shadow:0 5px 15px #ddd;

}



.card h2{

font-size:30px;

}





/* BOX */

.box{

background:white;
padding:25px;
border-radius:15px;
margin-top:25px;

}



.btn{

padding:9px 15px;
border:none;
border-radius:7px;
cursor:pointer;

}


.add{

background:#16a34a;
color:white;

}


.edit{

background:#2563eb;
color:white;

}


.block-btn{

background:#f59e0b;
color:white;

}



.search{

padding:12px;
border:1px solid #ddd;
border-radius:8px;

}




/* TABLE */


table{

width:100%;
border-collapse:collapse;
margin-top:20px;

}


th{

background:#0f172a;
color:white;

}


td,th{

padding:12px;
text-align:center;
border-bottom:1px solid #ddd;

}


.active{

color:green;
font-weight:bold;

}


.blocked{

color:red;
font-weight:bold;

}





/* MODAL */


.modal{

display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,.5);
align-items:center;
justify-content:center;
z-index:999;

}



.modal-box{

background:white;
width:750px;
padding:25px;
border-radius:15px;

}



.modal-head{

display:flex;
justify-content:space-between;
margin-bottom:20px;

}



.close{

font-size:22px;
cursor:pointer;

}



.form-grid{

display:grid;
grid-template-columns:1fr 1fr;
gap:15px;

}



.form-grid input,
.form-grid select,
.form-grid textarea{

width:100%;
padding:12px;
border:1px solid #ddd;
border-radius:8px;

}


textarea{

height:80px;

}



label{

font-weight:bold;
display:block;
margin-bottom:5px;

}



.save{

background:#16a34a;
color:white;

}



@media(max-width:900px){


.cards{

grid-template-columns:1fr;

}


.main{

margin-left:0;

}


.form-grid{

grid-template-columns:1fr;

}


.modal-box{

width:90%;

}


}


</style>


</head>



<body>



<!-- SIDEBAR -->

<div class="sidebar" id="sidebar">


<div class="logo">

<i class="fa fa-users"></i>

User Control

</div>


<div class="menu">


<a href="#">

<i class="fa fa-home"></i>

Dashboard

</a>



<a href="#">

<i class="fa fa-users"></i>

Users

</a>



<a href="#">

<i class="fa fa-user-shield"></i>

Roles

</a>



<a href="#">

<i class="fa fa-gear"></i>

Settings

</a>



<a href="#">

<i class="fa fa-right-from-bracket"></i>

Logout

</a>


</div>


</div>







<!-- MAIN -->


<div class="main" id="main">



<div class="topbar">


<div class="toggle" onclick="menu()">

<i class="fa fa-bars"></i>

</div>


<h2>User Management</h2>


<i class="fa fa-user-circle fa-2x"></i>


</div>






<div class="cards">


<div class="card">

<h2>250</h2>

<p>Total User</p>

</div>


<div class="card">

<h2>220</h2>

<p>Active User</p>

</div>


<div class="card">

<h2>30</h2>

<p>Blocked</p>

</div>


<div class="card">

<h2>10</h2>

<p>Admin</p>

</div>


</div>







<div class="box">


<div style="display:flex;justify-content:space-between;">


<h2>User List</h2>


<button class="btn add" onclick="openUserForm()">

<i class="fa fa-user-plus"></i>

Add User

</button>


</div>



<br>


<input class="search" placeholder="Search User">



<table>


<tr>

<th>ID</th>
<th>Picture</th>
<th>Name</th>
<th>Username</th>
<th>Role</th>
<th>Status</th>
<th>Action</th>


</tr>



<tr>

<td>1</td>


<td>

<img src="https://i.imgur.com/6VBx3io.png"
width="40"
height="40"
style="border-radius:50%">

</td>


<td>Fahim</td>

<td>admin</td>

<td>Admin</td>


<td class="active">

Active

</td>


<td>


<button class="btn edit">

<i class="fa fa-edit"></i>

Edit

</button>



<button class="btn block-btn">

<i class="fa fa-ban"></i>

Block

</button>


</td>


</tr>



</table>


</div>



</div>









<!-- ADD USER FORM -->


<div class="modal" id="userModal">


<div class="modal-box">



<div class="modal-head">


<h2>Add New User</h2>


<span class="close" onclick="closeUserForm()">

✖

</span>


</div>





<div class="form-grid">


<div>

<label>Username</label>

<input placeholder="Username">

</div>



<div>

<label>Password</label>

<input type="password">

</div>



<div>

<label>Name</label>

<input>

</div>




<div>

<label>Role</label>

<select>

<option>Select Role</option>

<option>Admin</option>

<option>Manager</option>

<option>Support</option>

<option>Call</option>

</select>


</div>




<div>

<label>Status</label>

<select>

<option>Active</option>

<option>Blocked</option>

</select>

</div>




<div>

<label>Picture URL</label>

<input placeholder="Image URL">

</div>




<div>

<label>Number</label>

<input>

</div>



<div>

<label>Email</label>

<input>

</div>



<div>

<label>Department</label>

<input>

</div>



<div>

<label>Join Date</label>

<input type="date">

</div>




<div style="grid-column:1/3;">


<label>Address</label>

<textarea></textarea>


</div>



</div>




<br>


<button class="btn save">

Save User

</button>


</div>


</div>






<script>


function menu(){

document.getElementById("sidebar")
.classList.toggle("hide");


document.getElementById("main")
.classList.toggle("full");


}




function openUserForm(){

document.getElementById("userModal")
.style.display="flex";

}



function closeUserForm(){

document.getElementById("userModal")
.style.display="none";

}


</script>



</body>

</html>
