<!-- LOADING -->

<div class="loader"></div>

</div>





<!-- NOTIFICATION -->


<div id="notify"></div>









<script>



const API_URL =
"https://script.google.com/macros/s/AKfycbzNw_d6tW3L3cFHtusSqUujnFSKC4gRYvIplxcNy2h9pUAO8AU1-K2XcBzeRNNelVtXog/exec";



let users=[];

let deleteUsername="";







// SIDEBAR


function toggleSidebar(){


document
.getElementById("sidebar")
.classList.toggle("active");


}









// LOADING


function loading(x){


document.getElementById("loadingBox")
.style.display=x?"block":"none";


}








// NOTIFY


function notify(msg,type="success"){


let n=document.getElementById("notify");


n.innerHTML=msg;


n.style.background=
type=="error"?
"#e74c3c":
"#063b32";


n.style.display="block";



setTimeout(()=>{

n.style.display="none";

},2500);



}











// LOAD USERS


function loadUsers(){


loading(true);



fetch(API_URL,{

method:"POST",

headers:{


"Content-Type":
"application/x-www-form-urlencoded"


},


body:"action=getUsers"


})


.then(r=>r.json())


.then(data=>{


loading(false);



if(data.success){


users=data.users;


showUsers(users);


countUsers();


}


})

.catch(()=>{


loading(false);


notify("Connection Error","error");


});



}











// SHOW USER


function showUsers(list){



let html="";



list.forEach(u=>{



html+=`

<tr>


<td>

<img class="profile-img"

src="${u.picture || 'https://i.imgur.com/6VBx3io.png'}">

</td>



<td>${u.name}</td>


<td>${u.username}</td>


<td>${u.role}</td>


<td>${u.status}</td>



<td>


<button class="edit-btn"

onclick='editUser(${JSON.stringify(u)})'>

Edit

</button>



<button class="status-btn"

onclick="changeStatus('${u.username}','${u.status}')">

${u.status}

</button>


</td>



</tr>

`;



});




document.getElementById("userList")
.innerHTML=html;


}









// COUNT


function countUsers(){


total.innerHTML=users.length;


active.innerHTML=
users.filter(x=>x.status=="Active").length;


inactive.innerHTML=
users.filter(x=>x.status=="Inactive").length;


blocked.innerHTML=
users.filter(x=>x.status=="Blocked").length;


}










// SEARCH


function searchUser(){


let t=
search.value.toLowerCase();



showUsers(

users.filter(u=>

u.name.toLowerCase().includes(t)

||
u.username.toLowerCase().includes(t)

)

);



}









// START


loadUsers();



</script>
<script>





// OPEN FORM


function openForm(){


clearForm();


document.getElementById("modal")
.style.display="flex";


}









// CLOSE FORM


function closeForm(){


document.getElementById("modal")
.style.display="none";


}









// CLEAR FORM


function clearForm(){


row.value="";

username.value="";

password.value="";

name.value="";

role.value="";

status.value="Active";

number.value="";

picture.value="";

address.value="";

email.value="";

department.value="";

joinDate.value="";

deleteUsername="";


}









// EDIT USER


function editUser(u){



deleteUsername=u.username;



row.value=u.row || "";

username.value=u.username || "";

password.value=u.password || "";

name.value=u.name || "";

role.value=u.role || "";

status.value=u.status || "Active";

number.value=u.number || "";

picture.value=u.picture || "";

address.value=u.address || "";

email.value=u.email || "";

department.value=u.department || "";

joinDate.value=u.joinDate || "";




document.getElementById("modal")
.style.display="flex";



}









// SAVE USER


function saveUser(){



let action =

row.value ?

"updateUser" :

"addUser";







let body =


"action="+action+

"&row="+encodeURIComponent(row.value)+

"&username="+encodeURIComponent(username.value)+

"&password="+encodeURIComponent(password.value)+

"&name="+encodeURIComponent(name.value)+

"&role="+encodeURIComponent(role.value)+

"&status="+encodeURIComponent(status.value)+

"&number="+encodeURIComponent(number.value)+

"&picture="+encodeURIComponent(picture.value)+

"&address="+encodeURIComponent(address.value)+

"&email="+encodeURIComponent(email.value)+

"&department="+encodeURIComponent(department.value)+

"&joinDate="+encodeURIComponent(joinDate.value);







loading(true);



fetch(API_URL,{

method:"POST",

headers:{

"Content-Type":

"application/x-www-form-urlencoded"

},


body:body


})



.then(r=>r.json())


.then(data=>{


loading(false);



notify(
data.message || "Saved"
);



closeForm();


loadUsers();



})



.catch(()=>{


loading(false);


notify(
"Save Failed",
"error"
);


});



}











// DELETE USER FROM EDIT


function deleteCurrentUser(){



if(!deleteUsername){


notify(
"Select User First",
"error"
);


return;


}




if(confirm("Delete this user?")){



fetch(API_URL,{

method:"POST",

headers:{


"Content-Type":

"application/x-www-form-urlencoded"


},


body:

"action=deleteUser&username="
+
encodeURIComponent(deleteUsername)


})



.then(r=>r.json())


.then(data=>{


notify(data.message);


closeForm();


loadUsers();


});



}



}











// CHANGE STATUS


function changeStatus(username,status){



let newStatus =


status=="Active"

?

"Blocked"

:

"Active";






fetch(API_URL,{

method:"POST",

headers:{


"Content-Type":

"application/x-www-form-urlencoded"


},


body:

"action=updateStatus"+

"&username="+encodeURIComponent(username)+

"&status="+encodeURIComponent(newStatus)



})



.then(r=>r.json())


.then(data=>{


notify(data.message);


loadUsers();



});



}







</script>
