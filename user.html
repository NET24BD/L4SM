<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>User Management | Link4</title>


<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}


body{

background:#f5f7fb;
color:#222;
padding:25px;

}



.container{

max-width:1200px;
margin:auto;

}



.header{

background:#ffffff;
padding:25px;
border-radius:20px;
display:flex;
justify-content:space-between;
align-items:center;
box-shadow:0 5px 20px rgba(0,0,0,.08);

}


.header h1{

color:#0b5c45;

}



button{

border:none;
padding:12px 18px;
border-radius:10px;
cursor:pointer;
font-weight:bold;

}



.add-btn{

background:#0b5c45;
color:white;

}





.cards{

display:grid;
grid-template-columns:repeat(4,1fr);
gap:20px;
margin-top:25px;

}



.card{

background:white;
padding:25px;
border-radius:18px;
text-align:center;
box-shadow:0 5px 20px rgba(0,0,0,.08);

}



.card h2{

font-size:30px;
color:#0b5c45;

}




.search-box{

margin-top:25px;
width:100%;
padding:15px;
border:none;
border-radius:12px;
font-size:16px;
background:white;
box-shadow:0 5px 20px rgba(0,0,0,.08);

}





.table-box{

margin-top:25px;
background:white;
padding:25px;
border-radius:20px;
box-shadow:0 5px 20px rgba(0,0,0,.08);
overflow:auto;

}



table{

width:100%;
border-collapse:collapse;

}


th{

background:#0b5c45;
color:white;
padding:15px;

}



td{

padding:15px;
text-align:center;
border-bottom:1px solid #eee;

}



.profile-img{

width:45px;
height:45px;
border-radius:50%;
object-fit:cover;

}



.edit-btn{

background:#3498db;
color:white;

}


.delete-btn{

background:#e74c3c;
color:white;

}






/* MODAL */


.modal{

display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,.5);
justify-content:center;
align-items:center;

}



.form-box{

background:white;
width:420px;
padding:30px;
border-radius:20px;

}



.form-box h2{

margin-bottom:15px;

}



.form-box input,
.form-box select{

width:100%;
padding:12px;
margin:7px 0;
border:1px solid #ddd;
border-radius:10px;

}



.save-btn{

width:100%;
background:#0b5c45;
color:white;

}



.close-btn{

width:100%;
margin-top:10px;
background:#e74c3c;
color:white;

}





@media(max-width:800px){


.cards{

grid-template-columns:1fr 1fr;

}


.header{

flex-direction:column;
gap:15px;

}


}


</style>


</head>


<body>



<div class="container">



<div class="header">


<h1>
User Management
</h1>


<button class="add-btn" onclick="openForm()">
+ Add User
</button>


</div>






<div class="cards">


<div class="card">

<h2 id="total">
0
</h2>

<p>Total User</p>

</div>



<div class="card">

<h2 id="active">
0
</h2>

<p>Active</p>

</div>



<div class="card">

<h2 id="inactive">
0
</h2>

<p>Inactive</p>

</div>



<div class="card">

<h2 id="blocked">
0
</h2>

<p>Blocked</p>

</div>



</div>






<input

class="search-box"

id="search"

placeholder="Search User..."

onkeyup="searchUser()"

>






<div class="table-box">


<table>


<thead>

<tr>

<th>
Picture
</th>


<th>
Name
</th>


<th>
Username
</th>


<th>
Role
</th>


<th>
Status
</th>


<th>
Action
</th>


</tr>


</thead>



<tbody id="userList">


</tbody>



</table>



</div>




</div>








<!-- ADD EDIT FORM -->


<div class="modal" id="modal">


<div class="form-box">


<h2>
User Information
</h2>



<input id="row" type="hidden">



<input id="username" placeholder="Username">


<input id="password" placeholder="Password">


<input id="name" placeholder="Name">


<input id="role" placeholder="Role">



<select id="status">

<option>Active</option>

<option>Inactive</option>

<option>Blocked</option>

</select>




<input id="picture" placeholder="Picture URL">


<input id="address" placeholder="Address">


<input id="email" placeholder="Email">


<input id="department" placeholder="Department">


<input id="joinDate" placeholder="DD-MM-YYYY">



<button class="save-btn" onclick="saveUser()">
Save
</button>



<button class="close-btn" onclick="closeForm()">
Close
</button>



</div>

<script>


const API_URL =
"https://script.google.com/macros/s/AKfycbzNw_d6tW3L3cFHtusSqUujnFSKC4gRYvIplxcNy2h9pUAO8AU1-K2XcBzeRNNelVtXog/exec";



let users=[];






// LOAD USERS

function loadUsers(){


fetch(API_URL,{

method:"POST",

headers:{

"Content-Type":
"application/x-www-form-urlencoded"

},

body:"action=getUsers"

})


.then(response=>response.json())


.then(data=>{


if(data.success){


users=data.users;


showUsers(users);


countUsers();


}



});


}









// SHOW USERS TABLE


function showUsers(data){


let html="";



data.forEach(u=>{


html+=`

<tr>


<td>

<img class="profile-img"

src="${u.picture || 'https://i.imgur.com/6VBx3io.png'}">

</td>



<td>${u.name}</td>


<td>${u.username}</td>


<td>${u.role}</td>


<td>${u.status}</td>



<td>


<button class="edit-btn"

onclick='editUser(${JSON.stringify(u)})'>

Edit

</button>



<button class="delete-btn"

onclick="deleteUser('${u.username}')">

Delete

</button>


</td>



</tr>


`;


});




document.getElementById("userList").innerHTML=html;


}









// COUNT USER


function countUsers(){



document.getElementById("total").innerHTML=
users.length;



document.getElementById("active").innerHTML=

users.filter(
x=>x.status=="Active"
).length;



document.getElementById("inactive").innerHTML=

users.filter(
x=>x.status=="Inactive"
).length;



document.getElementById("blocked").innerHTML=

users.filter(
x=>x.status=="Blocked"
).length;



}










// SEARCH


function searchUser(){



let text =

document.getElementById("search")
.value
.toLowerCase();




let result = users.filter(u=>


u.name.toLowerCase().includes(text)

||

u.username.toLowerCase().includes(text)



);



showUsers(result);



}









// OPEN FORM


function openForm(){


clearForm();


document.getElementById("modal")
.style.display="flex";


}






// CLOSE FORM


function closeForm(){


document.getElementById("modal")
.style.display="none";


}









// CLEAR FORM


function clearForm(){



document.getElementById("row").value="";


document.getElementById("username").value="";


document.getElementById("password").value="";


document.getElementById("name").value="";


document.getElementById("role").value="";


document.getElementById("status").value="Active";


document.getElementById("picture").value="";


document.getElementById("address").value="";


document.getElementById("email").value="";


document.getElementById("department").value="";


document.getElementById("joinDate").value="";



}









// EDIT USER


function editUser(u){



document.getElementById("row").value=u.row;


document.getElementById("username").value=u.username;


document.getElementById("password").value=u.password;


document.getElementById("name").value=u.name;


document.getElementById("role").value=u.role;


document.getElementById("status").value=u.status;


document.getElementById("picture").value=u.picture;


document.getElementById("address").value=u.address;


document.getElementById("email").value=u.email;


document.getElementById("department").value=u.department;


document.getElementById("joinDate").value=u.joinDate;



document.getElementById("modal")
.style.display="flex";



}









// SAVE USER


function saveUser(){



let row =
document.getElementById("row").value;



let action =
row ? "updateUser" : "addUser";





let body =

"action="+action+

"&row="+row+

"&username="+
encodeURIComponent(username.value)+

"&password="+
encodeURIComponent(password.value)+

"&name="+
encodeURIComponent(name.value)+

"&role="+
encodeURIComponent(role.value)+

"&status="+
encodeURIComponent(status.value)+

"&picture="+
encodeURIComponent(picture.value)+

"&address="+
encodeURIComponent(address.value)+

"&email="+
encodeURIComponent(email.value)+

"&department="+
encodeURIComponent(department.value)+

"&joinDate="+
encodeURIComponent(joinDate.value);







fetch(API_URL,{

method:"POST",

headers:{

"Content-Type":
"application/x-www-form-urlencoded"

},

body:body


})



.then(response=>response.json())



.then(data=>{


alert(data.message);



closeForm();


loadUsers();



});



}









// DELETE USER


function deleteUser(username){



if(confirm("Are you sure delete this user?")){



fetch(API_URL,{

method:"POST",

headers:{

"Content-Type":
"application/x-www-form-urlencoded"

},

body:

"action=deleteUser&username="
+
encodeURIComponent(username)


})



.then(response=>response.json())



.then(data=>{


alert(data.message);


loadUsers();



});



}


}







// START

loadUsers();



</script>


</body>

</html>

</div>
