<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Link4 User Management</title>


<style>


*{

margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;

}



body{

background:#f5f7fb;

color:#222;

padding:25px;

}




.container{

max-width:1250px;

margin:auto;

}





.header{

background:white;

padding:25px;

border-radius:20px;

display:flex;

justify-content:space-between;

align-items:center;

box-shadow:0 5px 20px rgba(0,0,0,.08);

}



.header h1{

color:#0b5c45;

}





.add-btn{

background:#0b5c45;

color:white;

border:none;

padding:13px 25px;

border-radius:12px;

cursor:pointer;

}





.cards{

margin-top:25px;

display:grid;

grid-template-columns:repeat(4,1fr);

gap:20px;

}





.card{

background:white;

padding:25px;

border-radius:18px;

text-align:center;

box-shadow:0 5px 20px rgba(0,0,0,.08);

}





.card h2{

font-size:32px;

color:#0b5c45;

}





.search{

margin-top:25px;

width:100%;

padding:15px;

border:none;

outline:none;

border-radius:12px;

font-size:16px;

box-shadow:0 5px 20px rgba(0,0,0,.08);

}







.table-box{

margin-top:25px;

background:white;

padding:25px;

border-radius:20px;

box-shadow:0 5px 20px rgba(0,0,0,.08);

overflow:auto;

}





table{

width:100%;

border-collapse:collapse;

}





th{

background:#0b5c45;

color:white;

padding:15px;

}





td{

padding:15px;

text-align:center;

border-bottom:1px solid #eee;

}





.profile-img{

width:45px;

height:45px;

border-radius:50%;

object-fit:cover;

}





button{

cursor:pointer;

border:none;

border-radius:8px;

padding:10px 15px;

font-weight:bold;

}




.edit-btn{

background:#3498db;

color:white;

}




.delete-btn{

background:#e74c3c;

color:white;

}






/* LOADING BOX */


#loadingBox{


display:none;

position:fixed;

top:50%;

left:50%;

transform:translate(-50%,-50%);

background:white;

padding:25px 35px;

border-radius:15px;

box-shadow:0 10px 30px rgba(0,0,0,.2);

z-index:999;


}





.loader{


width:40px;

height:40px;

border:5px solid #ddd;

border-top:5px solid #0b5c45;

border-radius:50%;

animation:spin 1s linear infinite;

margin:auto;


}




@keyframes spin{


100%{

transform:rotate(360deg);

}


}








/* NOTIFICATION */


#notify{


display:none;

position:fixed;

right:25px;

top:25px;

background:#0b5c45;

color:white;

padding:15px 25px;

border-radius:12px;

box-shadow:0 10px 25px rgba(0,0,0,.2);

z-index:1000;


}







/* MODAL */


.modal{


display:none;

position:fixed;

top:0;

left:0;

width:100%;

height:100%;

background:rgba(0,0,0,.45);

justify-content:center;

align-items:center;

z-index:500;


}





.form-box{


background:white;

width:850px;

max-width:95%;

padding:30px;

border-radius:20px;

box-shadow:0 10px 40px rgba(0,0,0,.25);


}





.form-title{


display:flex;

justify-content:space-between;

align-items:center;

margin-bottom:25px;


}





.form-title h2{


color:#0b5c45;


}





.exit-btn{


background:#e74c3c;

color:white;

width:40px;

height:40px;

border-radius:50%;

font-size:20px;

padding:0;


}





.form-grid{


display:grid;

grid-template-columns:repeat(3,1fr);

gap:15px;


}





.form-group{


display:flex;

flex-direction:column;


}





.form-group label{


font-size:14px;

margin-bottom:6px;

color:#555;


}





.form-group input,
.form-group select{


padding:13px;

border:1px solid #ddd;

border-radius:10px;

font-size:15px;


}





.full{


grid-column:1/4;


}




.save-btn{


margin-top:20px;

width:100%;

background:#0b5c45;

color:white;


}







@media(max-width:800px){


.cards{

grid-template-columns:1fr 1fr;

}



.form-grid{

grid-template-columns:1fr;

}



.full{

grid-column:auto;

}


}


</style>


</head>


<body>


<div id="loadingBox">

<div class="loader"></div>

</div>



<div id="notify"></div>



<div class="container">



<div class="header">


<h1>

User Management

</h1>


<button class="add-btn" onclick="openForm()">

+ Add User

</button>


</div>





<div class="cards">


<div class="card">

<h2 id="total">
0
</h2>

<p>Total User</p>

</div>




<div class="card">

<h2 id="active">
0
</h2>

<p>Active</p>

</div>




<div class="card">

<h2 id="inactive">
0
</h2>

<p>Inactive</p>

</div>




<div class="card">

<h2 id="blocked">
0
</h2>

<p>Blocked</p>

</div>


</div>






<input

class="search"

id="search"

placeholder="Search User..."

onkeyup="searchUser()"

>





<div class="table-box">


<table>


<thead>


<tr>

<th>Picture</th>

<th>Name</th>

<th>Username</th>

<th>Role</th>

<th>Status</th>

<th>Action</th>


</tr>


</thead>



<tbody id="userList">


</tbody>


</table>


</div>
<!-- USER ADD / EDIT FORM -->


<div class="modal" id="modal">



<div class="form-box">



<div class="form-title">


<h2>
User Information
</h2>



<button 
class="exit-btn"
onclick="closeForm()">

✕

</button>



</div>





<input 
type="hidden"
id="row">







<div class="form-grid">






<div class="form-group">

<label>
Username
</label>

<input

id="username"

placeholder="Username">


</div>








<div class="form-group">

<label>
Password
</label>

<input

id="password"

placeholder="Password">


</div>








<div class="form-group">

<label>
Name
</label>

<input

id="name"

placeholder="Name">


</div>








<div class="form-group">

<label>
Role
</label>

<input

id="role"

placeholder="Role">


</div>








<div class="form-group">

<label>
Status
</label>


<select id="status">


<option value="Active">
Active
</option>


<option value="Inactive">
Inactive
</option>


<option value="Blocked">
Blocked
</option>


</select>


</div>








<div class="form-group">

<label>
Phone Number
</label>


<input

id="number"

placeholder="Phone Number">


</div>








<div class="form-group">

<label>
Join Date
</label>


<input

id="joinDate"

placeholder="DD-MM-YYYY">


</div>








<div class="form-group">

<label>
Email
</label>


<input

id="email"

placeholder="Email">


</div>








<div class="form-group">

<label>
Department
</label>


<input

id="department"

placeholder="Department">


</div>








<div class="form-group full">

<label>
Picture URL
</label>


<input

id="picture"

placeholder="Picture Link">


</div>








<div class="form-group full">

<label>
Address
</label>


<input

id="address"

placeholder="Address">


</div>







</div>







<button

class="save-btn"

onclick="saveUser()">

Save Update

</button>







</div>


</div>
<script>


const API_URL =
"https://script.google.com/macros/s/AKfycbzNw_d6tW3L3cFHtusSqUujnFSKC4gRYvIplxcNy2h9pUAO8AU1-K2XcBzeRNNelVtXog/exec";



let users=[];




// LOADING

function loading(show){

document.getElementById("loadingBox")
.style.display = show ? "block" : "none";

}







// NOTIFICATION

function notify(message,type="success"){


let box=document.getElementById("notify");


box.innerHTML=message;


box.style.background =
type=="error" ? "#e74c3c" : "#0b5c45";


box.style.display="block";



setTimeout(()=>{


box.style.display="none";


},2500);


}









// LOAD USERS


function loadUsers(){


loading(true);



fetch(API_URL,{

method:"POST",

headers:{

"Content-Type":
"application/x-www-form-urlencoded"

},

body:"action=getUsers"


})


.then(res=>res.json())


.then(data=>{


loading(false);



if(data.success){


users=data.users;


showUsers(users);


countUsers();


}


else{


notify("User Load Failed","error");


}


})


.catch(()=>{


loading(false);


notify("Connection Error","error");


});


}









// SHOW USER


function showUsers(data){



let html="";



data.forEach(u=>{


html+=`


<tr>


<td>


<img class="profile-img"

src="${u.picture || 'https://i.imgur.com/6VBx3io.png'}">


</td>



<td>${u.name || ""}</td>


<td>${u.username || ""}</td>


<td>${u.role || ""}</td>


<td>${u.status || ""}</td>



<td>



<button class="edit-btn"

onclick='editUser(${JSON.stringify(u)})'>

Edit

</button>




<button class="delete-btn"

onclick="deleteUser('${u.username}')">

Delete

</button>



</td>


</tr>



`;



});




document.getElementById("userList")
.innerHTML=html;


}









// COUNT USER


function countUsers(){


document.getElementById("total").innerHTML=
users.length;



document.getElementById("active").innerHTML=
users.filter(x=>x.status=="Active").length;



document.getElementById("inactive").innerHTML=
users.filter(x=>x.status=="Inactive").length;



document.getElementById("blocked").innerHTML=
users.filter(x=>x.status=="Blocked").length;



}









// SEARCH


function searchUser(){



let text=

document.getElementById("search")
.value
.toLowerCase();




let result=users.filter(u=>


(u.name||"")
.toLowerCase()
.includes(text)


||


(u.username||"")
.toLowerCase()
.includes(text)


);



showUsers(result);



}








// OPEN FORM


function openForm(){


clearForm();


document.getElementById("modal")
.style.display="flex";


}








// CLOSE FORM


function closeForm(){


document.getElementById("modal")
.style.display="none";


}









// CLEAR FORM


function clearForm(){



row.value="";

username.value="";

password.value="";

name.value="";

role.value="";

status.value="Active";

number.value="";

picture.value="";

address.value="";

email.value="";

department.value="";

joinDate.value="";


}









// EDIT USER


function editUser(u){



row.value=u.row || "";

username.value=u.username || "";

password.value=u.password || "";

name.value=u.name || "";

role.value=u.role || "";

status.value=u.status || "Active";

number.value=u.number || "";

picture.value=u.picture || "";

address.value=u.address || "";

email.value=u.email || "";

department.value=u.department || "";

joinDate.value=u.joinDate || "";



modal.style.display="flex";


}









// SAVE USER


function saveUser(){



let action =

row.value ? "updateUser" : "addUser";






let body =


"action="+action+

"&row="+encodeURIComponent(row.value)+

"&username="+encodeURIComponent(username.value)+

"&password="+encodeURIComponent(password.value)+

"&name="+encodeURIComponent(name.value)+

"&role="+encodeURIComponent(role.value)+

"&status="+encodeURIComponent(status.value)+

"&number="+encodeURIComponent(number.value)+

"&picture="+encodeURIComponent(picture.value)+

"&address="+encodeURIComponent(address.value)+

"&email="+encodeURIComponent(email.value)+

"&department="+encodeURIComponent(department.value)+

"&joinDate="+encodeURIComponent(joinDate.value);








loading(true);



fetch(API_URL,{

method:"POST",

headers:{

"Content-Type":
"application/x-www-form-urlencoded"

},

body:body


})


.then(res=>res.json())


.then(data=>{


loading(false);


notify(data.message || "Saved");


closeForm();


loadUsers();


})


.catch(()=>{


loading(false);


notify("Save Failed","error");


});


}









// DELETE USER


function deleteUser(username){



loading(true);



fetch(API_URL,{

method:"POST",

headers:{

"Content-Type":
"application/x-www-form-urlencoded"

},


body:

"action=deleteUser&username="+
encodeURIComponent(username)



})


.then(res=>res.json())


.then(data=>{


loading(false);


notify(data.message);


loadUsers();



})


.catch(()=>{


loading(false);


notify("Delete Failed","error");


});


}









// START


loadUsers();



</script>


</body>

</html>
