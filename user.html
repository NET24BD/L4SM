<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>User Control Dashboard</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">


<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}


body{

background:#f3fdf8;

}


/* DEEP GREEN SIDEBAR */

.sidebar{

position:fixed;
top:0;
left:0;
width:260px;
height:100vh;

background:#022c22;

color:white;

padding:20px;

transition:.3s;

box-shadow:5px 0 25px rgba(0,0,0,.30);

}


.sidebar.hide{

left:-260px;

}



.logo{

font-size:24px;

font-weight:bold;

margin-bottom:35px;

}



.logo i{

color:#00f5a0;

font-size:28px;

}




.menu a{

display:flex;

align-items:center;

gap:15px;

padding:14px;

color:#ecfdf5;

text-decoration:none;

border-radius:10px;

margin-bottom:8px;

transition:.3s;

}



.menu a:hover{

background:#065f46;

transform:translateX(5px);

}



/* MAIN */


.main{

margin-left:260px;

padding:25px;

transition:.3s;

}



.main.full{

margin-left:0;

}





.topbar{

background:white;

padding:15px 20px;

border-radius:15px;

display:flex;

justify-content:space-between;

align-items:center;

box-shadow:0 8px 25px rgba(0,0,0,.08);

}



.toggle{

font-size:25px;

cursor:pointer;

color:#047857;

}





/* DASHBOARD CARDS */


.cards{

display:grid;

grid-template-columns:repeat(4,1fr);

gap:20px;

margin-top:25px;

}



.card{

background:white;

padding:25px;

border-radius:18px;

box-shadow:0 10px 30px rgba(2,44,34,.12);

border-left:5px solid #10b981;

}



.card h2{

font-size:30px;

color:#047857;

}





/* BOX */


.box{

background:white;

padding:25px;

border-radius:18px;

margin-top:25px;

box-shadow:0 10px 30px rgba(2,44,34,.10);

}





.btn{

padding:9px 15px;

border:none;

border-radius:8px;

cursor:pointer;

}



.add,
.save{

background:#059669;

color:white;

}



.add:hover,
.save:hover{

background:#047857;

}



.edit{

background:#2563eb;

color:white;

}



.block-btn{

background:#f59e0b;

color:white;

}





.search{

padding:12px;

border:1px solid #ddd;

border-radius:8px;

}




/* TABLE */


table{

width:100%;

border-collapse:collapse;

margin-top:20px;

}



th{

background:#065f46;

color:white;

}



td,th{

padding:12px;

text-align:center;

border-bottom:1px solid #ddd;

}



.active{

color:#059669;

font-weight:bold;

}


.blocked{

color:red;

font-weight:bold;

}
<!-- USER TABLE SECTION -->


<div class="box">


<div style="display:flex;justify-content:space-between;align-items:center;">


<h2>User List</h2>


<button class="btn add" onclick="openUserForm()">

<i class="fa fa-user-plus"></i>

Add User

</button>


</div>



<br>


<input class="search" placeholder="Search User">





<table>


<tr>

<th>ID</th>

<th>Picture</th>

<th>Name</th>

<th>Username</th>

<th>Role</th>

<th>Status</th>

<th>Action</th>


</tr>




<tr>


<td>1</td>



<td>

<img src="https://i.imgur.com/6VBx3io.png"
width="45"
height="45"
style="border-radius:50%;">

</td>




<td>

Fahim

</td>



<td>

admin

</td>




<td>

Admin

</td>




<td class="active">

Active

</td>




<td>


<button class="btn edit">

<i class="fa fa-edit"></i>

Edit

</button>



<button class="btn block-btn">

<i class="fa fa-ban"></i>

Block

</button>



</td>



</tr>



</table>


</div>









</div>









<!-- ADD USER MODAL -->


<div class="modal" id="userModal">


<div class="modal-box">



<div class="modal-head">


<h2>Add New User</h2>



<span class="close" onclick="closeUserForm()">

✖

</span>



</div>








<div class="form-grid">





<div>

<label>Username</label>

<input placeholder="Enter Username">

</div>






<div>

<label>Password</label>

<input type="password"
placeholder="Enter Password">

</div>







<div>

<label>Name</label>

<input placeholder="Full Name">

</div>







<div>

<label>Role</label>


<select>


<option>Select Role</option>

<option>Admin</option>

<option>Manager</option>

<option>Support</option>

<option>Call</option>

<option>Guest</option>


</select>


</div>








<div>

<label>Status</label>


<select>


<option>Active</option>

<option>Blocked</option>

<option>Inactive</option>


</select>


</div>







<div>

<label>Picture URL</label>


<input placeholder="Image URL">


</div>









<div>

<label>Number</label>


<input placeholder="Mobile Number">


</div>







<div>

<label>Email</label>


<input placeholder="Email Address">


</div>







<div>

<label>Department</label>


<input placeholder="Department">


</div>








<div>

<label>Join Date</label>


<input type="date">


</div>







<div style="grid-column:1/3;">


<label>Address</label>


<textarea placeholder="Full Address"></textarea>



</div>





</div>






<br>




<button class="btn save">

<i class="fa fa-save"></i>

Save User

</button>





</div>


</div>
  <script>


// SIDEBAR TOGGLE

function menu(){

document.getElementById("sidebar")
.classList.toggle("hide");


document.getElementById("main")
.classList.toggle("full");


}






// OPEN ADD USER FORM


function openUserForm(){

document.getElementById("userModal")
.style.display="flex";

}






// CLOSE ADD USER FORM


function closeUserForm(){

document.getElementById("userModal")
.style.display="none";

}







// CLOSE MODAL OUTSIDE CLICK


window.onclick=function(event){

let modal=document.getElementById("userModal");


if(event.target==modal){

modal.style.display="none";

}


}





</script>



</body>

</html>
