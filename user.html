<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>User Management | Link4</title>


<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}


body{

background:#07111f;
color:white;
padding:20px;

}



.container{

max-width:1200px;
margin:auto;

}



.header{

background:#101c30;
padding:25px;
border-radius:20px;
display:flex;
justify-content:space-between;
align-items:center;

}


.header h1{

color:#00d4ff;

}



button{

padding:12px 18px;
border:none;
border-radius:10px;
cursor:pointer;
font-weight:bold;

}



.add{

background:#00d4ff;

}



.search{

width:100%;
margin:20px 0;
padding:15px;
border-radius:12px;
border:none;
font-size:16px;

}





.cards{

display:grid;
grid-template-columns:repeat(4,1fr);
gap:20px;

}



.card{

background:#101c30;
padding:25px;
border-radius:18px;
text-align:center;

}


.card h2{

color:#00d4ff;

}





.table-box{

margin-top:25px;
background:#101c30;
padding:25px;
border-radius:20px;
overflow:auto;

}



table{

width:100%;
border-collapse:collapse;

}


th{

background:#07111f;
padding:15px;

}


td{

padding:15px;
text-align:center;
border-bottom:1px solid #26364f;

}



img{

width:45px;
height:45px;
border-radius:50%;
object-fit:cover;

}



.edit{

background:#0b5c45;
color:white;

}



.delete{

background:#c0392b;
color:white;

}




.modal{

display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:#0008;
justify-content:center;
align-items:center;

}



.form{

background:#101c30;
padding:30px;
border-radius:20px;
width:400px;

}



.form input,
.form select{

width:100%;
padding:12px;
margin:8px 0;
border-radius:8px;
border:none;

}



.save{

background:#00d4ff;
width:100%;

}



.close{

background:#c0392b;
color:white;
width:100%;
margin-top:10px;

}




@media(max-width:800px){

.cards{

grid-template-columns:1fr 1fr;

}

}



</style>

</head>


<body>



<div class="container">



<div class="header">

<h1>
User Management
</h1>


<button class="add" onclick="openForm()">
+ Add User
</button>


</div>





<div class="cards">


<div class="card">
<h2 id="total">0</h2>
<p>Total User</p>
</div>


<div class="card">
<h2 id="active">0</h2>
<p>Active</p>
</div>


<div class="card">
<h2 id="inactive">0</h2>
<p>Inactive</p>
</div>


<div class="card">
<h2 id="blocked">0</h2>
<p>Blocked</p>
</div>


</div>





<input 
class="search"
placeholder="Search User..."
onkeyup="searchUser()"
id="search">





<div class="table-box">


<table>


<thead>

<tr>

<th>Picture</th>
<th>Name</th>
<th>Username</th>
<th>Role</th>
<th>Status</th>
<th>Number</th>
<th>Action</th>

</tr>

</thead>


<tbody id="list">

</tbody>


</table>


</div>


</div>








<!-- FORM -->


<div class="modal" id="modal">


<div class="form">


<h2 id="formTitle">
Add User
</h2>


<input id="username" placeholder="Username">

<input id="password" placeholder="Password">

<input id="name" placeholder="Name">

<input id="role" placeholder="Role">

<select id="status">

<option>Active</option>
<option>Inactive</option>
<option>Blocked</option>

</select>


<input id="picture" placeholder="Picture URL">

<input id="address" placeholder="Address">

<input id="number" placeholder="Number">

<input id="email" placeholder="Email">

<input id="department" placeholder="Department">

<input id="joinDate" placeholder="DD-MM-YYYY">



<button class="save" onclick="saveUser()">
Save
</button>


<button class="close" onclick="closeForm()">
Close
</button>



</div>

</div>








<script>


const API_URL =
"https://script.google.com/macros/s/AKfycbzNw_d6tW3L3cFHtusSqUujnFSKC4gRYvIplxcNy2h9pUAO8AU1-K2XcBzeRNNelVtXog/exec";



let users=[];

let editRow=null;





function loadUsers(){


fetch(API_URL,{

method:"POST",

headers:{

"Content-Type":
"application/x-www-form-urlencoded"

},

body:"action=getUsers"


})


.then(r=>r.json())


.then(data=>{


users=data.users;


showUsers(users);


countUsers();


});


}





function showUsers(data){


let html="";


data.forEach((u)=>{


html+=`

<tr>

<td>

<img src="${u.picture || 'https://i.imgur.com/6VBx3io.png'}">

</td>


<td>${u.name}</td>

<td>${u.username}</td>

<td>${u.role}</td>

<td>${u.status}</td>

<td>${u.number}</td>


<td>

<button class="edit"
onclick='editUser(${JSON.stringify(u)})'>
Edit
</button>


<button class="delete"
onclick="deleteUser('${u.username}')">
Delete
</button>


</td>


</tr>

`;


});



document.getElementById("list").innerHTML=html;



}






function countUsers(){


total.innerHTML=users.length;


active.innerHTML=
users.filter(x=>x.status=="Active").length;


inactive.innerHTML=
users.filter(x=>x.status=="Inactive").length;


blocked.innerHTML=
users.filter(x=>x.status=="Blocked").length;


}







function searchUser(){


let t =
search.value.toLowerCase();



showUsers(

users.filter(u=>

u.name.toLowerCase().includes(t)
||
u.username.toLowerCase().includes(t)

)

);


}







function openForm(){

modal.style.display="flex";

}




function closeForm(){

modal.style.display="none";

}





function saveUser(){


let action =
editRow ? "updateUser":"addUser";



let body =


"action="+action+

"&row="+(editRow || "")+

"&username="+username.value+

"&password="+password.value+

"&name="+name.value+

"&role="+role.value+

"&status="+status.value+

"&picture="+picture.value+

"&address="+address.value+

"&number="+number.value+

"&email="+email.value+

"&department="+department.value+

"&joinDate="+joinDate.value;





fetch(API_URL,{

method:"POST",

headers:{

"Content-Type":"application/x-www-form-urlencoded"

},

body:body


})


.then(r=>r.json())


.then(()=>{


closeForm();

loadUsers();


});



}







function editUser(u){


editRow=u.row;


username.value=u.username;

password.value=u.password;

name.value=u.name;

role.value=u.role;

status.value=u.status;

picture.value=u.picture;

address.value=u.address;

number.value=u.number;

email.value=u.email;

department.value=u.department;

joinDate.value=u.joinDate;


openForm();


}








function deleteUser(username){


if(confirm("Delete User?")){


fetch(API_URL,{

method:"POST",

headers:{

"Content-Type":"application/x-www-form-urlencoded"

},

body:

"action=deleteUser&username="+username


})

.then(()=>loadUsers());


}


}





loadUsers();



</script>


</body>

</html>
