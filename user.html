<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>User Management | Link4</title>


<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}


body{

background:#07111f;
color:white;
padding:20px;

}



.container{

max-width:1200px;
margin:auto;

}



.header{

display:flex;
justify-content:space-between;
align-items:center;
background:#101c30;
padding:25px;
border-radius:20px;
margin-bottom:25px;

}


.header h1{

color:#00d4ff;

}



button{

background:#00d4ff;
border:none;
padding:12px 20px;
border-radius:10px;
cursor:pointer;
font-weight:bold;

}



.search{

width:100%;
padding:15px;
border-radius:12px;
border:none;
margin-bottom:20px;
font-size:16px;

}




.card-box{

display:grid;
grid-template-columns:repeat(4,1fr);
gap:20px;
margin-bottom:25px;

}


.card{

background:#101c30;
padding:25px;
border-radius:20px;
text-align:center;

}



.card h2{

color:#00d4ff;

}




.table-box{

background:#101c30;
padding:25px;
border-radius:20px;
overflow:auto;

}



table{

width:100%;
border-collapse:collapse;

}



th{

background:#07111f;
padding:15px;

}



td{

padding:15px;
border-bottom:1px solid #26364f;
text-align:center;

}



img{

width:45px;
height:45px;
border-radius:50%;
object-fit:cover;

}



.edit{

background:#0b5c45;
color:white;

}


.delete{

background:#c0392b;
color:white;

}



@media(max-width:800px){


.card-box{

grid-template-columns:1fr 1fr;

}


.header{

flex-direction:column;
gap:15px;

}


}


</style>

</head>



<body>



<div class="container">



<div class="header">


<h1>
User Management
</h1>


<button onclick="addUser()">
+ Add User
</button>


</div>





<div class="card-box">


<div class="card">

<h2 id="total">
0
</h2>

<p>Total User</p>

</div>



<div class="card">

<h2 id="active">
0
</h2>

<p>Active</p>

</div>



<div class="card">

<h2 id="inactive">
0
</h2>

<p>Inactive</p>

</div>



<div class="card">

<h2 id="blocked">
0
</h2>

<p>Blocked</p>

</div>



</div>





<input 
class="search"
id="search"
placeholder="Search User..."
onkeyup="searchUser()">






<div class="table-box">



<table>


<thead>

<tr>

<th>
Picture
</th>


<th>
Name
</th>


<th>
Username
</th>


<th>
Role
</th>


<th>
Status
</th>


<th>
Action
</th>


</tr>

</thead>



<tbody id="userTable">


<tr>

<td colspan="6">
No Data
</td>

</tr>


</tbody>



</table>



</div>



</div>







<script>


let users=[];



function loadUsers(){


/*
API Connect Here

Google Sheet থেকে User Load হবে

*/


}





function searchUser(){


let text =
document.getElementById("search").value.toLowerCase();



let result =
users.filter(u=>

u.name.toLowerCase().includes(text) ||

u.username.toLowerCase().includes(text)

);



showUsers(result);



}





function showUsers(data){


let html="";


data.forEach((u,index)=>{


html+=`

<tr>

<td>

<img src="${u.picture || 'https://i.imgur.com/6VBx3io.png'}">

</td>


<td>${u.name}</td>


<td>${u.username}</td>


<td>${u.role}</td>


<td>${u.status}</td>


<td>

<button class="edit"
onclick="editUser(${index})">
Edit
</button>


<button class="delete"
onclick="deleteUser(${index})">
Delete
</button>


</td>


</tr>

`;


});



document.getElementById("userTable").innerHTML=html;


}





function addUser(){

alert("Add User Form Coming");

}



function editUser(id){

alert("Edit User : "+id);

}



function deleteUser(id){

alert("Delete User : "+id);

}




loadUsers();



</script>



</body>

</html>
