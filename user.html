<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>User Management</title>


<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}


body{

background:#f5f7fb;
color:#222;
padding:25px;

}



.container{

max-width:1200px;
margin:auto;

}



.header{

background:white;
padding:25px;
border-radius:20px;
display:flex;
justify-content:space-between;
align-items:center;
box-shadow:0 5px 20px rgba(0,0,0,.08);

}



.header h1{

color:#0b5c45;

}



button{

border:none;
padding:12px 18px;
border-radius:10px;
cursor:pointer;
font-weight:bold;

}



.add{

background:#0b5c45;
color:white;

}




.cards{

display:grid;
grid-template-columns:repeat(4,1fr);
gap:20px;
margin-top:25px;

}



.card{

background:white;
padding:25px;
border-radius:18px;
box-shadow:0 5px 20px rgba(0,0,0,.08);
text-align:center;

}



.card h2{

color:#0b5c45;
font-size:30px;

}




.search{

margin-top:25px;
width:100%;
padding:15px;
border:none;
border-radius:12px;
background:white;
box-shadow:0 5px 20px rgba(0,0,0,.08);
font-size:16px;

}




.table-box{

margin-top:25px;
background:white;
padding:25px;
border-radius:20px;
box-shadow:0 5px 20px rgba(0,0,0,.08);
overflow:auto;

}



table{

width:100%;
border-collapse:collapse;

}


th{

background:#f1f5f9;
padding:15px;
text-align:center;

}



td{

padding:15px;
text-align:center;
border-bottom:1px solid #eee;

}



img{

width:45px;
height:45px;
border-radius:50%;
object-fit:cover;

}



.edit{

background:#0b5c45;
color:white;

}



.delete{

background:#e74c3c;
color:white;

}






.modal{

display:none;
position:fixed;
inset:0;
background:#0006;
justify-content:center;
align-items:center;

}



.form{

background:white;
width:420px;
padding:30px;
border-radius:20px;

}



.form h2{

margin-bottom:15px;

}



.form input,
.form select{

width:100%;
padding:12px;
margin:8px 0;
border:1px solid #ddd;
border-radius:10px;

}



.save{

background:#0b5c45;
color:white;
width:100%;

}



.close{

margin-top:10px;
background:#e74c3c;
color:white;
width:100%;

}



@media(max-width:800px){

.cards{

grid-template-columns:1fr 1fr;

}


.header{

flex-direction:column;
gap:15px;

}


}



</style>

</head>



<body>


<div class="container">



<div class="header">

<h1>
User Management
</h1>


<button class="add" onclick="openForm()">
+ Add User
</button>


</div>





<div class="cards">


<div class="card">
<h2 id="total">0</h2>
<p>Total User</p>
</div>


<div class="card">
<h2 id="active">0</h2>
<p>Active</p>
</div>


<div class="card">
<h2 id="inactive">0</h2>
<p>Inactive</p>
</div>


<div class="card">
<h2 id="blocked">0</h2>
<p>Blocked</p>
</div>


</div>





<input 
class="search"
id="search"
placeholder="Search User..."
onkeyup="searchUser()">






<div class="table-box">


<table>


<thead>

<tr>

<th>Picture</th>
<th>Name</th>
<th>Username</th>
<th>Role</th>
<th>Status</th>
<th>Number</th>
<th>Action</th>

</tr>


</thead>


<tbody id="list"></tbody>


</table>


</div>



</div>






<div class="modal" id="modal">


<div class="form">


<h2>
Add / Edit User
</h2>



<input id="username" placeholder="Username">

<input id="password" placeholder="Password">

<input id="name" placeholder="Name">

<input id="role" placeholder="Role">


<select id="status">

<option>Active</option>
<option>Inactive</option>
<option>Blocked</option>

</select>



<input id="picture" placeholder="Picture URL">

<input id="address" placeholder="Address">

<input id="number" placeholder="Number">

<input id="email" placeholder="Email">

<input id="department" placeholder="Department">

<input id="joinDate" placeholder="DD-MM-YYYY">


<button class="save" onclick="saveUser()">
Save
</button>


<button class="close" onclick="closeForm()">
Close
</button>


</div>


</div>







<script>


const API_URL =
"https://script.google.com/macros/s/AKfycbzNw_d6tW3L3cFHtusSqUujnFSKC4gRYvIplxcNy2h9pUAO8AU1-K2XcBzeRNNelVtXog/exec";



let users=[];

let editRow=null;




function loadUsers(){


fetch(API_URL,{

method:"POST",

headers:{
"Content-Type":"application/x-www-form-urlencoded"
},

body:"action=getUsers"


})

.then(r=>r.json())

.then(data=>{


users=data.users || [];

showUsers(users);

countUsers();


});


}







function showUsers(data){


let html="";


data.forEach(u=>{


html+=`

<tr>

<td>
<img src="${u.picture || 'https://i.imgur.com/6VBx3io.png'}">
</td>


<td>${u.name}</td>

<td>${u.username}</td>

<td>${u.role}</td>

<td>${u.status}</td>

<td>${u.number}</td>


<td>

<button class="edit" onclick='editUser(${JSON.stringify(u)})'>
Edit
</button>


<button class="delete" onclick="deleteUser('${u.username}')">
Delete
</button>


</td>


</tr>


`;


});


document.getElementById("list").innerHTML=html;


}






function countUsers(){


total.innerHTML=users.length;


active.innerHTML=users.filter(x=>x.status=="Active").length;


inactive.innerHTML=users.filter(x=>x.status=="Inactive").length;


blocked.innerHTML=users.filter(x=>x.status=="Blocked").length;


}






function searchUser(){


let t=search.value.toLowerCase();


showUsers(
users.filter(u=>
u.name.toLowerCase().includes(t) ||
u.username.toLowerCase().includes(t)
)
);


}






function openForm(){

modal.style.display="flex";

}



function closeForm(){

modal.style.display="none";

}





function saveUser(){

alert("Save API Ready");

}




function editUser(u){

alert("Edit : "+u.name);

}




function deleteUser(u){

alert("Delete : "+u);

}




loadUsers();


</script>


</body>

</html>
