<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Link4 User Management</title>


<style>


*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}



body{

background:#f5f7fb;

padding:25px;

color:#222;

}



.container{

max-width:1250px;

margin:auto;

}



/* HEADER */

.header{

background:white;

padding:25px;

border-radius:20px;

display:flex;

justify-content:space-between;

align-items:center;

box-shadow:0 5px 20px rgba(0,0,0,.08);

}



.header h1{

color:#0b5c45;

}



.add-btn{

background:#0b5c45;

color:white;

border:none;

padding:13px 25px;

border-radius:12px;

cursor:pointer;

font-size:15px;

}



/* CARDS */


.cards{

display:grid;

grid-template-columns:repeat(4,1fr);

gap:20px;

margin-top:25px;

}



.card{

background:white;

padding:25px;

border-radius:18px;

text-align:center;

box-shadow:0 5px 20px rgba(0,0,0,.08);

}



.card h2{

font-size:32px;

color:#0b5c45;

margin-bottom:8px;

}





/* SEARCH */


.search{

margin-top:25px;

width:100%;

padding:15px;

border:none;

outline:none;

border-radius:12px;

font-size:16px;

box-shadow:0 5px 20px rgba(0,0,0,.08);

}



/* TABLE */


.table-box{

margin-top:25px;

background:white;

padding:25px;

border-radius:20px;

box-shadow:0 5px 20px rgba(0,0,0,.08);

overflow:auto;

}



table{

width:100%;

border-collapse:collapse;

}



th{

background:#0b5c45;

color:white;

padding:15px;

}



td{

padding:15px;

text-align:center;

border-bottom:1px solid #eee;

}



.profile-img{

width:45px;

height:45px;

border-radius:50%;

object-fit:cover;

}





button{

cursor:pointer;

border:none;

border-radius:8px;

padding:10px 15px;

font-weight:bold;

}





.edit-btn{

background:#3498db;

color:white;

}



.delete-btn{

background:#e74c3c;

color:white;

}





/* LOADING */


#loadingBox{

display:none;

position:fixed;

top:0;

left:0;

width:100%;

height:100%;

background:rgba(255,255,255,.7);

z-index:999;

justify-content:center;

align-items:center;

}



.loader{

width:45px;

height:45px;

border:5px solid #ddd;

border-top:5px solid #0b5c45;

border-radius:50%;

animation:spin 1s linear infinite;

}



@keyframes spin{

100%{

transform:rotate(360deg);

}

}





/* NOTIFICATION */


#notify{

position:fixed;

right:30px;

top:30px;

background:#0b5c45;

color:white;

padding:15px 25px;

border-radius:12px;

display:none;

z-index:1000;

box-shadow:0 10px 25px rgba(0,0,0,.2);

}





/* MODAL */


.modal{

display:none;

position:fixed;

top:0;

left:0;

width:100%;

height:100%;

background:rgba(0,0,0,.45);

justify-content:center;

align-items:center;

z-index:500;

}



.form-box{

background:white;

width:850px;

max-width:95%;

padding:30px;

border-radius:20px;

}



.form-box h2{

text-align:center;

color:#0b5c45;

margin-bottom:25px;

}



.form-grid{

display:grid;

grid-template-columns:repeat(3,1fr);

gap:15px;

}



.form-group{

display:flex;

flex-direction:column;

}



.form-group label{

font-size:14px;

margin-bottom:6px;

}



.form-group input,
.form-group select{

padding:13px;

border:1px solid #ddd;

border-radius:10px;

}



.full{

grid-column:1/4;

}



.save-btn{

margin-top:20px;

width:100%;

background:#0b5c45;

color:white;

}



.close-btn{

margin-top:10px;

width:100%;

background:#e74c3c;

color:white;

}





@media(max-width:800px){


.cards{

grid-template-columns:1fr 1fr;

}



.form-grid{

grid-template-columns:1fr;

}



.full{

grid-column:auto;

}


}



</style>


</head>


<body>



<div id="loadingBox">

<div class="loader"></div>

</div>



<div id="notify"></div>



<div class="container">



<div class="header">


<h1>
User Management
</h1>


<button class="add-btn" onclick="openForm()">

+ Add User

</button>


</div>





<div class="cards">


<div class="card">

<h2 id="total">0</h2>

<p>Total User</p>

</div>



<div class="card">

<h2 id="active">0</h2>

<p>Active</p>

</div>




<div class="card">

<h2 id="inactive">0</h2>

<p>Inactive</p>

</div>




<div class="card">

<h2 id="blocked">0</h2>

<p>Blocked</p>

</div>


</div>





<input

class="search"

id="search"

placeholder="Search User..."

onkeyup="searchUser()">


<div class="table-box">


<table>


<thead>

<tr>

<th>Picture</th>

<th>Name</th>

<th>Username</th>

<th>Role</th>

<th>Status</th>

<th>Action</th>


</tr>

</thead>



<tbody id="userList">


</tbody>


</table>


</div>

<!-- USER ADD / EDIT MODAL -->


<div class="modal" id="modal">



<div class="form-box">



<h2>
User Information
</h2>




<input 
type="hidden"
id="row">





<div class="form-grid">





<div class="form-group">

<label>
Username
</label>

<input 
id="username"
placeholder="Username">


</div>







<div class="form-group">

<label>
Password
</label>

<input 
id="password"
placeholder="Password">


</div>







<div class="form-group">

<label>
Name
</label>

<input 
id="name"
placeholder="Name">


</div>







<div class="form-group">

<label>
Role
</label>

<input 
id="role"
placeholder="Role">


</div>








<div class="form-group">

<label>
Status
</label>


<select id="status">


<option value="Active">
Active
</option>


<option value="Inactive">
Inactive
</option>


<option value="Blocked">
Blocked
</option>



</select>


</div>








<div class="form-group">

<label>
Join Date
</label>


<input

id="joinDate"

placeholder="DD-MM-YYYY">


</div>








<div class="form-group full">


<label>
Picture URL
</label>


<input

id="picture"

placeholder="Picture Link">


</div>









<div class="form-group full">


<label>
Address
</label>


<input

id="address"

placeholder="Address">


</div>









<div class="form-group">


<label>
Email
</label>


<input

id="email"

placeholder="Email">


</div>








<div class="form-group">


<label>
Department
</label>


<input

id="department"

placeholder="Department">


</div>






</div>







<button

class="save-btn"

onclick="saveUser()">

Save Update

</button>







<button

class="close-btn"

onclick="closeForm()">

Close

</button>






</div>


</div>
<script>


const API_URL =
"https://script.google.com/macros/s/AKfycbzNw_d6tW3L3cFHtusSqUujnFSKC4gRYvIplxcNy2h9pUAO8AU1-K2XcBzeRNNelVtXog/exec";



let users=[];





// LOADING


function loading(show){

document.getElementById("loadingBox")
.style.display = show ? "flex" : "none";

}






// NOTIFICATION


function notify(msg,type="success"){


let box=document.getElementById("notify");


box.innerHTML=msg;


box.style.background =
type=="error" ? "#e74c3c" : "#0b5c45";


box.style.display="block";



setTimeout(()=>{


box.style.display="none";


},2500);



}







// LOAD USERS


function loadUsers(){


loading(true);



fetch(API_URL,{

method:"POST",

headers:{

"Content-Type":
"application/x-www-form-urlencoded"

},

body:"action=getUsers"


})

.then(res=>res.json())


.then(data=>{


loading(false);



if(data.success){


users=data.users;


showUsers(users);


countUsers();


}


else{


notify("Data Load Failed","error");


}



})

.catch(()=>{


loading(false);


notify("Connection Error","error");


});


}









// SHOW TABLE


function showUsers(data){


let html="";



data.forEach(u=>{


html+=`

<tr>


<td>


<img class="profile-img"

src="${u.picture || 'https://i.imgur.com/6VBx3io.png'}">


</td>


<td>${u.name || ""}</td>


<td>${u.username || ""}</td>


<td>${u.role || ""}</td>


<td>${u.status || ""}</td>


<td>


<button class="edit-btn"

onclick='editUser(${JSON.stringify(u)})'>

Edit

</button>



<button class="delete-btn"

onclick="deleteUser('${u.username}')">

Delete

</button>



</td>


</tr>

`;


});



document.getElementById("userList")
.innerHTML=html;



}









// COUNT


function countUsers(){



document.getElementById("total")
.innerHTML=users.length;



document.getElementById("active")
.innerHTML=

users.filter(x=>x.status=="Active").length;



document.getElementById("inactive")
.innerHTML=

users.filter(x=>x.status=="Inactive").length;



document.getElementById("blocked")
.innerHTML=

users.filter(x=>x.status=="Blocked").length;



}









// SEARCH


function searchUser(){


let text=

document.getElementById("search")
.value
.toLowerCase();



let result=users.filter(u=>


(u.name||"")
.toLowerCase()
.includes(text)


||

(u.username||"")
.toLowerCase()
.includes(text)


);



showUsers(result);



}









// OPEN FORM


function openForm(){


clearForm();


document.getElementById("modal")
.style.display="flex";


}







// CLOSE FORM


function closeForm(){


document.getElementById("modal")
.style.display="none";


}








// CLEAR FORM


function clearForm(){


document.getElementById("row").value="";

document.getElementById("username").value="";

document.getElementById("password").value="";

document.getElementById("name").value="";

document.getElementById("role").value="";

document.getElementById("status").value="Active";

document.getElementById("picture").value="";

document.getElementById("address").value="";

document.getElementById("email").value="";

document.getElementById("department").value="";

document.getElementById("joinDate").value="";


}








// EDIT USER


function editUser(u){



document.getElementById("row").value=u.row || "";

document.getElementById("username").value=u.username || "";

document.getElementById("password").value=u.password || "";

document.getElementById("name").value=u.name || "";

document.getElementById("role").value=u.role || "";

document.getElementById("status").value=u.status || "Active";

document.getElementById("picture").value=u.picture || "";

document.getElementById("address").value=u.address || "";

document.getElementById("email").value=u.email || "";

document.getElementById("department").value=u.department || "";

document.getElementById("joinDate").value=u.joinDate || "";



document.getElementById("modal")
.style.display="flex";



}









// SAVE USER


function saveUser(){


let row = 
document.getElementById("row").value;



let action =
row ? "updateUser" : "addUser";





let body =

"action="+action+

"&row="+encodeURIComponent(row)+

"&username="+encodeURIComponent(
document.getElementById("username").value
)+

"&password="+encodeURIComponent(
document.getElementById("password").value
)+

"&name="+encodeURIComponent(
document.getElementById("name").value
)+

"&role="+encodeURIComponent(
document.getElementById("role").value
)+

"&status="+encodeURIComponent(
document.getElementById("status").value
)+

"&picture="+encodeURIComponent(
document.getElementById("picture").value
)+

"&address="+encodeURIComponent(
document.getElementById("address").value
)+

"&email="+encodeURIComponent(
document.getElementById("email").value
)+

"&department="+encodeURIComponent(
document.getElementById("department").value
)+

"&joinDate="+encodeURIComponent(
document.getElementById("joinDate").value
);






loading(true);



fetch(API_URL,{

method:"POST",

headers:{

"Content-Type":
"application/x-www-form-urlencoded"

},

body:body


})


.then(res=>res.json())


.then(data=>{


loading(false);



notify(data.message);


closeForm();


loadUsers();


})


.catch(()=>{


loading(false);


notify("Save Failed","error");


});



}









// DELETE


function deleteUser(username){


if(!confirm("Delete User?"))

return;




loading(true);



fetch(API_URL,{

method:"POST",

headers:{

"Content-Type":
"application/x-www-form-urlencoded"

},

body:

"action=deleteUser&username="+
encodeURIComponent(username)


})


.then(res=>res.json())


.then(data=>{


loading(false);


notify(data.message);


loadUsers();


})



.catch(()=>{


loading(false);


notify("Delete Failed","error");


});


}








// START


loadUsers();



</script>



</body>

</html>
