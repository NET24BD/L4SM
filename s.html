```
<div class="left-section">

    <button
        type="button"
        class="back-btn"
        onclick="goBack()"
    >


    </button>


    <h2>

        <i class="fa fa-headset"></i>

        <span>Pending Support</span>

    </h2>

</div>




<div class="profile">

    <div
        class="profile-head"
        onclick="toggleProfile()"
    >

        <img
            id="profileImg"
            src="assets/profile.png"
            alt="Profile"
        >

        <span id="username">
            User
        </span>

        <i class="fa fa-angle-down"></i>

    </div>


    <div
        class="profile-menu"
        id="profileMenu"
    >

        <button
            type="button"
            onclick="my-Account.html()"
        >

            <i class="fa fa-user"></i>

            My Account

        </button>


        <button
            type="button"
            onclick="logout.html()"
        >

            <i class="fa fa-sign-out"></i>

            Logout

        </button>

    </div>

</div>
```

```
<div class="search-box">

    <i class="fa fa-search"></i>

    <input
        type="text"
        id="supportSearch"
        placeholder="Search Customer ID, Problem, Reference..."
        autocomplete="off"
    >

</div>
```

```
<table>

    <thead>

        <tr>

            <th>
                Customer ID
            </th>

            <th>
                Problem
            </th>

            <th>
                Reference
            </th>

            <th>
                Date
            </th>

            <th>
                Action
            </th>

        </tr>

    </thead>


    <tbody id="supportList">

        <tr>

            <td
                colspan="5"
                class="loading-cell"
            >

                <i class="fa fa-spinner fa-spin"></i>

                Loading...

            </td>

        </tr>

    </tbody>

</table>
```

```
<div class="popup">

    <button
        type="button"
        class="close-btn"
        onclick="closeEdit()"
    >

        ×

    </button>


    <h2>

        <i class="fa fa-headset"></i>

        Edit Support

    </h2>


    

    <label for="customerId">
        Customer ID
    </label>

    <input
        type="text"
        id="customerId"
        readonly
    >


 

    <label for="problem">
        Problem
    </label>

    <textarea
        id="problem"
        readonly
    ></textarea>


  

    <label for="reference">
        Reference
    </label>

    <input
        type="text"
        id="reference"
        readonly
    >


 

    <label for="date">
        Date
    </label>

    <input
        type="date"
        id="date"
        readonly
    >


  

    <label for="support">
        Support
    </label>

    <input
        type="text"
        id="support"
    >


    

    <label for="supportWork">
        Support Work
    </label>

    <textarea
        id="supportWork"
    ></textarea>


    <!-- BUTTONS -->

    <div class="popup-buttons">

        <button
            type="button"
            class="submit-btn"
            onclick="updateSupport()"
        >

            <i class="fa fa-paper-plane"></i>

            Submit

        </button>


        <button
            type="button"
            class="cancel-btn"
            onclick="closeEdit()"
        >

            <i class="fa fa-xmark"></i>

            Cancel

        </button>

    </div>

</div>
```

```
<div class="custom-popup">

    <div class="popup-icon warning">

        <i class="fa fa-triangle-exclamation"></i>

    </div>


    <h3 id="confirmTitle">
        Confirm
    </h3>


    <p id="confirmMessage">
        Are you sure?
    </p>


    <div class="custom-popup-buttons">

        <button
            type="button"
            class="popup-cancel-btn"
            onclick="closeConfirmPopup()"
        >

            Cancel

        </button>


        <button
            type="button"
            class="popup-confirm-btn"
            id="confirmActionBtn"
        >

            Confirm

        </button>

    </div>

</div>
```

```
<div class="custom-popup">

    <div class="popup-icon success">

        <i class="fa fa-check"></i>

</div>
