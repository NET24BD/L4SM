<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | Link Support</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{

height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#0f172a,#1e293b,#2563eb);

}

.login-box{

width:360px;
background:#fff;
padding:35px;
border-radius:18px;
box-shadow:0 20px 40px rgba(0,0,0,.25);

}

h2{

text-align:center;
margin-bottom:25px;
color:#111827;

}

.input{

width:100%;
padding:14px;
margin-bottom:18px;
border:1px solid #ddd;
border-radius:10px;
font-size:15px;

}

button{

width:100%;
padding:14px;
border:none;
border-radius:10px;
background:#2563eb;
color:#fff;
font-size:16px;
font-weight:600;
cursor:pointer;
transition:.3s;

}

button:hover{

background:#1d4ed8;

}

#msg{

margin-top:18px;
text-align:center;
font-size:14px;
font-weight:600;

}

.loading{

display:none;
margin-top:15px;
text-align:center;
color:#2563eb;

}

</style>

</head>

<body>

<div class="login-box">

<h2>System Login</h2>

<input
type="text"
id="username"
class="input"
placeholder="Username">

<input
type="password"
id="password"
class="input"
placeholder="Password">

<button onclick="login()">
LOGIN
</button>

<div class="loading" id="loading">
Please Wait...
</div>

<div id="msg"></div>

</div>

<script>

const API="https://script.google.com/macros/s/AKfycbzNw_d6tW3L3cFHtusSqUujnFSKC4gRYvIplxcNy2h9pUAO8AU1-K2XcBzeRNNelVtXog/exec";

function login(){

let username=document.getElementById("username").value.trim();
let password=document.getElementById("password").value.trim();

if(username==""||password==""){

msg.style.color="red";
msg.innerHTML="Enter Username & Password";
return;

}

loading.style.display="block";
msg.innerHTML="";

fetch(API,{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

username:username,
password:password

})

})

.then(res=>res.json())

.then(data=>{

loading.style.display="none";

if(data.success){

localStorage.setItem("username",data.username);
localStorage.setItem("name",data.name);
localStorage.setItem("role",data.role);

msg.style.color="green";
msg.innerHTML="Login Successful";

setTimeout(function(){

window.location="dashboard.html";

},1000);

}else{

msg.style.color="red";
msg.innerHTML=data.message;

}

})

.catch(err=>{

loading.style.display="none";
msg.style.color="red";
msg.innerHTML="Server Error";

console.log(err);

});

}

</script>

</body>
</html>
