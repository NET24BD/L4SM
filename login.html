<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ISP Secure Login</title>

<link rel="stylesheet" href="login.css">

</head>


<body>


<div class="scene">


<!-- ISP Logo -->

<div class="brand">

<img src="logo.png" alt="ISP Logo">

<h2>
YOUR ISP NAME
</h2>

</div>



<!-- Character -->

<div class="character" id="character">

🧑‍💼

</div>



<!-- Bag -->

<div class="bag" id="bag">

🎒

</div>



<!-- Bag Open Effect -->

<div class="bag-light" id="bagLight">

</div>



<!-- Login Portal -->

<div class="portal" id="portal">


<div class="portal-header">


<h2>
🔐 Secure Login
</h2>


</div>



<!-- Fingerprint Animation -->

<div class="fingerprint">

🖐️

<div class="scan-line">

</div>

</div>



<!-- Login Form -->


<div class="login-form">


<input 
type="text"
id="username"
placeholder="Username">



<input 
type="password"
id="password"
placeholder="Password">



<button onclick="login()">

LOGIN

</button>



<p id="msg">

</p>


</div>



</div>



</div>



<script src="login.js"></script>


</body>

</html>
