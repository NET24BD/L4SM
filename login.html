<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>eSupport System</title>

<link rel="stylesheet" href="login.css">

</head>


<body>


<div class="login-box">


<h2>eSupport System</h2>


<p class="sub">
User Login
</p>



<input 
type="text"
id="username"
placeholder="Username"
onkeydown="enterLogin(event)">



<input 
type="password"
id="password"
placeholder="Password"
onkeydown="enterLogin(event)">



<button onclick="login()">

LOGIN

</button>



<p id="msg"></p>


</div>



<script src="login.js"></script>


</body>

</html>
