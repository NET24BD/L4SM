<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login | Link4 Support Team</title>


<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, sans-serif;
}


body{

height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#07111f,#0b5c45);

}



.login-box{

width:360px;
background:white;
padding:35px;
border-radius:20px;
box-shadow:0 15px 40px rgba(0,0,0,.35);

}



.logo{

text-align:center;
margin-bottom:25px;

}


.logo h2{

color:#0b5c45;
font-size:25px;

}


.logo p{

color:#777;
font-size:14px;

}



input{

width:100%;
padding:14px;
margin:10px 0;
border-radius:10px;
border:1px solid #ddd;
font-size:15px;
outline:none;

}



.password{

position:relative;

}


.password span{

position:absolute;
right:15px;
top:24px;
cursor:pointer;

}



button{

width:100%;
padding:14px;
margin-top:15px;
border:none;
border-radius:10px;
background:#0b5c45;
color:white;
font-size:16px;
cursor:pointer;

}


button:hover{

background:#064333;

}



button:disabled{

opacity:.6;

}



#msg{

text-align:center;
margin-top:15px;
font-size:14px;

}



.footer{

text-align:center;
margin-top:20px;
font-size:12px;
color:#888;

}



</style>


</head>



<body>



<div class="login-box">



<div class="logo">

<h2>Link4 Support Team</h2>

<p>Management Login System</p>

</div>



<input 
id="username"
type="text"
placeholder="Username">



<div class="password">


<input
id="password"
type="password"
placeholder="Password">


<span onclick="showPassword()">👁</span>


</div>



<button 
id="btn"
onclick="login()">

Login

</button>



<div id="msg"></div>



<div class="footer">

© Link4 Support Team

</div>



</div>





<script>


const API = 
"https://script.google.com/macros/s/AKfycbzNw_d6tW3L3cFHtusSqUujnFSKC4gRYvIplxcNy2h9pUAO8AU1-K2XcBzeRNNelVtXog/exec";





function showPassword(){

let pass=document.getElementById("password");


if(pass.type==="password"){

pass.type="text";

}

else{

pass.type="password";

}


}






function login(){


let username =
document.getElementById("username").value.trim();


let password =
document.getElementById("password").value.trim();



let msg =
document.getElementById("msg");


let btn =
document.getElementById("btn");




if(username=="" || password==""){


msg.style.color="red";

msg.innerHTML="Enter Username and Password";


return;

}





btn.innerHTML="Checking...";

btn.disabled=true;





fetch(API,{

method:"POST",

headers:{

"Content-Type":
"application/x-www-form-urlencoded"

},


body:

"username="+encodeURIComponent(username)
+"&password="+encodeURIComponent(password)



})


.then(response=>response.json())


.then(data=>{



if(data.success){



// Save Login Data

localStorage.setItem(
"user",
JSON.stringify(data)
);



localStorage.setItem(
"username",
data.username
);



localStorage.setItem(
"name",
data.name
);



localStorage.setItem(
"role",
data.role
);



localStorage.setItem(
"photo",
data.photo
);





msg.style.color="green";

msg.innerHTML="Login Successful";





setTimeout(()=>{


window.location.href="dashboard.html";


},800);





}

else{



msg.style.color="red";

msg.innerHTML=data.message;


btn.innerHTML="Login";

btn.disabled=false;



}



})



.catch(error=>{



msg.style.color="red";

msg.innerHTML="Connection Error";


btn.innerHTML="Login";

btn.disabled=false;



});



}





document.addEventListener("keydown",function(e){


if(e.key==="Enter"){


login();


}


});



</script>


</body>

</html>
