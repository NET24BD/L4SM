<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login | Link4 Support Team</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{

    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#07111f,#0b3d3a);

}

.login-box{

    width:350px;
    background:white;
    padding:35px;
    border-radius:20px;
    box-shadow:0 15px 40px rgba(0,0,0,.3);
}


.logo{

    text-align:center;
    margin-bottom:25px;
}


.logo h2{

    color:#0b3d3a;
}


.logo p{

    color:#777;
    font-size:14px;

}


input{

    width:100%;
    padding:14px;
    margin:10px 0;
    border-radius:10px;
    border:1px solid #ddd;
    outline:none;
    font-size:15px;

}


.password-box{

    position:relative;

}


.password-box span{

    position:absolute;
    right:15px;
    top:25px;
    cursor:pointer;
}


button{

    width:100%;
    padding:14px;
    margin-top:15px;
    border:none;
    border-radius:10px;
    background:#0b3d3a;
    color:white;
    font-size:16px;
    cursor:pointer;

}


button:hover{

    background:#062522;

}


#msg{

    text-align:center;
    margin-top:15px;
    color:red;
    font-size:14px;

}


.footer{

    text-align:center;
    margin-top:20px;
    font-size:12px;
    color:#777;

}


</style>

</head>


<body>


<div class="login-box">


<div class="logo">

<h2>Link4 Support Team</h2>

<p>Management Login System</p>

</div>



<input 
type="text" 
id="username" 
placeholder="Username">



<div class="password-box">

<input 
type="password" 
id="password" 
placeholder="Password">


<span onclick="showPass()">👁</span>

</div>



<button onclick="login()" id="btn">
Login
</button>


<div id="msg"></div>


<div class="footer">

© Link4 Support Team

</div>


</div>





<script>


const API = 
"https://script.google.com/macros/s/AKfycbzNw_d6tW3L3cFHtusSqUujnFSKC4gRYvIplxcNy2h9pUAO8AU1-K2XcBzeRNNelVtXog/exec";



function showPass(){

let p=document.getElementById("password");

if(p.type==="password"){

p.type="text";

}else{

p.type="password";

}

}



function login(){


let username=document.getElementById("username").value.trim();

let password=document.getElementById("password").value.trim();


let msg=document.getElementById("msg");

let btn=document.getElementById("btn");



if(username==="" || password===""){

msg.innerHTML="Please enter username and password";

return;

}



btn.innerHTML="Checking...";
btn.disabled=true;



fetch(API,{

method:"POST",

headers:{
"Content-Type":"application/x-www-form-urlencoded"
},

body:

"username="+encodeURIComponent(username)+
"&password="+encodeURIComponent(password)


})


.then(res=>res.json())


.then(data=>{


if(data.success){


localStorage.setItem("user",JSON.stringify(data));


window.location.href="dashboard.html";


}

else{


msg.innerHTML=data.message;

btn.innerHTML="Login";
btn.disabled=false;


}


})


.catch(error=>{


msg.innerHTML="Server Error";

btn.innerHTML="Login";
btn.disabled=false;


});


}



</script>


</body>
</html>
