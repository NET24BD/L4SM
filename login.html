<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>eSupport System</title>

<link rel="stylesheet" href="login.css">

</head>


<body>


<div class="container">


<div class="left">


<div class="logo">
eSupport
</div>


<h1>
Support Management System
</h1>


<p>
Fast • Secure • Reliable
</p>


<div class="icon">
🎧
</div>


</div>




<div class="login-box">


<h2>
Welcome Back
</h2>


<p>
Login to your account
</p>



<input 
id="username"
placeholder="Username"
onkeydown="enterLogin(event)">



<input 
id="password"
type="password"
placeholder="Password"
onkeydown="enterLogin(event)">



<button onclick="login()">
Login
</button>


<p id="msg"></p>


</div>


</div>



<script src="login.js"></script>

</body>

</html>
