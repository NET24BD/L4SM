<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pending Support</title>


<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">


<style>


*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}



body{

background:linear-gradient(135deg,#ecfdf5,#eff6ff);

padding:20px;

}




/* HEADER */

.header{

background:white;

padding:15px 20px;

border-radius:20px;

display:flex;

justify-content:space-between;

align-items:center;

box-shadow:0 10px 30px rgba(0,0,0,.15);

}



.header-left{

display:flex;

align-items:center;

gap:15px;

}



.back-btn{

background:#065f46;

color:white;

border:none;

padding:10px 18px;

border-radius:10px;

cursor:pointer;

}





/* PROFILE */


.profile{

position:relative;

display:flex;

align-items:center;

gap:10px;

cursor:pointer;

}



.profile img{

width:50px;

height:50px;

border-radius:50%;

border:3px solid #10b981;

object-fit:cover;

}



.profile-menu{

display:none;

position:absolute;

right:0;

top:60px;

background:white;

width:200px;

padding:10px;

border-radius:15px;

box-shadow:0 10px 30px rgba(0,0,0,.2);

z-index:1000;

}



.profile-menu.show{

display:block;

}



.profile-menu button{

width:100%;

padding:12px;

border:none;

background:white;

cursor:pointer;

border-radius:10px;

text-align:left;

}



.profile-menu button:hover{

background:#ecfdf5;

}





/* LOADING */

#loadingArea{

position:fixed;

top:0;

left:0;

width:100%;

height:100%;

z-index:9999;

}







/* TABLE */


.table-box{

margin-top:25px;

background:white;

padding:20px;

border-radius:20px;

box-shadow:0 10px 30px rgba(0,0,0,.12);

overflow:auto;

}



table{

width:100%;

border-collapse:collapse;

}



th{

background:#065f46;

color:white;

padding:14px;

}



td{

padding:12px;

text-align:center;

border-bottom:1px solid #ddd;

}



.edit-btn{

background:#2563eb;

color:white;

border:none;

padding:8px 15px;

border-radius:10px;

cursor:pointer;

}






/* EDIT POPUP */


.modal{

display:none;

position:fixed;

top:0;

left:0;

width:100%;

height:100%;

background:rgba(0,0,0,.45);

align-items:center;

justify-content:center;

z-index:2000;

}



.modal.show{

display:flex;

}



.popup-box{

position:relative;

background:white;

width:450px;

max-width:95%;

padding:30px;

border-radius:25px;

box-shadow:0 20px 50px rgba(0,0,0,.3);

}







/* CROSS BUTTON */


.popup-close{


position:absolute;

right:15px;

top:15px;


width:35px;

height:35px;


border:none;


border-radius:50%;


background:#ef4444;


color:white;


font-size:25px;


cursor:pointer;


}




.popup-close:hover{


background:#dc2626;


transform:rotate(90deg);


transition:.3s;


}






.popup-box input,
.popup-box textarea{


width:100%;

padding:10px;

margin-top:5px;

border:1px solid #ddd;

border-radius:10px;

}



.popup-box textarea{

height:80px;

}



.popup-box label{

display:block;

margin-top:10px;

font-weight:bold;

}



.popup-buttons{

margin-top:20px;

display:flex;

gap:10px;

}



.popup-buttons button{

padding:10px 18px;

border:none;

border-radius:10px;

cursor:pointer;

}



.save-btn{

background:#10b981;

color:white;

}



.cancel-btn{

background:#64748b;

color:white;

}



.delete-btn{

background:#ef4444;

color:white;

}



</style>


</head>


<body>



<!-- LOADING -->

<div id="loadingArea"></div>





<!-- HEADER -->


<div class="header">



<div class="header-left">


<button class="back-btn"
onclick="goBack()">


<i class="fa fa-arrow-left"></i>

Back


</button>



<h2>

<i class="fa fa-headset"></i>

Pending Support

</h2>



</div>







<!-- PROFILE -->


<div class="profile"
onclick="toggleProfile()">



<img id="profileImg"
src="assets/profile.png">



<span id="username">

User

</span>




<i class="fa fa-angle-down"></i>






<div class="profile-menu"
id="profileMenu"
onclick="event.stopPropagation()">



<button onclick="myAccount()">

<i class="fa fa-user"></i>

My Account

</button>




<button onclick="logout()">

<i class="fa fa-sign-out"></i>

Logout

</button>



</div>





</div>



</div>








<!-- TABLE -->


<div class="table-box">


<table>


<thead>


<tr>

<th>Customer ID</th>

<th>Problem</th>

<th>Reference</th>

<th>Date</th>

<th>Action</th>


</tr>


</thead>



<tbody id="supportList">


</tbody>



</table>


</div>








<!-- EDIT POPUP -->


<div class="modal"
id="editModal">



<div class="popup-box">



<button class="popup-close"
onclick="closeEdit()">

×

</button>





<h2>

<i class="fa fa-edit"></i>

Edit Support

</h2>





<input type="hidden"
id="editRow">





<label>Customer ID</label>

<input id="customerId">





<label>Problem</label>

<textarea id="problem"></textarea>





<label>Reference</label>

<input id="reference">





<label>Date</label>

<input type="date"
id="date">





<label>Support</label>

<input id="support">





<label>Support Work</label>

<textarea id="supportWork"></textarea>



<div class="popup-buttons">


<button class="save-btn"
onclick="updateSupport()">

Submit

</button>


<button class="cancel-btn"
onclick="closeEdit()">

Cancel

</button>



<button class="delete-btn"
onclick="openDelete()">

Delete

</button>



</div>




</div>


</div>
<script>


// ===============================
// API URL
// ===============================


const API_URL =
"https://script.google.com/macros/s/AKfycbxRQLGuRc-P8bZ2FE-6ua8B1iPH6IQ1tAffS0erigyv15xQSALef2nrNTSqdMOYHt1fqg/exec";



let currentRow="";

let loadingTimer;





// ===============================
// LOGIN CHECK
// ===============================


if(localStorage.getItem("isLogin")!="true"){

window.location.href="index.html";

}







// ===============================
// LOAD LOADING HTML
// ===============================


fetch("loading.html")

.then(response=>response.text())

.then(data=>{


document.getElementById("loadingArea").innerHTML=data;


})

.catch(error=>{

console.log("Loading Error",error);

});









// ===============================
// PROFILE
// ===============================


function toggleProfile(){


document
.getElementById("profileMenu")
.classList.toggle("show");


}



function myAccount(){


location.href="myaccount.html";


}




function logout(){


localStorage.clear();


location.href="index.html";


}




function goBack(){


location.href="dashboard.html";


}







window.onload=function(){



let user=
localStorage.getItem("username");


if(user){

document.getElementById("username").innerHTML=user;

}



let pic=
localStorage.getItem("picture");


if(pic){

document.getElementById("profileImg").src=pic;

}



loadSupport();


};









// ===============================
// LOAD SUPPORT
// ===============================


function loadSupport(){


showLoading("Loading Support...");



fetch(API_URL,{

method:"POST",

headers:{

"Content-Type":

"text/plain;charset=utf-8"

},


body:JSON.stringify({

action:"getPendingSupport"

})


})

.then(res=>res.json())

.then(data=>{


let html="";



if(data.data){



data.data.forEach(item=>{



html+=`

<tr>

<td>${item.customerId || ""}</td>

<td>${item.problem || ""}</td>

<td>${item.reference || ""}</td>

<td>${item.date || ""}</td>


<td>


<button class="edit-btn"

onclick="editSupport(${item.row})">


<i class="fa fa-edit"></i>

Edit


</button>


</td>


</tr>

`;



});



}



document.getElementById("supportList").innerHTML=html;



hideLoading();


})

.catch(error=>{


console.log(error);


hideLoading();



showSuccess(
"Error",
"Server Error"
);



});



}









// ===============================
// EDIT LOAD
// ===============================


function editSupport(row){



currentRow=row;



showLoading("Loading Data...");



fetch(API_URL,{

method:"POST",

headers:{

"Content-Type":

"text/plain;charset=utf-8"

},


body:JSON.stringify({

action:"getSingleSupport",

row:row


})


})


.then(res=>res.json())


.then(data=>{



document.getElementById("customerId").value=
data.customerId || "";



document.getElementById("problem").value=
data.problem || "";



document.getElementById("reference").value=
data.reference || "";



document.getElementById("date").value=
data.date || "";



document.getElementById("support").value=
data.support || "";



document.getElementById("supportWork").value=
data.supportWork || "";





hideLoading();



document
.getElementById("editModal")
.classList.add("show");



})


.catch(error=>{


console.log(error);


hideLoading();


});



}









// ===============================
// CLOSE EDIT
// ===============================


function closeEdit(){


document
.getElementById("editModal")
.classList.remove("show");


}









// ===============================
// UPDATE
// ===============================


function updateSupport(){



showLoading("Updating...");



fetch(API_URL,{

method:"POST",

headers:{

"Content-Type":

"text/plain;charset=utf-8"

},


body:JSON.stringify({


action:"updateSupport",


row:currentRow,


customerId:
document.getElementById("customerId").value,


problem:
document.getElementById("problem").value,


reference:
document.getElementById("reference").value,


date:
document.getElementById("date").value,


support:
document.getElementById("support").value,


supportWork:
document.getElementById("supportWork").value



})


})



.then(res=>res.json())


.then(data=>{


hideLoading();



closeEdit();



showSuccess(
"Success",
"Updated Successfully"
);



loadSupport();



})

.catch(error=>{


hideLoading();


showSuccess(
"Error",
"Update Failed"
);


});


}









// ===============================
// DELETE POPUP
// ===============================


function openDelete(){


if(!document.getElementById("deleteBox")){


createDeleteBox();


}


document.getElementById("deleteBox")
.style.display="flex";


}






function closeDelete(){


document.getElementById("deleteBox")
.style.display="none";


}







function deleteSupport(){



showLoading("Deleting...");



fetch(API_URL,{

method:"POST",

headers:{

"Content-Type":

"text/plain;charset=utf-8"

},


body:JSON.stringify({

action:"deleteSupport",

row:currentRow

})


})

.then(res=>res.json())


.then(data=>{


hideLoading();


closeDelete();


closeEdit();


showSuccess(
"Deleted",
"Deleted Successfully"
);



loadSupport();


})

.catch(error=>{


hideLoading();


});



}
  <script>


// ===============================
// CREATE DELETE POPUP
// ===============================


function createDeleteBox(){


let div=document.createElement("div");


div.id="deleteBox";


div.style.position="fixed";

div.style.top="0";

div.style.left="0";

div.style.width="100%";

div.style.height="100%";

div.style.background="rgba(0,0,0,.45)";

div.style.display="flex";

div.style.alignItems="center";

div.style.justifyContent="center";

div.style.zIndex="3000";




div.innerHTML=`

<div style="
background:white;
padding:30px;
border-radius:20px;
text-align:center;
width:320px;
box-shadow:0 20px 50px rgba(0,0,0,.3);
">


<h2>
<i class="fa fa-trash"
style="color:#ef4444"></i>

Delete Support?
</h2>


<p style="margin:15px 0">

Are you sure you want to delete?

</p>


<button onclick="deleteSupport()"

style="
background:#ef4444;
color:white;
border:none;
padding:10px 20px;
border-radius:10px;
cursor:pointer;
margin:5px;
">

Yes Delete

</button>



<button onclick="closeDelete()"

style="
background:#64748b;
color:white;
border:none;
padding:10px 20px;
border-radius:10px;
cursor:pointer;
margin:5px;
">

Cancel

</button>


</div>

`;



document.body.appendChild(div);


}









// ===============================
// SUCCESS POPUP
// ===============================


function showSuccess(title,msg){



let old=document.getElementById("successBox");


if(old){

old.remove();

}



let box=document.createElement("div");


box.id="successBox";



box.style.position="fixed";

box.style.top="0";

box.style.left="0";

box.style.width="100%";

box.style.height="100%";

box.style.background="rgba(0,0,0,.45)";

box.style.display="flex";

box.style.alignItems="center";

box.style.justifyContent="center";

box.style.zIndex="4000";





box.innerHTML=`

<div style="
background:white;
padding:35px;
border-radius:25px;
text-align:center;
width:330px;
">


<i class="fa fa-circle-check"

style="
font-size:55px;
color:#10b981;
"></i>



<h2 style="margin-top:15px">

${title}

</h2>



<p style="margin:15px 0">

${msg}

</p>




<button onclick="closeSuccess()"

style="
background:#10b981;
color:white;
border:none;
padding:10px 30px;
border-radius:10px;
cursor:pointer;
">

OK

</button>



</div>

`;



document.body.appendChild(box);



}









function closeSuccess(){


let box=document.getElementById("successBox");


if(box){

box.remove();

}


}









// ===============================
// LOADING CONTROL
// ===============================


function showLoading(text="Loading..."){



let box=document.getElementById("loadingBox");



if(!box){

console.log("loading.html not loaded");

return;

}



box.style.display="block";



let txt=document.getElementById("loadingText");


if(txt){

txt.innerHTML=text;

}



let percent=document.getElementById("percent");


let bar=document.getElementById("progressBar");



let count=0;



clearInterval(loadingTimer);



loadingTimer=setInterval(()=>{


if(count<100){


count++;



if(percent){

percent.innerHTML=count+"%";

}



if(bar){

bar.style.width=count+"%";

}



}


},25);



}









function hideLoading(){



clearInterval(loadingTimer);



let box=document.getElementById("loadingBox");



let percent=document.getElementById("percent");


let bar=document.getElementById("progressBar");



if(percent){

percent.innerHTML="100%";

}



if(bar){

bar.style.width="100%";

}





setTimeout(()=>{


if(box){

box.style.display="none";

}



},400);



}






</script>


</body>

</html>
