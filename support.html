<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pending Support</title>


<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">


<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}


body{

background:#f1f5f9;
padding:20px;

}



header{

background:white;
padding:18px 25px;
border-radius:15px;

display:flex;
justify-content:space-between;
align-items:center;

box-shadow:0 5px 20px rgba(0,0,0,.1);

}



.left{

display:flex;
align-items:center;
gap:20px;

}



.back{

background:#03543f;
color:white;
border:none;
padding:10px 15px;
border-radius:8px;
cursor:pointer;

}



.profile{

position:relative;
display:flex;
align-items:center;
gap:10px;
cursor:pointer;

}



.profile img{

width:45px;
height:45px;
border-radius:50%;
object-fit:cover;

}



.profile-menu{

position:absolute;
right:0;
top:60px;

background:white;

width:180px;

padding:10px;

border-radius:10px;

box-shadow:0 5px 20px #aaa;

display:none;

z-index:20;

}



.profile-menu.show{

display:block;

}



.profile-menu button{

width:100%;
padding:12px;

background:white;

border:none;

cursor:pointer;

text-align:left;

border-radius:8px;

}



.profile-menu button:hover{

background:#eee;

}




.table-box{

margin-top:25px;

background:white;

padding:20px;

border-radius:15px;

overflow:auto;

}




table{

width:100%;
border-collapse:collapse;

}



th{

background:#03543f;
color:white;

padding:13px;

}



td{

padding:12px;

text-align:center;

border-bottom:1px solid #ddd;

}



.edit-btn{

background:#03543f;

color:white;

border:none;

padding:8px 15px;

border-radius:8px;

cursor:pointer;

}





/* POPUP */


.modal{

display:none;

position:fixed;

top:0;
left:0;

width:100%;
height:100%;

background:rgba(0,0,0,.5);

justify-content:center;

align-items:center;

}



.modal.show{

display:flex;

}




.box{

background:white;

width:380px;

padding:25px;

border-radius:15px;

}



.box h3{

margin-bottom:15px;

}



.box label{

display:block;

margin-top:10px;

}



.box input,
.box textarea{

width:100%;

padding:10px;

margin-top:5px;

border:1px solid #ccc;

border-radius:8px;

}



.box textarea{

resize:none;

}



.btns{

margin-top:15px;

}



.submit{

background:#03543f;

color:white;

border:none;

padding:10px 18px;

border-radius:8px;

cursor:pointer;

}



.cancel{

background:red;

color:white;

border:none;

padding:10px 18px;

border-radius:8px;

cursor:pointer;

}



</style>

</head>


<body>



<header>



<div class="left">


<button class="back"
onclick="backDashboard()">

<i class="fa-solid fa-arrow-left"></i>

Back

</button>


<h2>

<i class="fa-solid fa-headset"></i>

Pending Support

</h2>


</div>






<div class="profile"
onclick="profileToggle()">



<img id="profileImg"
src="assets/profile.png">


<span id="username">

User

</span>



<i class="fa-solid fa-angle-down"></i>





<div class="profile-menu"
id="profileMenu"
onclick="event.stopPropagation()">



<button onclick="myAccount()">

<i class="fa-solid fa-user"></i>

My Account

</button>



<button onclick="logout()">

<i class="fa-solid fa-right-from-bracket"></i>

Logout

</button>



</div>



</div>


</header>







<div class="table-box">


<table>


<thead>

<tr>

<th>Customer ID</th>

<th>Problem</th>

<th>Reference</th>

<th>Date</th>

<th>Action</th>

</tr>


</thead>



<tbody id="supportList">


</tbody>



</table>


</div>








<!-- EDIT POPUP -->


<div class="modal" id="editModal">


<div class="box">


<h3>
Update Support
</h3>



<input type="hidden" id="editRow">



<label>
Customer ID
</label>

<input id="customerId" readonly>




<label>
Problem
</label>

<textarea id="problem" readonly></textarea>




<label>
Reference
</label>

<input id="reference" readonly>




<label>
Date
</label>

<input id="date" readonly>




<label>
Support
</label>

<input id="support" readonly>




<label>
Support Work
</label>

<textarea id="supportWork"
placeholder="Write work"></textarea>





<div class="btns">


<button class="submit"
onclick="saveSupport()">

Submit

</button>


<button class="cancel"
onclick="closeEdit()">

Cancel

</button>



</div>


</div>


</div>








<script>



const API_URL =
"https://script.google.com/macros/s/AKfycbxRQLGuRc-P8bZ2FE-6ua8B1iPH6IQ1tAffS0erigyv15xQSALef2nrNTSqdMOYHt1fqg/exec";



let currentRow="";




// LOAD DATA


function loadSupport(){



fetch(API_URL,{

method:"POST",

body:JSON.stringify({

action:"getPendingSupport"

})

})


.then(r=>r.json())


.then(data=>{


let html="";


data.data.forEach(row=>{


html+=`

<tr>

<td>${row.customerId}</td>

<td>${row.problem}</td>

<td>${row.reference}</td>

<td>${row.date}</td>


<td>

<button class="edit-btn"
onclick="editSupport(${row.row})">

Edit

</button>


</td>


</tr>


`;



});


document.getElementById("supportList").innerHTML=html;



});


}







// EDIT


function editSupport(row){


currentRow=row;


fetch(API_URL,{

method:"POST",

body:JSON.stringify({

action:"getSingleSupport",

row:row

})


})


.then(r=>r.json())


.then(data=>{


customerId.value=data.customerId;

problem.value=data.problem;

reference.value=data.reference;

date.value=data.date;

support.value=data.support || localStorage.getItem("username");

supportWork.value=data.supportWork || "";

editRow.value=row;



document
.getElementById("editModal")
.classList.add("show");


});


}






function saveSupport(){


fetch(API_URL,{

method:"POST",

body:JSON.stringify({

action:"updateSupport",

row:currentRow,

support:support.value,

supportWork:supportWork.value


})


})


.then(r=>r.json())

.then(()=>{


alert("Updated Successfully");

closeEdit();

loadSupport();


});


}







function closeEdit(){

document
.getElementById("editModal")
.classList.remove("show");

}




// PROFILE


function profileToggle(){

document
.getElementById("profileMenu")
.classList.toggle("show");

}



let name =
localStorage.getItem("username");


if(name)

username.innerText=name;




let pic =
localStorage.getItem("picture");


if(pic)

profileImg.src=pic;






function logout(){

localStorage.clear();

location.href="index.html";

}




function myAccount(){

location.href="myaccount.html";

}



function backDashboard(){

location.href="dashboard.html";

}




loadSupport();



</script>



</body>

</html>
