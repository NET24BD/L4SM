<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>Pending Support</title>


<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">


<style>


*{

margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;

}



body{

background:linear-gradient(135deg,#ecfdf5,#eff6ff);

padding:20px;

}




/* ================= HEADER ================= */


.header{

background:white;

padding:18px 25px;

border-radius:20px;

display:flex;

justify-content:space-between;

align-items:center;

box-shadow:0 10px 30px rgba(0,0,0,.15);

}



.left{

display:flex;

align-items:center;

gap:15px;

}



.back{

background:linear-gradient(135deg,#065f46,#10b981);

color:white;

border:none;

padding:10px 18px;

border-radius:10px;

cursor:pointer;

font-weight:bold;

}



.back:hover{

transform:scale(1.05);

}






/* ================= PROFILE ================= */



.profile{

display:flex;

align-items:center;

gap:10px;

cursor:pointer;

position:relative;

}



.profile img{

width:50px;

height:50px;

border-radius:50%;

object-fit:cover;

border:3px solid #10b981;

}




.profile-menu{

display:none;

position:absolute;

right:0;

top:65px;

width:190px;

background:white;

padding:10px;

border-radius:15px;

box-shadow:0 10px 30px rgba(0,0,0,.2);

z-index:100;

}



.profile-menu.show{

display:block;

}



.profile-menu button{

width:100%;

padding:12px;

border:none;

background:white;

cursor:pointer;

border-radius:10px;

text-align:left;

}



.profile-menu button:hover{

background:#ecfdf5;

}






/* ================= TABLE ================= */


.table-box{

margin-top:25px;

background:white;

padding:20px;

border-radius:20px;

box-shadow:0 10px 30px rgba(0,0,0,.12);

overflow:auto;

}




table{

width:100%;

border-collapse:collapse;

}




th{

background:linear-gradient(135deg,#065f46,#10b981);

color:white;

padding:14px;

}




td{

padding:12px;

text-align:center;

border-bottom:1px solid #ddd;

}



tr:hover td{

background:#ecfdf5;

}




.edit-btn{

background:#2563eb;

color:white;

border:none;

padding:8px 18px;

border-radius:10px;

cursor:pointer;

}







/* ================= LOADING ================= */


#loadingArea{

position:fixed;

top:0;

left:0;

width:100%;

height:100%;

z-index:9999;

}









/* ================= POPUP ================= */


.modal{

display:none;

position:fixed;

top:0;

left:0;

width:100%;

height:100%;


background:rgba(0,0,0,.45);


justify-content:center;

align-items:center;


z-index:2000;


}



.modal.show{

display:flex;

}




.box{

position:relative;

background:white;

width:450px;

padding:30px;

border-radius:22px;

box-shadow:0 20px 60px rgba(0,0,0,.3);

max-height:90vh;

overflow:auto;

}




.close-icon{

position:absolute;

right:15px;

top:15px;

width:35px;

height:35px;

border:none;

border-radius:50%;

background:#ef4444;

color:white;

font-size:20px;

cursor:pointer;

}



.close-icon:hover{

transform:rotate(90deg);

}






.box h2{

color:#065f46;

margin-bottom:15px;

}





label{

display:block;

margin-top:10px;

font-weight:bold;

color:#334155;

}




input,
textarea{


width:100%;


padding:11px;


margin-top:5px;


border:1px solid #cbd5e1;


border-radius:10px;


outline:none;


}



textarea{

height:80px;

resize:none;

}





.btns{

display:flex;

gap:10px;

margin-top:20px;

}



.btns button{

padding:11px 18px;

border:none;

border-radius:10px;

cursor:pointer;

font-weight:bold;

}




.submit{

background:#10b981;

color:white;

}



.cancel{

background:#64748b;

color:white;

}



.delete{

background:#ef4444;

color:white;

}









/* ================= DELETE POPUP ================= */



.confirm-box{


display:none;


position:fixed;


top:0;


left:0;


width:100%;


height:100%;


background:rgba(0,0,0,.45);


justify-content:center;


align-items:center;


z-index:3000;


}



.confirm-content{


background:white;


width:330px;


padding:30px;


border-radius:20px;


text-align:center;


}



.confirm-content h3{

color:#dc2626;

}





.confirm-content button{


padding:10px 20px;


margin:8px;


border:none;


border-radius:10px;


cursor:pointer;


}




.yes-delete{

background:#dc2626;

color:white;

}



.no-delete{

background:#64748b;

color:white;

}








/* ================= SUCCESS POPUP ================= */



.success-box{


display:none;


position:fixed;


top:0;


left:0;


width:100%;


height:100%;


background:rgba(0,0,0,.45);


justify-content:center;


align-items:center;


z-index:4000;


}




.success-content{


background:white;


width:340px;


padding:30px;


border-radius:22px;


text-align:center;


}




.success-icon{


width:70px;


height:70px;


margin:auto;


background:#10b981;


color:white;


border-radius:50%;


display:flex;


align-items:center;


justify-content:center;


font-size:35px;


}




.success-content h3{

color:#10b981;

margin:15px;

}



.success-content button{


background:#10b981;


color:white;


border:none;


padding:10px 35px;


border-radius:10px;


cursor:pointer;


}


</style>


</head>



<body>



<!-- Loading -->

<div id="loadingArea"></div>





<!-- Header -->

<div class="header">



<div class="left">



<button class="back"
onclick="location.href='dashboard.html'">


<i class="fa fa-arrow-left"></i>

Back


</button>



<h2>

<i class="fa fa-headset"></i>

Pending Support

</h2>



</div>





<div class="profile"
onclick="toggleProfile()">



<img id="profileImg"
src="assets/profile.png">



<span id="username">

User

</span>



<i class="fa fa-angle-down"></i>





<div class="profile-menu"
id="profileMenu"
onclick="event.stopPropagation()">



<button onclick="myAccount()">

<i class="fa fa-user"></i>

My Account

</button>



<button onclick="logout()">

<i class="fa fa-right-from-bracket"></i>

Logout

</button>



</div>


</div>


</div>
<!-- ================= SUPPORT TABLE ================= -->


<div class="table-box">


<table>


<thead>

<tr>

<th>Customer ID</th>

<th>Problem</th>

<th>Reference</th>

<th>Date</th>

<th>Action</th>


</tr>


</thead>



<tbody id="supportList">


</tbody>


</table>


</div>










<!-- ================= EDIT POPUP ================= -->


<div class="modal" id="editModal">



<div class="box">


<button class="close-icon"
onclick="closeEdit()">


<i class="fa-solid fa-xmark"></i>


</button>




<h2>

<i class="fa-solid fa-pen"></i>

Edit Support

</h2>





<input type="hidden" id="editRow">






<label>

Customer ID

</label>


<input id="customerId">






<label>

Problem

</label>


<textarea id="problem"></textarea>







<label>

Reference

</label>


<input id="reference">







<label>

Date

</label>


<input type="date" id="supportDate">








<label>

Support

</label>


<input id="support">








<label>

Support Work

</label>


<textarea id="supportWork"></textarea>








<label>

Support Time

</label>


<input id="supportTime">








<div class="btns">



<button class="submit"
onclick="updateSupport()">



<i class="fa fa-check"></i>

Submit


</button>






<button class="cancel"
onclick="closeEdit()">



Cancel


</button>






<button class="delete"
onclick="openDelete()">



<i class="fa fa-trash"></i>

Delete


</button>




</div>




</div>



</div>









<!-- ================= DELETE POPUP ================= -->


<div class="confirm-box"
id="deleteBox">



<div class="confirm-content">



<h3>

Delete Support?

</h3>



<p>

Are you sure?

</p>





<button class="yes-delete"
onclick="deleteSupport()">



Yes Delete


</button>






<button class="no-delete"
onclick="closeDelete()">



Cancel


</button>




</div>


</div>









<!-- ================= SUCCESS POPUP ================= -->


<div class="success-box"
id="successBox">



<div class="success-content">



<div class="success-icon">


<i class="fa fa-check"></i>


</div>




<h3 id="successTitle">

Success

</h3>




<p id="successMessage">

Completed Successfully

</p>




<button onclick="closeSuccess()">


OK


</button>



</div>


</div>









<script>



// ===============================
// LOGIN CHECK
// ===============================


if(localStorage.getItem("isLogin")!="true"){


location.href="index.html";


}






// ===============================
// API
// ===============================


const API_URL =

"https://script.google.com/macros/s/AKfycbxRQLGuRc-P8bZ2FE-6ua8B1iPH6IQ1tAffS0erigyv15xQSALef2nrNTSqdMOYHt1fqg/exec";






let currentRow="";







// ===============================
// LOAD LOADING FILE
// ===============================


fetch("loading.html")

.then(res=>res.text())

.then(data=>{


document.getElementById("loadingArea").innerHTML=data;


});









// ===============================
// LOAD SUPPORT DATA
// ===============================


function loadSupport(){



showLoading("Loading Support...");



fetch(API_URL,{

method:"POST",

body:JSON.stringify({

action:"getPendingSupport"


})

})



.then(res=>res.json())



.then(data=>{



let html="";



data.data.forEach(row=>{


html +=`


<tr>


<td>${row.customerId}</td>


<td>${row.problem}</td>


<td>${row.reference}</td>


<td>${row.date}</td>


<td>


<button class="edit-btn"

onclick="editSupport(${row.row})">


<i class="fa fa-edit"></i>

Edit


</button>


</td>


</tr>


`;



});




document.getElementById("supportList").innerHTML=html;



hideLoading();



})

.catch(err=>{


hideLoading();


showSuccess(
"Error",
"Server Error"
);


});



}











// ===============================
// EDIT LOAD
// ===============================


function editSupport(row){



currentRow=row;



showLoading("Loading Data...");



fetch(API_URL,{

method:"POST",

body:JSON.stringify({

action:"getSingleSupport",

row:row


})

})



.then(res=>res.json())

.then(data=>{



customerId.value=data.customerId || "";


problem.value=data.problem || "";


reference.value=data.reference || "";


supportDate.value=data.date || "";


support.value=data.support || "";


supportWork.value=data.supportWork || "";


supportTime.value=data.supportTime || "";





hideLoading();



editModal.classList.add("show");



});



}









// ===============================
// CLOSE EDIT
// ===============================


function closeEdit(){


editModal.classList.remove("show");


}









// ===============================
// PROFILE
// ===============================


function toggleProfile(){


profileMenu.classList.toggle("show");


}



username.innerHTML =
localStorage.getItem("username") || "User";



if(localStorage.getItem("picture")){


profileImg.src=
localStorage.getItem("picture");


}




function myAccount(){


location.href="myaccount.html";


}



function logout(){


localStorage.clear();


location.href="index.html";


}

<script>


// ===============================
// UPDATE SUPPORT
// ===============================


function updateSupport(){


showLoading("Updating Support...");



fetch(API_URL,{

method:"POST",

body:JSON.stringify({


action:"updateSupport",


row:currentRow,


customerId:
document.getElementById("customerId").value,


problem:
document.getElementById("problem").value,


reference:
document.getElementById("reference").value,


date:
document.getElementById("supportDate").value,


support:
document.getElementById("support").value,


supportWork:
document.getElementById("supportWork").value,


supportTime:
document.getElementById("supportTime").value



})

})



.then(res=>res.json())


.then(data=>{


hideLoading();



closeEdit();



showSuccess(

"Updated",

"Support Updated Successfully"

);



loadSupport();



})

.catch(()=>{


hideLoading();


showSuccess(

"Error",

"Update Failed"

);


});



}









// ===============================
// OPEN DELETE
// ===============================


function openDelete(){


document.getElementById("deleteBox").style.display="flex";


}







// ===============================
// CLOSE DELETE
// ===============================


function closeDelete(){


document.getElementById("deleteBox").style.display="none";


}









// ===============================
// DELETE SUPPORT
// ===============================


function deleteSupport(){



showLoading("Deleting Support...");



fetch(API_URL,{

method:"POST",

body:JSON.stringify({


action:"deleteSupport",


row:currentRow



})


})



.then(res=>res.json())


.then(data=>{


hideLoading();



closeDelete();


closeEdit();



showSuccess(

"Deleted",

"Support Deleted Successfully"

);



loadSupport();



})



.catch(()=>{


hideLoading();



showSuccess(

"Error",

"Delete Failed"

);


});



}









// ===============================
// SUCCESS POPUP
// ===============================


function showSuccess(title,message){



document.getElementById("successTitle").innerHTML=title;


document.getElementById("successMessage").innerHTML=message;



document.getElementById("successBox").style.display="flex";



}






function closeSuccess(){



document.getElementById("successBox").style.display="none";


}









// ===============================
// LOADING CONTROL
// ===============================


function showLoading(text="Loading..."){



let box=document.getElementById("loadingBox");



if(!box){


console.log("Loading not ready");


return;


}




box.style.display="block";



let txt=document.getElementById("loadingText");


if(txt){

txt.innerHTML=text;

}





let percent=
document.getElementById("percent");


let bar=
document.getElementById("progressBar");



if(percent){

percent.innerHTML="0%";

}



if(bar){

bar.style.width="0%";

}





let count=0;



let timer=setInterval(()=>{



if(count<100){


count++;



if(percent){

percent.innerHTML=count+"%";

}



if(bar){

bar.style.width=count+"%";

}


}


else{


clearInterval(timer);


}



},25);



}









function hideLoading(){



let box=document.getElementById("loadingBox");



if(!box){

return;

}



let percent=
document.getElementById("percent");


let bar=
document.getElementById("progressBar");




if(percent){

percent.innerHTML="100%";

}



if(bar){

bar.style.width="100%";

}





setTimeout(()=>{


box.style.display="none";


},400);



}










// ===============================
// START SYSTEM
// ===============================



setTimeout(()=>{


loadSupport();


},500);



</script>



</body>


</html>




</script>
