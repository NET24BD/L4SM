<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pending Support</title>


<link rel="stylesheet" href="support.css">


<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">


</head>


<body>


<div class="container">



<!-- HEADER -->

<header>


<div class="title">


<button class="back-btn" onclick="goBack()">

<i class="fa-solid fa-arrow-left"></i>

Back

</button>



<h2>

<i class="fa-solid fa-headset"></i>

Pending Support

</h2>



</div>






<!-- PROFILE -->


<div class="profile" onclick="toggleProfile()">



<img id="profileImg"
src="assets/profile.png">



<span id="headerName">
User
</span>



<i class="fa-solid fa-angle-down"></i>






<div class="profile-menu"
id="profileMenu"
onclick="event.stopPropagation()">



<button onclick="openMyAccount()">

<i class="fa-solid fa-user"></i>

My Account

</button>



<button onclick="logout()">

<i class="fa-solid fa-right-from-bracket"></i>

Logout

</button>



</div>



</div>



</header>










<!-- TABLE -->


<div class="table-box">



<table>


<thead>

<tr>

<th>
Customer ID
</th>


<th>
Problem
</th>


<th>
Reference
</th>


<th>
Date
</th>


<th>
Action
</th>


</tr>


</thead>



<tbody id="supportList">


<tr>

<td colspan="5">

Loading...

</td>

</tr>


</tbody>



</table>



</div>








</div>









<!-- EDIT POPUP -->


<div class="edit-modal"
id="editModal">


<div class="edit-box">



<h3>

Update Support

</h3>



<input type="hidden"
id="editRow">





<label>
Support
</label>


<input 
type="text"
id="supportName"
readonly>






<label>
Support Work
</label>


<textarea
id="supportWork"
rows="5"
placeholder="Write support work"></textarea>






<div class="popup-btn">


<button onclick="saveEdit()"
class="save-btn">

Submit

</button>




<button onclick="closeEdit()"
class="cancel-btn">

Cancel

</button>


</div>



</div>



</div>









<script src="auth.js"></script>


<script>


const API_URL =
"https://script.google.com/macros/s/AKfycbxRQLGuRc-P8bZ2FE-6ua8B1iPH6IQ1tAffS0erigyv15xQSALef2nrNTSqdMOYHt1fqg/exec";





let editRow = "";






// ======================
// LOAD SUPPORT
// ======================


function loadSupport(){



fetch(API_URL,{

method:"POST",

body:JSON.stringify({

action:"getPendingSupport"

})


})


.then(res=>res.json())


.then(data=>{



let html="";



if(data.status=="success"){



if(data.data.length==0){


html=`

<tr>

<td colspan="5">

No Pending Support

</td>

</tr>

`;



}

else{



data.data.forEach(row=>{


html+=`

<tr>


<td>
${row.customerId}
</td>


<td>
${row.problem}
</td>


<td>
${row.reference}
</td>


<td>
${row.date}
</td>



<td>


<button class="edit-btn"
onclick="openEdit(${row.row})">


<i class="fa-solid fa-pen"></i>

Edit


</button>



</td>


</tr>

`;


});


}




}


else{


html=`

<tr>

<td colspan="5">

${data.message}

</td>

</tr>

`;

}



document.getElementById("supportList").innerHTML=html;



})

.catch(()=>{


document.getElementById("supportList").innerHTML=

`
<tr>
<td colspan="5">
Server Error
</td>
</tr>
`;


});



}










// ======================
// OPEN EDIT
// ======================


function openEdit(row){


editRow=row;



document.getElementById("editRow").value=row;



document.getElementById("supportName").value=

localStorage.getItem("username") || "User";



document.getElementById("supportWork").value="";



document.getElementById("editModal")
.classList.add("show");



}








// ======================
// SAVE EDIT
// ======================


function saveEdit(){



let support =
document.getElementById("supportName").value;



let work =
document.getElementById("supportWork").value.trim();




if(work==""){

alert("Write Support Work");

return;

}




fetch(API_URL,{

method:"POST",

body:JSON.stringify({

action:"updateSupport",

row:editRow,

support:support,

supportWork:work

})


})


.then(res=>res.json())


.then(data=>{


alert("Support Updated");


closeEdit();


loadSupport();


});



}









function closeEdit(){


document.getElementById("editModal")
.classList.remove("show");


}










// ======================
// PROFILE
// ======================


function toggleProfile(){


document
.getElementById("profileMenu")
.classList.toggle("show");


}



document.addEventListener("click",function(e){


let profile=document.querySelector(".profile");


if(!profile.contains(e.target)){


document
.getElementById("profileMenu")
.classList.remove("show");


}


});






document.addEventListener("DOMContentLoaded",()=>{


let username =
localStorage.getItem("username");


let picture =
localStorage.getItem("picture");



if(username)

document.getElementById("headerName").innerText=username;



if(picture)

document.getElementById("profileImg").src=picture;



loadSupport();



});







function openMyAccount(){

window.location.href="myaccount.html";

}



function logout(){

localStorage.clear();

window.location.href="index.html";

}



function goBack(){

window.location.href="dashboard.html";

}



</script>



<style>


*{

margin:0;

padding:0;

box-sizing:border-box;

font-family:Arial;

}



body{

background:#f1f5f9;

padding:20px;

}




header{

background:white;

padding:18px;

border-radius:15px;

display:flex;

justify-content:space-between;

align-items:center;

margin-bottom:20px;

box-shadow:0 5px 20px #ddd;

}



.title{

display:flex;

gap:20px;

align-items:center;

}



.back-btn{

background:#03543f;

color:white;

border:0;

padding:10px 15px;

border-radius:8px;

cursor:pointer;

}



.profile{

position:relative;

display:flex;

align-items:center;

gap:10px;

cursor:pointer;

}



.profile img{

width:45px;

height:45px;

border-radius:50%;

}



.profile-menu{

position:absolute;

right:0;

top:55px;

background:white;

width:180px;

padding:10px;

border-radius:10px;

box-shadow:0 5px 20px #aaa;

display:none;

z-index:10;

}



.profile-menu.show{

display:block;

}



.profile-menu button{

width:100%;

padding:10px;

border:0;

background:white;

text-align:left;

cursor:pointer;

}




.table-box{

background:white;

padding:20px;

border-radius:15px;

overflow:auto;

}



table{

width:100%;

border-collapse:collapse;

}



th{

background:#03543f;

color:white;

padding:12px;

}



td{

padding:12px;

text-align:center;

border-bottom:1px solid #ddd;

}



.edit-btn{

background:#03543f;

color:white;

border:0;

padding:8px 15px;

border-radius:8px;

cursor:pointer;

}




.edit-modal{

position:fixed;

top:0;

left:0;

width:100%;

height:100%;

background:rgba(0,0,0,.5);

display:none;

justify-content:center;

align-items:center;

}



.edit-modal.show{

display:flex;

}



.edit-box{

background:white;

width:350px;

padding:25px;

border-radius:15px;

}



.edit-box input,
.edit-box textarea{

width:100%;

padding:10px;

margin:10px 0;

}



.save-btn,
.cancel-btn{

padding:10px 15px;

border:0;

border-radius:8px;

cursor:pointer;

}



.save-btn{

background:#03543f;

color:white;

}



.cancel-btn{

background:red;

color:white;

}


</style>


</body>

</html>
