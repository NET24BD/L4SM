<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>Pending Support</title>


<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">


<style>


*{

margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;

}



body{

background:linear-gradient(135deg,#ecfdf5,#eff6ff);

padding:20px;

}




/* HEADER */

.header{

background:white;

padding:18px 25px;

border-radius:20px;

display:flex;

justify-content:space-between;

align-items:center;

box-shadow:0 10px 30px rgba(0,0,0,.15);

}



.left{

display:flex;

align-items:center;

gap:15px;

}



.back-btn{

background:#065f46;

color:white;

border:none;

padding:10px 18px;

border-radius:10px;

cursor:pointer;

font-weight:bold;

}



.back-btn:hover{

background:#10b981;

}








/* PROFILE */


.profile{

display:flex;

align-items:center;

gap:10px;

cursor:pointer;

position:relative;

}



.profile img{

width:50px;

height:50px;

border-radius:50%;

object-fit:cover;

border:3px solid #10b981;

}



.profile-name{

font-weight:bold;

}



.profile-menu{


display:none;

position:absolute;

right:0;

top:65px;

background:white;

width:200px;

padding:10px;

border-radius:15px;

box-shadow:0 10px 30px rgba(0,0,0,.2);

z-index:999;


}



.profile-menu.show{

display:block;

}



.profile-menu button{


width:100%;


padding:12px;


border:none;


background:white;


border-radius:10px;


cursor:pointer;


text-align:left;


font-size:15px;


}



.profile-menu button:hover{

background:#ecfdf5;

}








/* TABLE */


.table-box{


margin-top:25px;


background:white;


padding:20px;


border-radius:20px;


box-shadow:0 10px 30px rgba(0,0,0,.12);


overflow:auto;


}




table{


width:100%;


border-collapse:collapse;


}



thead th{


background:#065f46;


color:white;


padding:14px;


}



tbody td{


padding:12px;


text-align:center;


border-bottom:1px solid #ddd;


}



tbody tr:hover{


background:#ecfdf5;


}






.edit-btn{


background:#2563eb;


color:white;


border:none;


padding:8px 15px;


border-radius:10px;


cursor:pointer;


}



.edit-btn:hover{


background:#1d4ed8;


}







/* LOADING AREA */


#loadingArea{


position:fixed;


top:0;


left:0;


width:100%;


height:100%;


z-index:9999;


}






/* MOBILE */


@media(max-width:700px){


.header{


flex-direction:column;


gap:15px;


}



table{


font-size:13px;


}



}



</style>


</head>



<body>



<!-- Loading -->

<div id="loadingArea"></div>






<!-- HEADER -->


<div class="header">





<div class="left">



<button class="back-btn"
onclick="goBack()">



<i class="fa fa-arrow-left"></i>


Back


</button>




<h2>


<i class="fa fa-headset"></i>


Pending Support


</h2>



</div>









<!-- PROFILE -->


<div class="profile"
onclick="toggleProfile()">





<img id="profileImg"
src="assets/profile.png">





<span class="profile-name"
id="username">

User

</span>





<i class="fa fa-angle-down"></i>









<div class="profile-menu"
id="profileMenu"
onclick="event.stopPropagation()">






<button onclick="myAccount()">



<i class="fa fa-user"></i>


My Account


</button>







<button onclick="logout()">



<i class="fa fa-right-from-bracket"></i>


Logout


</button>







</div>







</div>





</div>









<!-- SUPPORT TABLE -->



<div class="table-box">



<table>



<thead>


<tr>


<th>Customer ID</th>


<th>Problem</th>


<th>Reference</th>


<th>Date</th>


<th>Action</th>



</tr>


</thead>





<tbody id="supportList">



</tbody>





</table>



</div>
<!-- ================= EDIT POPUP ================= -->


<div class="modal" id="editModal">


<div class="modal-box">



<button class="close-btn"
onclick="closeEdit()">

<i class="fa fa-xmark"></i>

</button>





<h2>

<i class="fa fa-pen"></i>

Edit Support

</h2>






<input type="hidden" id="editRow">







<label>Customer ID</label>

<input id="customerId">






<label>Problem</label>

<textarea id="problem"></textarea>







<label>Reference</label>

<input id="reference">






<label>Date</label>

<input type="date" id="supportDate">






<label>Support</label>

<input id="support">






<label>Support Work</label>

<textarea id="supportWork"></textarea>








<label>Support Time</label>

<input id="supportTime">







<div class="popup-buttons">



<button class="save-btn"
onclick="updateSupport()">



<i class="fa fa-check"></i>

Submit


</button>





<button class="cancel-btn"
onclick="closeEdit()">



Cancel


</button>





<button class="delete-btn"
onclick="openDelete()">



<i class="fa fa-trash"></i>

Delete


</button>






</div>




</div>


</div>









<!-- ================= DELETE POPUP ================= -->


<div class="confirm-modal"
id="deleteBox">


<div class="confirm-box">


<h2>

<i class="fa fa-trash"></i>

Delete Support?

</h2>


<p>

Are you sure you want to delete this support?

</p>



<button class="yes-delete"
onclick="deleteSupport()">



Yes Delete


</button>





<button class="no-delete"
onclick="closeDelete()">



Cancel


</button>




</div>


</div>









<!-- ================= SUCCESS POPUP ================= -->


<div class="success-modal"
id="successBox">


<div class="success-box">


<div class="success-icon">


<i class="fa fa-check"></i>


</div>





<h2 id="successTitle">

Success

</h2>





<p id="successMessage">

Completed Successfully

</p>





<button onclick="closeSuccess()">

OK

</button>




</div>


</div>









<script>



// ===============================
// API URL
// ===============================


const API_URL =

"https://script.google.com/macros/s/AKfycbxRQLGuRc-P8bZ2FE-6ua8B1iPH6IQ1tAffS0erigyv15xQSALef2nrNTSqdMOYHt1fqg/exec";





let currentRow = null;








// ===============================
// LOGIN CHECK
// ===============================


if(localStorage.getItem("isLogin")!="true"){


location.href="index.html";


}








// ===============================
// LOAD LOADING FILE
// ===============================


fetch("loading.html")


.then(res=>res.text())


.then(data=>{


document.getElementById("loadingArea").innerHTML=data;


});









// ===============================
// PROFILE
// ===============================


function toggleProfile(){


document
.getElementById("profileMenu")
.classList.toggle("show");


}




function myAccount(){


window.location.href="myaccount.html";


}





function logout(){


localStorage.clear();


window.location.href="index.html";


}





function goBack(){


window.location.href="dashboard.html";


}







// USER INFO


document.addEventListener("DOMContentLoaded",()=>{


let name =
localStorage.getItem("username");



if(name){

document.getElementById("username").innerHTML=name;

}



let img =
localStorage.getItem("picture");



if(img){

document.getElementById("profileImg").src=img;

}



loadSupport();



});









// ===============================
// LOAD SUPPORT
// ===============================


function loadSupport(){


showLoading("Loading Support...");



fetch(API_URL,{

method:"POST",

headers:{


"Content-Type":

"text/plain;charset=utf-8"


},


body:JSON.stringify({


action:"getPendingSupport"


})


})



.then(res=>res.json())


.then(data=>{



console.log(data);



let html="";




if(data.success){



data.data.forEach(item=>{



html+=`


<tr>


<td>${item.customerId}</td>


<td>${item.problem}</td>


<td>${item.reference}</td>


<td>${item.date}</td>


<td>


<button class="edit-btn"

onclick="editSupport(${item.row})">


<i class="fa fa-edit"></i>

Edit


</button>


</td>


</tr>



`;



});



document.getElementById("supportList").innerHTML=html;



}



else{


showSuccess(

"Error",

data.message

);



}



hideLoading();



})



.catch(error=>{


console.log(error);


hideLoading();


showSuccess(

"Server Error",

"Data Load Failed"

);



});



}









// ===============================
// EDIT LOAD
// ===============================


function editSupport(row){



currentRow=row;



showLoading("Loading Data...");



fetch(API_URL,{

method:"POST",

headers:{


"Content-Type":

"text/plain;charset=utf-8"


},


body:JSON.stringify({


action:"getSingleSupport",


row:row



})


})



.then(res=>res.json())


.then(data=>{



document.getElementById("customerId").value=data.customerId || "";

document.getElementById("problem").value=data.problem || "";

document.getElementById("reference").value=data.reference || "";

document.getElementById("supportDate").value=data.date || "";

document.getElementById("support").value=data.support || "";

document.getElementById("supportWork").value=data.supportWork || "";

document.getElementById("supportTime").value=data.supportTime || "";





hideLoading();



document
.getElementById("editModal")
.classList.add("show");



});



}






function closeEdit(){


document
.getElementById("editModal")
.classList.remove("show");


}
  <script>


// ===============================
// UPDATE SUPPORT
// ===============================


function updateSupport(){


showLoading("Updating Support...");



fetch(API_URL,{

method:"POST",

headers:{


"Content-Type":

"text/plain;charset=utf-8"


},


body:JSON.stringify({


action:"updateSupport",


row:currentRow,


customerId:
document.getElementById("customerId").value,


problem:
document.getElementById("problem").value,


reference:
document.getElementById("reference").value,


date:
document.getElementById("supportDate").value,


support:
document.getElementById("support").value,


supportWork:
document.getElementById("supportWork").value,


supportTime:
document.getElementById("supportTime").value



})


})



.then(res=>res.json())


.then(data=>{



hideLoading();



if(data.success){



closeEdit();



showSuccess(

"Updated",

"Support Updated Successfully"

);



loadSupport();



}

else{


showSuccess(

"Error",

data.message

);



}



})



.catch(error=>{


console.log(error);


hideLoading();



showSuccess(

"Error",

"Update Failed"

);



});



}









// ===============================
// DELETE POPUP OPEN
// ===============================


function openDelete(){


document
.getElementById("deleteBox")
.style.display="flex";


}









// ===============================
// DELETE POPUP CLOSE
// ===============================


function closeDelete(){


document
.getElementById("deleteBox")
.style.display="none";


}









// ===============================
// DELETE SUPPORT
// ===============================


function deleteSupport(){



showLoading("Deleting...");



fetch(API_URL,{

method:"POST",

headers:{


"Content-Type":

"text/plain;charset=utf-8"


},


body:JSON.stringify({


action:"deleteSupport",


row:currentRow



})


})



.then(res=>res.json())


.then(data=>{



hideLoading();



closeDelete();



if(data.success){



closeEdit();



showSuccess(

"Deleted",

"Support Deleted Successfully"

);



loadSupport();



}

else{


showSuccess(

"Error",

data.message

);



}



})



.catch(error=>{


console.log(error);


hideLoading();



showSuccess(

"Error",

"Delete Failed"

);



});



}









// ===============================
// SUCCESS POPUP
// ===============================


function showSuccess(title,message){



document.getElementById("successTitle")
.innerHTML=title;



document.getElementById("successMessage")
.innerHTML=message;



document.getElementById("successBox")
.style.display="flex";


}







function closeSuccess(){


document
.getElementById("successBox")
.style.display="none";


}









// ===============================
// LOADING SYSTEM
// ===============================


let loadingTimer;




function showLoading(text="Loading..."){



let box=
document.getElementById("loadingBox");



if(!box){


console.log("Loading file not loaded");

return;


}




box.style.display="block";



let title=
document.getElementById("loadingText");



if(title){

title.innerHTML=text;

}




let percent=
document.getElementById("percent");


let bar=
document.getElementById("progressBar");



let count=0;



clearInterval(loadingTimer);



loadingTimer=setInterval(()=>{



if(count<100){


count++;



if(percent){

percent.innerHTML=count+"%";

}



if(bar){

bar.style.width=count+"%";

}



}


},25);



}









function hideLoading(){



clearInterval(loadingTimer);



let box=
document.getElementById("loadingBox");



let percent=
document.getElementById("percent");


let bar=
document.getElementById("progressBar");



if(percent){

percent.innerHTML="100%";

}



if(bar){

bar.style.width="100%";

}




setTimeout(()=>{


if(box){

box.style.display="none";

}


},400);



}






</script>



</body>

</html>
