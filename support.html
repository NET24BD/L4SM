<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pending Support</title>


<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">


<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}


body{

background:#f1f5f9;
padding:20px;

}



.header{

background:white;
padding:18px 25px;
border-radius:15px;

display:flex;
justify-content:space-between;
align-items:center;

box-shadow:0 5px 20px rgba(0,0,0,.1);

}



.left{

display:flex;
align-items:center;
gap:15px;

}



.back{

background:#03543f;
color:white;
border:0;
padding:10px 15px;
border-radius:8px;
cursor:pointer;

}





/* PROFILE */

.profile{

position:relative;
display:flex;
align-items:center;
gap:10px;
cursor:pointer;

}


.profile img{

width:45px;
height:45px;
border-radius:50%;
object-fit:cover;

}



.profile-menu{

display:none;

position:absolute;

right:0;

top:55px;

background:white;

width:180px;

padding:10px;

border-radius:10px;

box-shadow:0 5px 20px #999;

z-index:10;

}



.profile-menu.show{

display:block;

}



.profile-menu button{

width:100%;

padding:12px;

border:0;

background:white;

cursor:pointer;

text-align:left;

}




/* TABLE */


.table-box{

margin-top:25px;

background:white;

padding:20px;

border-radius:15px;

overflow:auto;

}



table{

width:100%;

border-collapse:collapse;

}



th{

background:#03543f;

color:white;

padding:12px;

}



td{

padding:12px;

text-align:center;

border-bottom:1px solid #ddd;

}




.edit{

background:#03543f;

color:white;

border:0;

padding:8px 15px;

border-radius:8px;

cursor:pointer;

}






/* POPUP */


.modal{

display:none;

position:fixed;

left:0;

top:0;

width:100%;

height:100%;

background:rgba(0,0,0,.5);

justify-content:center;

align-items:center;

}



.modal.show{

display:flex;

}



.box{

background:white;

width:420px;

padding:25px;

border-radius:15px;

max-height:90vh;

overflow:auto;

}



.box h2{

color:#03543f;

margin-bottom:15px;

}



label{

display:block;

margin-top:10px;

}



input,
textarea{

width:100%;

padding:10px;

margin-top:5px;

border:1px solid #ccc;

border-radius:8px;

}



textarea{

height:80px;

}



.btns{

margin-top:15px;

}



.save{

background:#03543f;

color:white;

border:0;

padding:10px 20px;

border-radius:8px;

cursor:pointer;

}



.close{

background:red;

color:white;

border:0;

padding:10px 20px;

border-radius:8px;

cursor:pointer;

}


</style>

</head>


<body>



<div class="header">


<div class="left">


<button class="back"
onclick="location.href='dashboard.html'">

<i class="fa fa-arrow-left"></i>
Back

</button>


<h2>
<i class="fa fa-headset"></i>
Pending Support
</h2>


</div>





<div class="profile"
onclick="profileMenu()">



<img id="profileImg"
src="assets/profile.png">


<span id="userName">

User

</span>



<i class="fa fa-angle-down"></i>



<div class="profile-menu"
id="menu"
onclick="event.stopPropagation()">



<button onclick="location.href='myaccount.html'">

<i class="fa fa-user"></i>
My Account

</button>


<button onclick="logout()">

<i class="fa fa-right-from-bracket"></i>
Logout

</button>



</div>



</div>


</div>








<div class="table-box">


<table>


<thead>

<tr>

<th>Customer ID</th>

<th>Problem</th>

<th>Reference</th>

<th>Date</th>

<th>Action</th>

</tr>


</thead>



<tbody id="list">


</tbody>


</table>


</div>








<!-- EDIT BOX -->


<div class="modal"
id="modal">


<div class="box">


<h2>
Edit Support
</h2>


<input type="hidden" id="row">



<label>
Customer ID
</label>

<input id="customerId">



<label>
Problem
</label>

<textarea id="problem"></textarea>



<label>
Reference
</label>

<input id="reference">



<label>
Date
</label>

<input type="date" id="date">



<label>
Support
</label>

<input id="support">



<label>
Support Work
</label>

<textarea id="supportWork"></textarea>




<div class="btns">

<button class="save"
onclick="update()">

Save

</button>


<button class="close"
onclick="closeBox()">

Close

</button>


</div>


</div>


</div>









<script>


const API_URL =
"https://script.google.com/macros/s/AKfycbxRQLGuRc-P8bZ2FE-6ua8B1iPH6IQ1tAffS0erigyv15xQSALef2nrNTSqdMOYHt1fqg/exec";




// LOAD


function load(){


fetch(API_URL,{

method:"POST",

body:JSON.stringify({

action:"getPendingSupport"

})

})


.then(r=>r.json())

.then(data=>{


let html="";


data.data.forEach(x=>{


html+=`

<tr>

<td>${x.customerId}</td>

<td>${x.problem}</td>

<td>${x.reference}</td>

<td>${x.date}</td>


<td>

<button class="edit"
onclick="edit(${x.row})">

Edit

</button>


</td>


</tr>

`;



});


document.getElementById("list").innerHTML=html;



});


}








function edit(row){



fetch(API_URL,{

method:"POST",

body:JSON.stringify({

action:"getSingleSupport",

row:row

})

})


.then(r=>r.json())

.then(d=>{


document.getElementById("row").value=row;

customerId.value=d.customerId;

problem.value=d.problem;

reference.value=d.reference;

date.value=d.date;

support.value=d.support;

supportWork.value=d.supportWork;



document.getElementById("modal")
.classList.add("show");


});


}







function update(){


fetch(API_URL,{

method:"POST",

body:JSON.stringify({

action:"updateSupport",

row:row.value,

customerId:customerId.value,

problem:problem.value,

reference:reference.value,

date:date.value,

support:support.value,

supportWork:supportWork.value


})

})


.then(r=>r.json())

.then(()=>{


alert("Updated");

closeBox();

load();


});


}







function closeBox(){

document.getElementById("modal")
.classList.remove("show");

}





// PROFILE


function profileMenu(){

document.getElementById("menu")
.classList.toggle("show");

}



userName.innerText =
localStorage.getItem("username") || "User";


if(localStorage.getItem("picture")){

profileImg.src =
localStorage.getItem("picture");

}



function logout(){

localStorage.clear();

location.href="index.html";

}




load();


</script>


</body>

</html>
