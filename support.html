<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pending Support</title>


<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">



<style>


*{

margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;

}



body{

background:#f1f5f9;

padding:20px;

}



/* ================= HEADER ================= */


.header{

background:white;

padding:18px 25px;

border-radius:15px;

display:flex;

justify-content:space-between;

align-items:center;

box-shadow:0 5px 20px rgba(0,0,0,.1);

}



.left{

display:flex;

align-items:center;

gap:15px;

}



.back{

background:#03543f;

color:white;

border:none;

padding:10px 15px;

border-radius:8px;

cursor:pointer;

}



.back:hover{

opacity:.8;

}





/* ================= PROFILE ================= */


.profile{

display:flex;

align-items:center;

gap:10px;

position:relative;

cursor:pointer;

}



.profile img{

width:45px;

height:45px;

border-radius:50%;

object-fit:cover;

}



.profile-menu{

display:none;

position:absolute;

right:0;

top:60px;

background:white;

width:180px;

padding:10px;

border-radius:12px;

box-shadow:0 5px 20px #999;

z-index:100;

}



.profile-menu.show{

display:block;

}



.profile-menu button{

width:100%;

padding:12px;

border:none;

background:white;

cursor:pointer;

text-align:left;

border-radius:8px;

}



.profile-menu button:hover{

background:#eee;

}





/* ================= TABLE ================= */


.table-box{

margin-top:25px;

background:white;

padding:20px;

border-radius:15px;

overflow:auto;

}



table{

width:100%;

border-collapse:collapse;

}



th{

background:#03543f;

color:white;

padding:12px;

}



td{

padding:12px;

text-align:center;

border-bottom:1px solid #ddd;

}



.edit-btn{

background:#03543f;

color:white;

border:none;

padding:8px 15px;

border-radius:8px;

cursor:pointer;

}





/* ================= EDIT POPUP ================= */


.modal{

display:none;

position:fixed;

top:0;

left:0;

width:100%;

height:100%;


background:rgba(0,0,0,.5);


justify-content:center;

align-items:center;

z-index:500;


}



.modal.show{

display:flex;

}



.box{

background:white;

width:420px;

padding:25px;

border-radius:15px;

max-height:90vh;

overflow:auto;

}



.box h2{

color:#03543f;

margin-bottom:15px;

}



label{

display:block;

margin-top:10px;

font-weight:bold;

}



input,
textarea{

width:100%;

padding:10px;

margin-top:5px;

border:1px solid #ccc;

border-radius:8px;

}



textarea{

height:80px;

resize:none;

}




.btns{

margin-top:20px;

display:flex;

gap:10px;

}



.submit{

background:#03543f;

color:white;

border:none;

padding:10px 18px;

border-radius:8px;

cursor:pointer;

}



.cancel{

background:#64748b;

color:white;

border:none;

padding:10px 18px;

border-radius:8px;

cursor:pointer;

}



.delete{

background:#dc2626;

color:white;

border:none;

padding:10px 18px;

border-radius:8px;

cursor:pointer;

}








/* ================= CUSTOM DELETE POPUP ================= */


.confirm-box{

display:none;

position:fixed;

top:0;

left:0;

width:100%;

height:100%;


background:rgba(0,0,0,.5);


justify-content:center;

align-items:center;


z-index:1000;


}



.confirm-content{

background:white;

width:320px;

padding:25px;

border-radius:15px;

text-align:center;

}



.confirm-content h3{

color:#dc2626;

margin-bottom:10px;

}



.confirm-content p{

margin-bottom:20px;

}




.confirm-content button{

padding:10px 18px;

border:none;

border-radius:8px;

cursor:pointer;

margin:5px;

}



.yes-delete{

background:#dc2626;

color:white;

}



.no-delete{

background:#64748b;

color:white;

}





/* ================= LOADING ================= */


#loadingPage{

position:fixed;

top:0;

left:0;

width:100%;

height:100%;

z-index:2000;

display:none;

}



#loadingPage iframe{

width:100%;

height:100%;

border:none;

}



</style>


</head>



<body>



<!-- LOADING -->

<div id="loadingPage"></div>





<!-- HEADER -->


<div class="header">



<div class="left">


<button class="back"
onclick="location.href='dashboard.html'">


<i class="fa-solid fa-arrow-left"></i>

Back


</button>



<h2>

<i class="fa-solid fa-headset"></i>

Pending Support

</h2>


</div>







<!-- PROFILE -->


<div class="profile"
onclick="toggleProfile()">



<img id="profileImg"
src="assets/profile.png">



<span id="username">

User

</span>


<i class="fa-solid fa-angle-down"></i>




<div class="profile-menu"
id="profileMenu"
onclick="event.stopPropagation()">



<button onclick="myAccount()">

<i class="fa-solid fa-user"></i>

My Account

</button>



<button onclick="logout()">

<i class="fa-solid fa-right-from-bracket"></i>

Logout

</button>



</div>



</div>



</div>









<!-- SUPPORT TABLE -->


<div class="table-box">


<table>


<thead>

<tr>

<th>Customer ID</th>

<th>Problem</th>

<th>Reference</th>

<th>Date</th>

<th>Action</th>


</tr>


</thead>


<tbody id="supportList">


</tbody>


</table>


</div>









<!-- EDIT POPUP -->


<div class="modal"
id="editModal">


<div class="box">


<h2>
Edit Support
</h2>



<input type="hidden" id="editRow">



<label>
Customer ID
</label>

<input id="customerId">





<label>
Problem
</label>

<textarea id="problem"></textarea>





<label>
Reference
</label>

<input id="reference">





<label>
Date
</label>

<input type="date" id="date">





<label>
Support
</label>

<input id="support">





<label>
Support Work
</label>

<textarea id="supportWork"></textarea>






<div class="btns">


<button class="submit"
onclick="updateSupport()">

Submit

</button>


<button class="cancel"
onclick="closeEdit()">

Cancel

</button>


<button class="delete"
onclick="openDelete()">

Delete

</button>



</div>


</div>


</div>









<!-- DELETE CONFIRM POPUP -->


<div class="confirm-box"
id="confirmBox">


<div class="confirm-content">


<h3>
Delete Support?
</h3>


<p>
Are you sure you want to delete this entry?
</p>


<button class="yes-delete"
onclick="confirmDelete()">

Yes Delete

</button>


<button class="no-delete"
onclick="closeDelete()">

Cancel

</button>



</div>


</div>
<script>


const API_URL =
"https://script.google.com/macros/s/AKfycbxRQLGuRc-P8bZ2FE-6ua8B1iPH6IQ1tAffS0erigyv15xQSALef2nrNTSqdMOYHt1fqg/exec";



let currentRow = "";




// ===============================
// LOADING
// ===============================


function showLoading(){


document.getElementById("loadingPage").style.display="block";


document.getElementById("loadingPage").innerHTML = `

<iframe src="loading.html"></iframe>

`;


}



function hideLoading(){


document.getElementById("loadingPage").style.display="none";


document.getElementById("loadingPage").innerHTML="";


}








// ===============================
// LOAD SUPPORT
// ===============================


function loadSupport(){


showLoading();



fetch(API_URL,{

method:"POST",

body:JSON.stringify({

action:"getPendingSupport"

})

})


.then(res=>res.json())


.then(data=>{


let html="";



if(data.data){


data.data.forEach(item=>{


html += `

<tr>


<td>${item.customerId}</td>


<td>${item.problem}</td>


<td>${item.reference}</td>


<td>${item.date}</td>


<td>

<button class="edit-btn"

onclick="editSupport(${item.row})">

Edit

</button>


</td>


</tr>


`;


});


}




document.getElementById("supportList").innerHTML=html;



hideLoading();



})


.catch(error=>{


console.log(error);


hideLoading();


alert("Server Error");


});


}









// ===============================
// EDIT OPEN
// ===============================


function editSupport(row){


currentRow=row;


showLoading();



fetch(API_URL,{

method:"POST",

body:JSON.stringify({

action:"getSingleSupport",

row:row

})

})


.then(res=>res.json())


.then(data=>{



document.getElementById("editRow").value=row;



document.getElementById("customerId").value =
data.customerId || "";



document.getElementById("problem").value =
data.problem || "";



document.getElementById("reference").value =
data.reference || "";



document.getElementById("date").value =
data.date || "";



document.getElementById("support").value =
data.support || "";



document.getElementById("supportWork").value =
data.supportWork || "";





document
.getElementById("editModal")
.classList.add("show");



hideLoading();



});


}









// ===============================
// UPDATE
// ===============================


function updateSupport(){


showLoading();



fetch(API_URL,{

method:"POST",

body:JSON.stringify({

action:"updateSupport",


row:currentRow,


customerId:
document.getElementById("customerId").value,


problem:
document.getElementById("problem").value,


reference:
document.getElementById("reference").value,


date:
document.getElementById("date").value,


support:
document.getElementById("support").value,


supportWork:
document.getElementById("supportWork").value



})

})


.then(res=>res.json())


.then(data=>{


hideLoading();



alert("Updated Successfully");


closeEdit();


loadSupport();



})


.catch(error=>{


hideLoading();


alert("Update Error");


});


}









// ===============================
// CLOSE EDIT
// ===============================


function closeEdit(){


document
.getElementById("editModal")
.classList.remove("show");


}









// ===============================
// DELETE POPUP
// ===============================


function openDelete(){


document
.getElementById("confirmBox")
.style.display="flex";


}



function closeDelete(){


document
.getElementById("confirmBox")
.style.display="none";


}








// ===============================
// DELETE CONFIRM
// ===============================


function confirmDelete(){



showLoading();



fetch(API_URL,{

method:"POST",

body:JSON.stringify({

action:"deleteSupport",

row:currentRow


})

})


.then(res=>res.json())


.then(data=>{


hideLoading();


closeDelete();


closeEdit();



alert("Deleted Successfully");


loadSupport();



})


.catch(error=>{


hideLoading();


alert("Delete Error");


});


}









// ===============================
// PROFILE
// ===============================



function toggleProfile(){


document
.getElementById("profileMenu")
.classList.toggle("show");


}




document.getElementById("username").innerText =

localStorage.getItem("username") || "User";




let img =
localStorage.getItem("picture");



if(img){


document.getElementById("profileImg").src=img;


}







function myAccount(){


location.href="myaccount.html";


}





function logout(){


localStorage.clear();


location.href="index.html";


}









// START


loadSupport();



</script>


</body>

</html>
