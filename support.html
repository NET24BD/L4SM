<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pending Support</title>


<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">



<style>


*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}


body{

background:linear-gradient(135deg,#ecfdf5,#f1f5f9);

padding:20px;

}



/* HEADER */

.header{

background:white;

padding:18px 25px;

border-radius:18px;

display:flex;

justify-content:space-between;

align-items:center;

box-shadow:0 10px 30px rgba(0,0,0,.12);

}



.left{

display:flex;

align-items:center;

gap:15px;

}


.back{

background:linear-gradient(135deg,#065f46,#10b981);

color:white;

border:none;

padding:10px 18px;

border-radius:10px;

cursor:pointer;

font-weight:bold;

}



.back:hover{

transform:scale(1.05);

}






/* PROFILE */


.profile{

display:flex;

align-items:center;

gap:10px;

position:relative;

cursor:pointer;

}



.profile img{

width:48px;

height:48px;

border-radius:50%;

object-fit:cover;

border:3px solid #10b981;

}




.profile-menu{

display:none;

position:absolute;

right:0;

top:60px;

background:white;

width:190px;

padding:10px;

border-radius:15px;

box-shadow:0 10px 30px rgba(0,0,0,.2);

z-index:100;

}



.profile-menu.show{

display:block;

}



.profile-menu button{

width:100%;

padding:12px;

border:none;

background:white;

cursor:pointer;

border-radius:10px;

text-align:left;

}



.profile-menu button:hover{

background:#ecfdf5;

}







/* TABLE */


.table-box{

margin-top:25px;

background:white;

padding:20px;

border-radius:18px;

box-shadow:0 10px 30px rgba(0,0,0,.1);

overflow:auto;

}



table{

width:100%;

border-collapse:collapse;

}



th{

background:linear-gradient(135deg,#065f46,#10b981);

color:white;

padding:14px;

}



td{

padding:12px;

text-align:center;

border-bottom:1px solid #ddd;

}



tr:hover td{

background:#ecfdf5;

}



.edit-btn{

background:#2563eb;

color:white;

border:none;

padding:8px 18px;

border-radius:8px;

cursor:pointer;

}





/* LOADING */

#loadingPage{

display:none;

position:fixed;

top:0;

left:0;

width:100%;

height:100%;

background:rgba(0,0,0,.35);

z-index:5000;

}



#loadingPage iframe{

width:100%;

height:100%;

border:none;

}









/* EDIT POPUP */


.modal{

display:none;

position:fixed;

top:0;

left:0;

width:100%;

height:100%;

background:rgba(0,0,0,.45);

justify-content:center;

align-items:center;

z-index:2000;

}



.modal.show{

display:flex;

}




.box{

position:relative;

background:white;

width:430px;

padding:30px;

border-radius:22px;

box-shadow:0 20px 60px rgba(0,0,0,.3);

max-height:90vh;

overflow:auto;

}





.close-icon{

position:absolute;

right:15px;

top:15px;

width:35px;

height:35px;

border:none;

border-radius:50%;

background:#ef4444;

color:white;

font-size:20px;

cursor:pointer;

}



.close-icon:hover{

transform:rotate(90deg);

}




.box h2{

color:#065f46;

margin-bottom:15px;

}



label{

display:block;

margin-top:10px;

font-weight:bold;

color:#334155;

}



input,
textarea{

width:100%;

padding:11px;

margin-top:5px;

border:1px solid #cbd5e1;

border-radius:10px;

outline:none;

}



input:focus,
textarea:focus{

border-color:#10b981;

box-shadow:0 0 8px #a7f3d0;

}



textarea{

height:80px;

resize:none;

}





.btns{

margin-top:20px;

display:flex;

gap:10px;

}



.submit{

background:#10b981;

color:white;

}



.cancel{

background:#64748b;

color:white;

}



.delete{

background:#ef4444;

color:white;

}



.btns button{

border:none;

padding:11px 18px;

border-radius:10px;

cursor:pointer;

font-weight:bold;

}









/* DELETE POPUP */


.confirm-box{

display:none;

position:fixed;

top:0;

left:0;

width:100%;

height:100%;

background:rgba(0,0,0,.45);

justify-content:center;

align-items:center;

z-index:6000;

}



.confirm-content{

background:white;

width:330px;

padding:30px;

border-radius:20px;

text-align:center;

box-shadow:0 20px 50px rgba(0,0,0,.3);

}



.confirm-content h3{

color:#dc2626;

margin-bottom:10px;

}



.confirm-content button{

margin:8px;

padding:10px 18px;

border:none;

border-radius:10px;

cursor:pointer;

}



.yes-delete{

background:#dc2626;

color:white;

}



.no-delete{

background:#64748b;

color:white;

}








/* SUCCESS POPUP */


.success-box{

display:none;

position:fixed;

top:0;

left:0;

width:100%;

height:100%;

background:rgba(0,0,0,.45);

justify-content:center;

align-items:center;

z-index:7000;

}



.success-content{

background:white;

width:340px;

padding:30px;

border-radius:22px;

text-align:center;

box-shadow:0 20px 60px rgba(0,0,0,.3);

}



.success-icon{

width:70px;

height:70px;

background:#10b981;

color:white;

border-radius:50%;

display:flex;

justify-content:center;

align-items:center;

font-size:35px;

margin:auto;

}



.success-content h3{

color:#10b981;

margin:15px;

}



.success-content button{

background:#10b981;

color:white;

border:none;

padding:10px 35px;

border-radius:10px;

cursor:pointer;

}



</style>

</head>


<body>



<div id="loadingPage"></div>



<div class="header">


<div class="left">


<button class="back"
onclick="location.href='dashboard.html'">

<i class="fa fa-arrow-left"></i>

Back

</button>


<h2>

<i class="fa fa-headset"></i>

Pending Support

</h2>


</div>





<div class="profile"
onclick="toggleProfile()">



<img id="profileImg"
src="assets/profile.png">



<span id="username">
User
</span>



<i class="fa fa-angle-down"></i>





<div class="profile-menu"
id="profileMenu"
onclick="event.stopPropagation()">



<button onclick="myAccount()">

<i class="fa fa-user"></i>

My Account

</button>



<button onclick="logout()">

<i class="fa fa-right-from-bracket"></i>

Logout

</button>



</div>


</div>



</div>
<!-- SUPPORT TABLE BODY -->

<tbody id="supportList">

</tbody>

</table>

</div>





<!-- EDIT POPUP -->


<div class="modal" id="editModal">


<div class="box">


<button class="close-icon"
onclick="closeEdit()">

<i class="fa-solid fa-xmark"></i>

</button>



<h2>

<i class="fa-solid fa-pen-to-square"></i>

Edit Support

</h2>




<input type="hidden" id="editRow">



<label>Customer ID</label>

<input id="customerId">



<label>Problem</label>

<textarea id="problem"></textarea>




<label>Reference</label>

<input id="reference">




<label>Date</label>

<input type="date" id="date">



<label>Support</label>

<input id="support">



<label>Support Work</label>

<textarea id="supportWork"></textarea>





<div class="btns">


<button class="submit"
onclick="updateSupport()">

Submit

</button>



<button class="cancel"
onclick="closeEdit()">

Cancel

</button>



<button class="delete"
onclick="openDelete()">

Delete

</button>



</div>



</div>


</div>










<!-- DELETE CONFIRM -->


<div class="confirm-box"
id="confirmBox">


<div class="confirm-content">


<h3>

Delete Support?

</h3>


<p>

Are you sure you want to delete this entry?

</p>



<button class="yes-delete"
onclick="confirmDelete()">

Yes Delete

</button>


<button class="no-delete"
onclick="closeDelete()">

Cancel

</button>


</div>

</div>








<!-- SUCCESS POPUP -->


<div class="success-box"
id="successBox">


<div class="success-content">



<div class="success-icon">

<i class="fa-solid fa-check"></i>

</div>



<h3 id="successTitle">

Success

</h3>


<p id="successMessage">

Completed Successfully

</p>




<button onclick="closeSuccess()">

OK

</button>



</div>


</div>









<script>


const API_URL =
"https://script.google.com/macros/s/AKfycbxRQLGuRc-P8bZ2FE-6ua8B1iPH6IQ1tAffS0erigyv15xQSALef2nrNTSqdMOYHt1fqg/exec";



let currentRow="";








// ==========================
// LOADING
// ==========================


function showLoading(){


document.getElementById("loadingPage").style.display="block";


document.getElementById("loadingPage").innerHTML=

`

<iframe src="loading.html"></iframe>

`;


}




function hideLoading(){


document.getElementById("loadingPage").style.display="none";


document.getElementById("loadingPage").innerHTML="";


}










// ==========================
// LOAD SUPPORT
// ==========================


function loadSupport(){


showLoading();



fetch(API_URL,{

method:"POST",

body:JSON.stringify({

action:"getPendingSupport"

})


})


.then(res=>res.json())


.then(data=>{


let html="";



data.data.forEach(item=>{


html += `


<tr>


<td>${item.customerId}</td>


<td>${item.problem}</td>


<td>${item.reference}</td>


<td>${item.date}</td>



<td>


<button class="edit-btn"

onclick="editSupport(${item.row})">


<i class="fa fa-pen"></i>

Edit


</button>


</td>



</tr>


`;



});




document.getElementById("supportList").innerHTML=html;



hideLoading();



})


.catch(()=>{


hideLoading();


showSuccess(
"Error",
"Server Connection Error"
);


});



}









// ==========================
// EDIT
// ==========================


function editSupport(row){



currentRow=row;


showLoading();



fetch(API_URL,{

method:"POST",

body:JSON.stringify({

action:"getSingleSupport",

row:row


})

})



.then(res=>res.json())


.then(data=>{


customerId.value=data.customerId || "";

problem.value=data.problem || "";

reference.value=data.reference || "";

date.value=data.date || "";

support.value=data.support || "";

supportWork.value=data.supportWork || "";




editModal.classList.add("show");



hideLoading();



});



}










// ==========================
// UPDATE
// ==========================


function updateSupport(){


showLoading();



fetch(API_URL,{

method:"POST",

body:JSON.stringify({

action:"updateSupport",

row:currentRow,

customerId:customerId.value,

problem:problem.value,

reference:reference.value,

date:date.value,

support:support.value,

supportWork:supportWork.value


})


})



.then(res=>res.json())


.then(()=>{


hideLoading();



closeEdit();



showSuccess(
"Updated!",
"Support Updated Successfully"
);



loadSupport();



});


}









// ==========================
// DELETE
// ==========================


function openDelete(){


confirmBox.style.display="flex";


}



function closeDelete(){


confirmBox.style.display="none";


}







function confirmDelete(){


showLoading();



fetch(API_URL,{

method:"POST",

body:JSON.stringify({

action:"deleteSupport",

row:currentRow


})


})


.then(res=>res.json())


.then(()=>{


hideLoading();


closeDelete();


closeEdit();



showSuccess(
"Deleted!",
"Support Deleted Successfully"
);



loadSupport();



});


}









// ==========================
// POPUP CLOSE
// ==========================


function closeEdit(){


editModal.classList.remove("show");


}









// ==========================
// SUCCESS
// ==========================


function showSuccess(title,msg){


successTitle.innerHTML=title;


successMessage.innerHTML=msg;


successBox.style.display="flex";


}



function closeSuccess(){


successBox.style.display="none";


}









// ==========================
// PROFILE
// ==========================


function toggleProfile(){


profileMenu.classList.toggle("show");


}





username.innerHTML =
localStorage.getItem("username") || "User";



if(localStorage.getItem("picture")){


profileImg.src=
localStorage.getItem("picture");


}






function myAccount(){


location.href="myaccount.html";


}



function logout(){


localStorage.clear();


location.href="index.html";


}








// START


loadSupport();



</script>


</body>

</html>
