<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pending Support</title>


<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">


<style>


*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:"Segoe UI",Arial,sans-serif;
}



body{

background:linear-gradient(135deg,#ecfdf5,#eff6ff);

min-height:100vh;

padding:20px;

}




/* ================= HEADER ================= */


.header{

background:white;

border-radius:20px;

padding:15px 20px;

display:flex;

justify-content:space-between;

align-items:center;

box-shadow:0 10px 30px rgba(0,0,0,.15);

}



.header-left{

display:flex;

align-items:center;

gap:15px;

}



.back-btn{

background:#065f46;

color:white;

border:none;

padding:10px 18px;

border-radius:10px;

cursor:pointer;

font-weight:bold;

}



.back-btn:hover{

background:#10b981;

}






/* ================= PROFILE ================= */



.profile{

position:relative;

display:flex;

align-items:center;

gap:10px;

cursor:pointer;

}



.profile img{

width:50px;

height:50px;

border-radius:50%;

border:3px solid #10b981;

object-fit:cover;

}



.username{

font-weight:700;

}



.profile-menu{

display:none;

position:absolute;

right:0;

top:60px;

background:white;

width:200px;

padding:10px;

border-radius:15px;

box-shadow:0 10px 30px rgba(0,0,0,.2);

z-index:1000;

}



.profile-menu.show{

display:block;

}



.profile-menu button{

width:100%;

padding:12px;

border:none;

background:white;

cursor:pointer;

border-radius:10px;

text-align:left;

}



.profile-menu button:hover{

background:#ecfdf5;

}








/* ================= TABLE ================= */



.table-card{

margin-top:25px;

background:white;

padding:20px;

border-radius:20px;

box-shadow:0 10px 30px rgba(0,0,0,.12);

overflow:auto;

}



table{

width:100%;

border-collapse:collapse;

}



th{

background:#065f46;

color:white;

padding:14px;

}



td{

padding:12px;

text-align:center;

border-bottom:1px solid #ddd;

}



tr:hover{

background:#ecfdf5;

}




.edit-btn{

background:#2563eb;

color:white;

border:none;

padding:8px 16px;

border-radius:10px;

cursor:pointer;

}



.edit-btn:hover{

background:#1d4ed8;

}








/* ================= LOADING AREA ================= */


#loadingArea{

position:fixed;

top:0;

left:0;

width:100%;

height:100%;

z-index:9999;

}








/* ================= POPUP COMMON ================= */


.modal{

display:none;

position:fixed;

top:0;

left:0;

width:100%;

height:100%;

background:rgba(0,0,0,.45);

align-items:center;

justify-content:center;

z-index:2000;

}



.modal.show{

display:flex;

}



.popup{

background:white;

width:450px;

max-width:95%;

padding:30px;

border-radius:25px;

position:relative;

box-shadow:0 20px 50px rgba(0,0,0,.3);

}




.close-btn{

position:absolute;

right:15px;

top:15px;

width:35px;

height:35px;

border:none;

border-radius:50%;

background:#ef4444;

color:white;

font-size:18px;

cursor:pointer;

}




.popup h2{

color:#065f46;

margin-bottom:15px;

}




label{

display:block;

margin-top:10px;

font-weight:bold;

}



input,
textarea{


width:100%;

padding:10px;

margin-top:5px;

border:1px solid #cbd5e1;

border-radius:10px;

}



textarea{

height:80px;

resize:none;

}






.popup-buttons{

display:flex;

gap:10px;

margin-top:20px;

}



.popup-buttons button{

padding:11px 18px;

border:none;

border-radius:10px;

cursor:pointer;

font-weight:bold;

}



.save-btn{

background:#10b981;

color:white;

}



.cancel-btn{

background:#64748b;

color:white;

}



.delete-btn{

background:#ef4444;

color:white;

}






/* ================= DELETE POPUP ================= */



.confirm-modal{

display:none;

position:fixed;

top:0;

left:0;

width:100%;

height:100%;

background:rgba(0,0,0,.45);

align-items:center;

justify-content:center;

z-index:3000;

}



.confirm-box{

background:white;

padding:30px;

border-radius:20px;

text-align:center;

}



.confirm-box button{

padding:10px 20px;

border:none;

border-radius:10px;

margin:10px;

cursor:pointer;

}



.yes-btn{

background:#ef4444;

color:white;

}



.no-btn{

background:#64748b;

color:white;

}





/* ================= SUCCESS ================= */



.success-modal{

display:none;

position:fixed;

top:0;

left:0;

width:100%;

height:100%;

background:rgba(0,0,0,.45);

align-items:center;

justify-content:center;

z-index:4000;

}



.success-box{

background:white;

padding:30px;

border-radius:25px;

text-align:center;

}



.success-box i{

font-size:50px;

color:#10b981;

}



.success-box button{

margin-top:15px;

padding:10px 30px;

border:none;

border-radius:10px;

background:#10b981;

color:white;

cursor:pointer;

}



</style>


</head>



<body>



<!-- Loading -->

<div id="loadingArea"></div>






<!-- HEADER -->

<div class="header">



<div class="header-left">


<button class="back-btn"
onclick="goDashboard()">



<i class="fa fa-arrow-left"></i>

Back


</button>



<h2>

<i class="fa fa-headset"></i>

Pending Support

</h2>



</div>








<div class="profile"
onclick="toggleProfile()">



<img id="profileImg"
src="assets/profile.png">



<span class="username"
id="username">

User

</span>



<i class="fa fa-angle-down"></i>





<div class="profile-menu"
id="profileMenu"
onclick="event.stopPropagation()">



<button onclick="myAccount()">

<i class="fa fa-user"></i>

My Account

</button>



<button onclick="logout()">

<i class="fa fa-sign-out"></i>

Logout

</button>



</div>



</div>


</div>








<!-- TABLE -->

<div class="table-card">


<table>


<thead>

<tr>

<th>Customer ID</th>

<th>Problem</th>

<th>Reference</th>

<th>Date</th>

<th>Action</th>


</tr>


</thead>



<tbody id="supportList">


</tbody>



</table>


</div>
<!-- ================= EDIT POPUP ================= -->


<div class="modal" id="editModal">


<div class="popup">



<button class="close-btn"
onclick="closeEdit()">

<i class="fa fa-xmark"></i>

</button>





<h2>

<i class="fa fa-pen"></i>

Edit Support

</h2>





<input type="hidden" id="editRow">





<label>Customer ID</label>

<input id="customerId">





<label>Problem</label>

<textarea id="problem"></textarea>







<label>Reference</label>

<input id="reference">






<label>Date</label>

<input type="date" id="supportDate">





<label>Support</label>

<input id="support">






<label>Support Work</label>

<textarea id="supportWork"></textarea>






<label>Support Time</label>

<input id="supportTime">







<div class="popup-buttons">


<button class="save-btn"
onclick="updateSupport()">


<i class="fa fa-check"></i>

Submit


</button>





<button class="cancel-btn"
onclick="closeEdit()">


Cancel


</button>





<button class="delete-btn"
onclick="openDelete()">



<i class="fa fa-trash"></i>

Delete


</button>




</div>





</div>


</div>










<!-- ================= DELETE ================= -->


<div class="confirm-modal"
id="deleteBox">


<div class="confirm-box">


<h3>

Delete Support?

</h3>


<p>

Are you sure?

</p>



<button class="yes-btn"
onclick="deleteSupport()">


Yes Delete


</button>



<button class="no-btn"
onclick="closeDelete()">


Cancel


</button>



</div>


</div>









<!-- ================= SUCCESS ================= -->


<div class="success-modal"
id="successBox">


<div class="success-box">


<i class="fa fa-circle-check"></i>


<h3 id="successTitle">

Success

</h3>


<p id="successMessage">

Done

</p>



<button onclick="closeSuccess()">

OK

</button>



</div>


</div>









<script>


// ===============================
// API
// ===============================


const API_URL =

"https://script.google.com/macros/s/AKfycbxRQLGuRc-P8bZ2FE-6ua8B1iPH6IQ1tAffS0erigyv15xQSALef2nrNTSqdMOYHt1fqg/exec";



let currentRow=null;






// ===============================
// LOGIN CHECK
// ===============================


if(localStorage.getItem("isLogin")!="true"){


window.location.href="index.html";


}









// ===============================
// LOADING LOAD
// ===============================


fetch("loading.html")

.then(res=>res.text())

.then(data=>{


document.getElementById("loadingArea").innerHTML=data;


});









// ===============================
// PROFILE
// ===============================


function toggleProfile(){


document
.getElementById("profileMenu")
.classList.toggle("show");


}





function myAccount(){


window.location.href="myaccount.html";


}



function logout(){


localStorage.clear();


window.location.href="index.html";


}



function goDashboard(){


window.location.href="dashboard.html";


}








// USER INFO


window.onload=function(){



let user=
localStorage.getItem("username");



if(user){

document.getElementById("username").innerHTML=user;

}



let pic=
localStorage.getItem("picture");



if(pic){

document.getElementById("profileImg").src=pic;

}



loadSupport();



};









// ===============================
// LOAD SUPPORT DATA
// ===============================


function loadSupport(){


showLoading("Loading Support...");



fetch(API_URL,{

method:"POST",

headers:{

"Content-Type":

"text/plain;charset=utf-8"

},


body:JSON.stringify({


action:"getPendingSupport"


})


})



.then(res=>res.json())


.then(data=>{



let html="";



if(data.success){



data.data.forEach(item=>{



html+=`

<tr>


<td>${item.customerId}</td>


<td>${item.problem}</td>


<td>${item.reference}</td>


<td>${item.date}</td>



<td>


<button class="edit-btn"

onclick="editSupport(${item.row})">


<i class="fa fa-edit"></i>

Edit


</button>



</td>


</tr>

`;



});



document.getElementById("supportList").innerHTML=html;



}

else{


showSuccess(
"Error",
data.message
);


}



hideLoading();



})


.catch(error=>{


console.log(error);


hideLoading();


showSuccess(

"Server Error",

"Data Load Failed"

);



});



}










// ===============================
// EDIT LOAD
// ===============================


function editSupport(row){



currentRow=row;



showLoading("Loading Data...");



fetch(API_URL,{

method:"POST",


headers:{


"Content-Type":

"text/plain;charset=utf-8"


},


body:JSON.stringify({


action:"getSingleSupport",


row:row


})


})



.then(res=>res.json())


.then(data=>{



document.getElementById("customerId").value=data.customerId || "";

document.getElementById("problem").value=data.problem || "";

document.getElementById("reference").value=data.reference || "";

document.getElementById("supportDate").value=data.date || "";

document.getElementById("support").value=data.support || "";

document.getElementById("supportWork").value=data.supportWork || "";

document.getElementById("supportTime").value=data.supportTime || "";



hideLoading();



document
.getElementById("editModal")
.classList.add("show");



});


}






function closeEdit(){


document
.getElementById("editModal")
.classList.remove("show");


}
<script>


// ===============================
// UPDATE SUPPORT
// ===============================


function updateSupport(){


showLoading("Updating...");



fetch(API_URL,{

method:"POST",

headers:{

"Content-Type":

"text/plain;charset=utf-8"

},


body:JSON.stringify({


action:"updateSupport",


row:currentRow,


customerId:
document.getElementById("customerId").value,


problem:
document.getElementById("problem").value,


reference:
document.getElementById("reference").value,


date:
document.getElementById("supportDate").value,


support:
document.getElementById("support").value,


supportWork:
document.getElementById("supportWork").value,


supportTime:
document.getElementById("supportTime").value



})


})



.then(res=>res.json())


.then(data=>{



hideLoading();



if(data.success){


closeEdit();



showSuccess(

"Success",

"Support Updated Successfully"

);



loadSupport();



}

else{


showSuccess(

"Error",

data.message || "Update Failed"

);


}



})



.catch(error=>{


console.log(error);


hideLoading();


showSuccess(

"Error",

"Server Error"

);



});



}









// ===============================
// DELETE OPEN
// ===============================


function openDelete(){


document
.getElementById("deleteBox")
.style.display="flex";


}







// ===============================
// DELETE CLOSE
// ===============================


function closeDelete(){


document
.getElementById("deleteBox")
.style.display="none";


}









// ===============================
// DELETE SUPPORT
// ===============================


function deleteSupport(){



showLoading("Deleting...");



fetch(API_URL,{

method:"POST",

headers:{

"Content-Type":

"text/plain;charset=utf-8"

},


body:JSON.stringify({


action:"deleteSupport",


row:currentRow



})


})



.then(res=>res.json())


.then(data=>{



hideLoading();



closeDelete();



if(data.success){



closeEdit();



showSuccess(

"Deleted",

"Support Deleted Successfully"

);



loadSupport();



}

else{


showSuccess(

"Error",

data.message || "Delete Failed"

);



}



})



.catch(error=>{


console.log(error);


hideLoading();



showSuccess(

"Error",

"Delete Server Error"

);



});



}









// ===============================
// SUCCESS POPUP
// ===============================


function showSuccess(title,msg){



document.getElementById("successTitle")
.innerHTML=title;



document.getElementById("successMessage")
.innerHTML=msg;



document
.getElementById("successBox")
.style.display="flex";



}




function closeSuccess(){


document
.getElementById("successBox")
.style.display="none";


}









// ===============================
// LOADING SYSTEM
// ===============================


let loadingTimer;



function showLoading(text="Loading..."){



let box=document.getElementById("loadingBox");



if(!box){

console.log("Loading box missing");

return;

}



box.style.display="block";



let loadingText=
document.getElementById("loadingText");



let percent=
document.getElementById("percent");



let bar=
document.getElementById("progressBar");



if(loadingText){

loadingText.innerHTML=text;

}



let count=0;



clearInterval(loadingTimer);



if(percent){

percent.innerHTML="0%";

}



if(bar){

bar.style.width="0%";

}



loadingTimer=setInterval(()=>{


if(count<100){


count++;


if(percent){

percent.innerHTML=count+"%";

}



if(bar){

bar.style.width=count+"%";

}



}



},25);



}








function hideLoading(){



clearInterval(loadingTimer);



let box=document.getElementById("loadingBox");


let percent=document.getElementById("percent");


let bar=document.getElementById("progressBar");



if(percent){

percent.innerHTML="100%";

}



if(bar){

bar.style.width="100%";

}



setTimeout(()=>{


if(box){

box.style.display="none";

}



},400);



}







</script>


</body>


</html>
