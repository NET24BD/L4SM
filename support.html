<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pending Support</title>


<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">



<style>


*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}


body{

background:linear-gradient(135deg,#ecfdf5,#eff6ff);

padding:20px;

}



/* HEADER */

.header{

background:white;

padding:15px 20px;

border-radius:20px;

display:flex;

justify-content:space-between;

align-items:center;

box-shadow:0 10px 30px rgba(0,0,0,.15);

}


.left{

display:flex;

align-items:center;

gap:15px;

}


.back-btn{

background:#065f46;

color:white;

border:none;

padding:10px 18px;

border-radius:10px;

cursor:pointer;

}




/* PROFILE */


.profile{

position:relative;

display:flex;

align-items:center;

gap:10px;

cursor:pointer;

}



.profile img{

width:50px;

height:50px;

border-radius:50%;

border:3px solid #10b981;

object-fit:cover;

}



.profile-menu{

display:none;

position:absolute;

right:0;

top:60px;

background:white;

width:200px;

padding:10px;

border-radius:15px;

box-shadow:0 10px 30px rgba(0,0,0,.2);

z-index:1000;

}


.profile-menu.show{

display:block;

}



.profile-menu button{

width:100%;

padding:12px;

border:none;

background:white;

cursor:pointer;

border-radius:10px;

text-align:left;

}



.profile-menu button:hover{

background:#ecfdf5;

}






/* LOADING */

#loadingArea{

position:fixed;

top:0;

left:0;

width:100%;

height:100%;

z-index:9999;

}






/* TABLE */


.table-box{

margin-top:25px;

background:white;

padding:20px;

border-radius:20px;

box-shadow:0 10px 30px rgba(0,0,0,.12);

overflow:auto;

}



table{

width:100%;

border-collapse:collapse;

}



th{

background:#065f46;

color:white;

padding:14px;

}



td{

padding:12px;

text-align:center;

border-bottom:1px solid #ddd;

}



.edit-btn{

background:#2563eb;

color:white;

border:none;

padding:8px 15px;

border-radius:10px;

cursor:pointer;

}






/* EDIT POPUP */


.modal{

display:none;

position:fixed;

top:0;

left:0;

width:100%;

height:100%;

background:rgba(0,0,0,.45);

align-items:center;

justify-content:center;

z-index:2000;

}


.modal.show{

display:flex;

}



.popup{

background:white;

width:450px;

max-width:95%;

padding:30px;

border-radius:20px;

position:relative;

}



.close-btn{

position:absolute;

right:15px;

top:15px;

width:35px;

height:35px;

border:none;

border-radius:50%;

background:#ef4444;

color:white;

font-size:22px;

cursor:pointer;

}



.close-btn:hover{

background:#dc2626;

}




.popup input,
.popup textarea{


width:100%;

padding:10px;

margin-top:5px;

border:1px solid #ddd;

border-radius:10px;

}



.popup textarea{

height:80px;

}



.popup label{

display:block;

margin-top:10px;

font-weight:bold;

}



.buttons{

margin-top:20px;

display:flex;

gap:10px;

}



.buttons button{

padding:10px 18px;

border:none;

border-radius:10px;

cursor:pointer;

}



.submit{

background:#10b981;

color:white;

}


.cancel{

background:#64748b;

color:white;

}



.delete{

background:#ef4444;

color:white;

}



</style>


</head>



<body>



<!-- LOADING -->

<div id="loadingArea"></div>






<!-- HEADER -->


<div class="header">



<div class="left">



<button class="back-btn"
onclick="goBack()">


<i class="fa fa-arrow-left"></i>

Back


</button>



<h2>

<i class="fa fa-headset"></i>

Pending Support

</h2>



</div>









<div class="profile"
onclick="toggleProfile()">



<img id="profileImg"
src="assets/profile.png">



<span id="username">

User

</span>



<i class="fa fa-angle-down"></i>





<div class="profile-menu"
id="profileMenu"
onclick="event.stopPropagation()">



<button onclick="myAccount()">

<i class="fa fa-user"></i>

My Account

</button>



<button onclick="logout()">

<i class="fa fa-sign-out"></i>

Logout

</button>



</div>




</div>



</div>









<!-- TABLE -->


<div class="table-box">


<table>


<thead>

<tr>

<th>Customer ID</th>

<th>Problem</th>

<th>Reference</th>

<th>Date</th>

<th>Action</th>


</tr>


</thead>



<tbody id="supportList">


</tbody>



</table>


</div>









<!-- EDIT POPUP -->


<div class="modal"
id="editModal">



<div class="popup">



<button class="close-btn"
onclick="closeEdit()">

×

</button>




<h2>

<i class="fa fa-edit"></i>

Edit Support

</h2>





<label>Customer ID</label>

<input id="customerId">





<label>Problem</label>

<textarea id="problem"></textarea>






<label>Reference</label>

<input id="reference">






<label>Date</label>

<input type="date" id="date">






<label>Support</label>

<input id="support">





<label>Support Work</label>

<textarea id="supportWork"></textarea>







<div class="buttons">


<button class="submit"
onclick="updateSupport()">

Submit

</button>



<button class="cancel"
onclick="closeEdit()">

Cancel

</button>



<button class="delete"
onclick="openDelete()">

Delete

</button>



</div>



</div>



</div>
<script>


const API_URL =
"https://script.google.com/macros/s/AKfycbxRQLGuRc-P8bZ2FE-6ua8B1iPH6IQ1tAffS0erigyv15xQSALef2nrNTSqdMOYHt1fqg/exec";


let currentRow="";

let loadingTimer;





// ===============================
// LOAD LOADING HTML
// ===============================


fetch("loading.html")

.then(res=>res.text())

.then(data=>{


document.getElementById("loadingArea").innerHTML=data;


})

.catch(err=>{

console.log("Loading Error",err);

});








// ===============================
// PROFILE
// ===============================


function toggleProfile(){


document
.getElementById("profileMenu")
.classList.toggle("show");


}




function myAccount(){


location.href="myaccount.html";


}



function logout(){


localStorage.clear();


location.href="index.html";


}



function goBack(){


location.href="dashboard.html";


}








window.onload=function(){


let user=localStorage.getItem("username");


if(user){

document.getElementById("username").innerHTML=user;

}



let img=localStorage.getItem("picture");


if(img){

document.getElementById("profileImg").src=img;

}



loadSupport();


};









// ===============================
// LOAD SUPPORT DATA
// ===============================


function loadSupport(){


showLoading("Loading Support...");



fetch(API_URL,{

method:"POST",

headers:{

"Content-Type":"text/plain;charset=utf-8"

},

body:JSON.stringify({

action:"getPendingSupport"

})


})

.then(res=>res.json())

.then(data=>{


let html="";



if(data.data){


data.data.forEach(item=>{


html+=`

<tr>


<td>${item.customerId || ""}</td>


<td>${item.problem || ""}</td>


<td>${item.reference || ""}</td>


<td>${item.date || ""}</td>



<td>


<button class="edit-btn"

onclick="editSupport(${item.row})">


<i class="fa fa-edit"></i>

Edit


</button>



</td>



</tr>


`;


});


}



document.getElementById("supportList").innerHTML=html;


hideLoading();



})

.catch(error=>{


console.log(error);


hideLoading();


successPopup(
"Error",
"Server Error"
);



});


}









// ===============================
// EDIT OPEN
// ===============================


function editSupport(row){


currentRow=row;


showLoading("Loading Data...");



fetch(API_URL,{

method:"POST",

headers:{

"Content-Type":"text/plain;charset=utf-8"

},


body:JSON.stringify({

action:"getSingleSupport",

row:row

})


})

.then(res=>res.json())


.then(data=>{


document.getElementById("customerId").value=data.customerId || "";

document.getElementById("problem").value=data.problem || "";

document.getElementById("reference").value=data.reference || "";

document.getElementById("date").value=data.date || "";

document.getElementById("support").value=data.support || "";

document.getElementById("supportWork").value=data.supportWork || "";



hideLoading();


document
.getElementById("editModal")
.classList.add("show");



});


}









function closeEdit(){


document
.getElementById("editModal")
.classList.remove("show");


}









// ===============================
// UPDATE
// ===============================


function updateSupport(){


showLoading("Updating...");



fetch(API_URL,{

method:"POST",

headers:{

"Content-Type":"text/plain;charset=utf-8"

},


body:JSON.stringify({


action:"updateSupport",


row:currentRow,


customerId:
document.getElementById("customerId").value,


problem:
document.getElementById("problem").value,


reference:
document.getElementById("reference").value,


date:
document.getElementById("date").value,


support:
document.getElementById("support").value,


supportWork:
document.getElementById("supportWork").value



})


})

.then(res=>res.json())

.then(data=>{


hideLoading();


closeEdit();


successPopup(
"Success",
"Updated Successfully"
);



loadSupport();



})

.catch(err=>{


hideLoading();


successPopup(
"Error",
"Update Failed"
);



});


}








// ===============================
// DELETE
// ===============================


function openDelete(){


let ok=confirm("Delete this support?");


if(ok){


deleteSupport();


}


}







function deleteSupport(){


showLoading("Deleting...");



fetch(API_URL,{

method:"POST",

headers:{

"Content-Type":"text/plain;charset=utf-8"

},


body:JSON.stringify({

action:"deleteSupport",

row:currentRow


})


})


.then(res=>res.json())


.then(data=>{


hideLoading();


closeEdit();


successPopup(
"Deleted",
"Deleted Successfully"
);



loadSupport();



})

.catch(err=>{


hideLoading();


successPopup(
"Error",
"Delete Failed"
);



});


}








// ===============================
// SUCCESS POPUP
// ===============================


function successPopup(title,msg){


let box=document.createElement("div");


box.style.position="fixed";

box.style.top="0";

box.style.left="0";

box.style.width="100%";

box.style.height="100%";

box.style.background="rgba(0,0,0,.4)";

box.style.display="flex";

box.style.alignItems="center";

box.style.justifyContent="center";

box.style.zIndex="5000";



box.innerHTML=`

<div style="
background:white;
padding:30px;
border-radius:20px;
text-align:center;
">


<h2 style="color:#10b981">

✓ ${title}

</h2>


<p>${msg}</p>


<button onclick="this.parentElement.parentElement.remove()"

style="
margin-top:15px;
padding:10px 25px;
border:none;
border-radius:10px;
background:#10b981;
color:white;
">

OK

</button>


</div>

`;



document.body.appendChild(box);



}








// ===============================
// LOADING CONTROL
// ===============================


function showLoading(text){



let box=document.getElementById("loadingBox");


if(!box)return;



box.style.display="block";



let txt=document.getElementById("loadingText");


if(txt){

txt.innerHTML=text;

}



let count=0;



clearInterval(loadingTimer);



loadingTimer=setInterval(()=>{


if(count<100){


count++;


let p=document.getElementById("percent");

let b=document.getElementById("progressBar");



if(p){

p.innerHTML=count+"%";

}



if(b){

b.style.width=count+"%";

}



}



},25);



}








function hideLoading(){


clearInterval(loadingTimer);



let box=document.getElementById("loadingBox");


if(box){


box.style.display="none";


}



}



</script>


</body>

</html>
