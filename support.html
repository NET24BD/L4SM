<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>Pending Support</title>


<link rel="stylesheet" href="support.css">


<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">


</head>


<body>


<!-- LOADING -->

<div id="loadingArea"></div>





<!-- HEADER -->

<div class="header">



<div class="left-section">


<button class="back-btn"
onclick="goBack()">

<i class="fa fa-arrow-left"></i>

Back

</button>



<h2>

<i class="fa fa-headset"></i>

Pending Support

</h2>



</div>








<!-- PROFILE -->


<div class="profile"
onclick="toggleProfile()">



<img id="profileImg"
src="assets/profile.png">



<span id="username">

User

</span>



<i class="fa fa-angle-down"></i>




<div class="profile-menu"
id="profileMenu"
onclick="event.stopPropagation()">



<button onclick="myAccount()">

<i class="fa fa-user"></i>

My Account

</button>





<button onclick="logout()">

<i class="fa fa-sign-out"></i>

Logout

</button>




</div>




</div>



</div>









<!-- TABLE -->


<div class="table-box">


<table>


<thead>

<tr>

<th>Customer ID</th>

<th>Problem</th>

<th>Reference</th>

<th>Date</th>

<th>Action</th>


</tr>


</thead>



<tbody id="supportList">


</tbody>



</table>


</div>









<!-- EDIT POPUP -->


<div class="modal"
id="editModal">



<div class="popup">



<button class="close-btn"
onclick="closeEdit()">

×

</button>





<h2>

<i class="fa fa-edit"></i>

Edit Support

</h2>







<label>
Customer ID
</label>


<input id="customerId">





<label>
Problem
</label>


<textarea id="problem"></textarea>





<label>
Reference
</label>


<input id="reference">





<label>
Date
</label>


<input type="date"
id="date">





<label>
Support
</label>


<input id="support">





<label>
Support Work
</label>


<textarea id="supportWork"></textarea>






<div class="popup-buttons">



<button class="submit-btn"
onclick="updateSupport()">

Submit

</button>




<button class="cancel-btn"
onclick="closeEdit()">

Cancel

</button>





<button class="delete-btn"
onclick="openDelete()">

Delete

</button>



</div>




</div>


</div>









<!-- DELETE POPUP -->


<div class="modal"
id="deleteModal">



<div class="popup small">



<h3>

Delete Support?

</h3>



<p>
Are you sure?
</p>




<div class="popup-buttons">


<button class="delete-btn"
onclick="deleteSupport()">

Yes Delete

</button>



<button class="cancel-btn"
onclick="closeDelete()">

Cancel

</button>



</div>



</div>



</div>









<!-- SUCCESS POPUP -->


<div class="modal"
id="successModal">



<div class="popup small">


<h2 id="successTitle">

Success

</h2>



<p id="successMessage">

Done

</p>




<button class="submit-btn"
onclick="closeSuccess()">

OK

</button>



</div>



</div>








<script src="support.js"></script>


</body>


</html>
