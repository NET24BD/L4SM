<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pending Support</title>


<link rel="stylesheet" href="support.css">


<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">


</head>


<body>



<div class="header">


<div class="left-section">


<button class="back-btn" onclick="goBack()">

<i class="fa fa-arrow-left"></i>

Back

</button>



<h2>

<i class="fa fa-headset"></i>

Pending Support

</h2>


</div>





<div class="profile">


<div class="profile-head"
onclick="toggleProfile()">



<img id="profileImg"
src="assets/profile.png">


<span id="username">
User
</span>


<i class="fa fa-angle-down"></i>


</div>





<div class="profile-menu"
id="profileMenu">



<button onclick="myAccount()">

<i class="fa fa-user"></i>

My Account

</button>



<button onclick="logout()">

<i class="fa fa-sign-out"></i>

Logout

</button>


</div>


</div>


</div>









<div class="table-box">


<table>


<thead>

<tr>

<th>Customer ID</th>

<th>Problem</th>

<th>Reference</th>

<th>Date</th>

<th>Action</th>


</tr>


</thead>



<tbody id="supportList">


</tbody>


</table>


</div>









<!-- EDIT -->

<div class="modal"
id="editModal">


<div class="popup">



<button class="close-btn"
onclick="closeEdit()">

×

</button>




<h2>Edit Support</h2>



<label>Customer ID</label>

<input id="customerId">



<label>Problem</label>

<textarea id="problem"></textarea>



<label>Reference</label>

<input id="reference">



<label>Date</label>

<input id="date"
type="date">



<label>Support</label>

<input id="support">



<label>Support Work</label>

<textarea id="supportWork"></textarea>




<div class="popup-buttons">


<button class="submit-btn"
onclick="updateSupport()">

Submit

</button>


<button class="cancel-btn"
onclick="closeEdit()">

Cancel

</button>


<button class="delete-btn"
onclick="deleteSupport()">

Delete

</button>



</div>



</div>


</div>







<script src="support.js"></script>


</body>

</html>
