<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Pending Support</title>


    <!-- ===============================
         CSS
    ================================ -->

    <link
        rel="stylesheet"
        href="support.css"
    >


    <!-- ===============================
         FONT AWESOME
    ================================ -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    >

</head>


<body>


    <!-- =====================================
         HEADER
    ====================================== -->

    <div class="header">


        <!-- ===============================
             LEFT SECTION
        ================================ -->

        <div class="left-section">


            <!-- BACK BUTTON -->

            <button
                type="button"
                class="back-btn"
                onclick="goBack()"
            >

                <i class="fa fa-arrow-left"></i>

                Back

            </button>


            <!-- TITLE -->

            <h2>

                <i class="fa fa-headset"></i>

                Pending Support

            </h2>

        </div>



        <!-- ===============================
             PROFILE
        ================================ -->

        <div class="profile">


            <div
                class="profile-head"
                onclick="toggleProfile()"
            >


                <!-- PROFILE IMAGE -->

                <img
                    id="profileImg"
                    src="assets/profile.png"
                    alt="Profile"
                >


                <!-- USERNAME -->

                <span id="username">
                    User
                </span>


                <i class="fa fa-angle-down"></i>

            </div>



            <!-- PROFILE MENU -->

            <div
                class="profile-menu"
                id="profileMenu"
            >


                <!-- MY ACCOUNT -->

                <button
                    type="button"
                    onclick="myAccount()"
                >

                    <i class="fa fa-user"></i>

                    My Account

                </button>


                <!-- LOGOUT -->

                <button
                    type="button"
                    onclick="logout()"
                >

                    <i class="fa fa-sign-out"></i>

                    Logout

                </button>


            </div>

        </div>

    </div>



    <!-- =====================================
         SEARCH SECTION
    ====================================== -->

    <div class="search-section">


        <div class="search-box">


            <i class="fa fa-search"></i>


            <input
                type="text"
                id="supportSearch"
                placeholder="Search Customer ID, Problem, Reference..."
                autocomplete="off"
            >


        </div>


    </div>



    <!-- =====================================
         TABLE
    ====================================== -->

    <div class="table-box">


        <table>


            <!-- TABLE HEADER -->

            <thead>

                <tr>

                    <th>
                        Customer ID
                    </th>

                    <th>
                        Problem
                    </th>

                    <th>
                        Reference
                    </th>

                    <th>
                        Date
                    </th>

                    <th>
                        Action
                    </th>

                </tr>

            </thead>


            <!-- TABLE BODY -->

            <tbody id="supportList">

                <!-- JavaScript will load data here -->

            </tbody>


        </table>

    </div>



    <!-- =====================================
         EDIT SUPPORT MODAL
    ====================================== -->

    <div
        class="modal"
        id="editModal"
    >


        <div class="popup">


            <!-- CLOSE BUTTON -->

            <button
                type="button"
                class="close-btn"
                onclick="closeEdit()"
            >

                ×

            </button>



            <!-- TITLE -->

            <h2>

                <i class="fa fa-headset"></i>

                Edit Support

            </h2>



            <!-- CUSTOMER ID -->

            <label for="customerId">

                Customer ID

            </label>


            <input
                type="text"
                id="customerId"
                autocomplete="off"
            >



            <!-- PROBLEM -->

            <label for="problem">

                Problem

            </label>


            <textarea
                id="problem"
            ></textarea>



            <!-- REFERENCE -->

            <label for="reference">

                Reference

            </label>


            <input
                type="text"
                id="reference"
                autocomplete="off"
            >



            <!-- DATE -->

            <label for="date">

                Date

            </label>


            <input
                type="date"
                id="date"
            >



            <!-- SUPPORT -->

            <label for="support">

                Support

            </label>


            <input
                type="text"
                id="support"
                autocomplete="off"
            >



            <!-- SUPPORT WORK -->

            <label for="supportWork">

                Support Work

            </label>


            <textarea
                id="supportWork"
            ></textarea>



            <!-- ===============================
                 BUTTONS
            ================================ -->

            <div class="popup-buttons">


                <!-- SUBMIT -->

                <button
                    type="button"
                    class="submit-btn"
                    onclick="updateSupport()"
                >

                    <i class="fa fa-paper-plane"></i>

                    Submit

                </button>


                <!-- CANCEL -->

                <button
                    type="button"
                    class="cancel-btn"
                    onclick="closeEdit()"
                >

                    <i class="fa fa-xmark"></i>

                    Cancel

                </button>


                <!-- DELETE -->

                <button
                    type="button"
                    class="delete-btn"
                    onclick="deleteSupport()"
                >

                    <i class="fa fa-trash"></i>

                    Delete

                </button>


            </div>


        </div>

    </div>



    <!-- =====================================
         CUSTOM DELETE CONFIRM POPUP
    ====================================== -->

    <div
        class="custom-popup-overlay"
        id="confirmPopup"
    >


        <div class="custom-popup">


            <!-- WARNING ICON -->

            <div class="popup-icon warning">

                <i class="fa fa-triangle-exclamation"></i>

            </div>


            <!-- TITLE -->

            <h3 id="confirmTitle">

                Confirm Delete

            </h3>


            <!-- MESSAGE -->

            <p id="confirmMessage">

                Are you sure you want to delete this support?

            </p>


            <!-- BUTTONS -->

            <div class="custom-popup-buttons">


                <!-- CANCEL -->

                <button
                    type="button"
                    class="popup-cancel-btn"
                    onclick="closeConfirmPopup()"
                >

                    Cancel

                </button>


                <!-- CONFIRM -->

                <button
                    type="button"
                    class="popup-confirm-btn"
                    id="confirmActionBtn"
                >

                    Delete

                </button>


            </div>


        </div>

    </div>



    <!-- =====================================
         CUSTOM SUCCESS POPUP
    ====================================== -->

    <div
        class="custom-popup-overlay"
        id="successPopup"
    >


        <div class="custom-popup">


            <!-- SUCCESS ICON -->

            <div class="popup-icon success">

                <i class="fa fa-check"></i>

            </div>


            <!-- TITLE -->

            <h3 id="successTitle">

                Success

            </h3>


            <!-- MESSAGE -->

            <p id="successMessage">

                Operation completed successfully.

            </p>


            <!-- OK -->

            <button
                type="button"
                class="popup-ok-btn"
                onclick="closeSuccessPopup()"
            >

                OK

            </button>


        </div>

    </div>



    <!-- =====================================
         CUSTOM ERROR POPUP
    ====================================== -->

    <div
        class="custom-popup-overlay"
        id="errorPopup"
    >


        <div class="custom-popup">


            <!-- ERROR ICON -->

            <div class="popup-icon error">

                <i class="fa fa-xmark"></i>

            </div>


            <!-- TITLE -->

            <h3 id="errorTitle">

                Error

            </h3>


            <!-- MESSAGE -->

            <p id="errorMessage">

                Something went wrong.

            </p>


            <!-- OK -->

            <button
                type="button"
                class="popup-ok-btn error-btn"
                onclick="closeErrorPopup()"
            >

                OK

            </button>


        </div>

    </div>



    <!-- =====================================
         JAVASCRIPT
    ====================================== -->

    <script
        src="support.js"
    ></script>


</body>

</html>
