<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Coming Soon</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(
                135deg,
                #ecfdf5,
                #eff6ff,
                #f8fafc
            );
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 650px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 28px;
            padding: 55px 35px;
            text-align: center;

            box-shadow:
                0 25px 70px rgba(0, 0, 0, 0.15);

            border: 1px solid rgba(255,255,255,.8);
        }

        .icon {
            width: 90px;
            height: 90px;
            margin: 0 auto 25px;

            border-radius: 50%;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #ecfdf5;
            color: #059669;

            font-size: 42px;
        }

        .small-text {
            color: #64748b;
            font-size: 15px;
            font-weight: 600;
            letter-spacing: 1px;
            margin-bottom: 12px;
            text-transform: uppercase;
        }

        h1 {
            font-size: clamp(38px, 7vw, 65px);
            font-weight: 800;
            color: #064e3b;
            margin-bottom: 18px;
            line-height: 1.1;
        }

        .message {
            font-size: 18px;
            color: #475569;
            line-height: 1.7;
            max-width: 500px;
            margin: 0 auto 30px;
        }

        .contact-box {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 18px;
            padding: 22px;
            margin-top: 25px;
        }

        .contact-box h2 {
            color: #0f172a;
            font-size: 20px;
            margin-bottom: 8px;
        }

        .contact-box p {
            color: #64748b;
            font-size: 15px;
        }

        .admin-text {
            color: #059669;
            font-weight: 700;
        }

        .footer {
            margin-top: 30px;
            font-size: 13px;
            color: #94a3b8;
        }

        @media (max-width: 600px) {

            .container {
                padding: 40px 22px;
                border-radius: 22px;
            }

            .icon {
                width: 75px;
                height: 75px;
                font-size: 34px;
            }

            .message {
                font-size: 16px;
            }

        }

    </style>

</head>


<body>

    <div class="container">

        <div class="icon">
            🚧
        </div>

        <div class="small-text">
            This Section
        </div>

        <h1>
            Coming Soon
        </h1>

        <p class="message">
            This feature is currently under development.
            We are working to bring you a better experience.
            Please check back again soon.
        </p>

        <div class="contact-box">

            <h2>
                Contact Your Admin
            </h2>

            <p>
                For more information or assistance,
                please contact your
                <span class="admin-text">
                    Admin
                </span>.
            </p>

        </div>

        <div class="footer">
            Thank you for your patience and understanding.
        </div>

    </div>

</body>

</html>
