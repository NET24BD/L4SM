<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Account</title>

<link rel="stylesheet" href="my-account.css">

</head>


<body>


<div class="account-box">


<div class="top">

<a href="dashboard.html">← Dashboard</a>

<h2>My Account</h2>

</div>




<div class="profile-section">


<img id="photo" src="profile.png">


<h3 id="name">User Name</h3>

<p id="role">Role</p>


</div>






<div class="info-card">


<div class="info">

<label>Username</label>

<span id="username">---</span>

</div>



<div class="info">

<label>Name</label>

<span id="fullname">---</span>

</div>



<div class="info">

<label>Role</label>

<span id="userRole">---</span>

</div>



<div class="info">

<label>Department</label>

<span id="department">---</span>

</div>



<div class="info">

<label>Email</label>

<span id="email">---</span>

</div>



<div class="info">

<label>Phone</label>

<span id="phone">---</span>

</div>



<div class="info">

<label>Address</label>

<span id="address">---</span>

</div>



<div class="info">

<label>Join Date</label>

<span id="joinDate">---</span>

</div>



</div>





<button onclick="logout()">

Logout

</button>



</div>




<script src="my-account.js"></script>


</body>

</html>
