<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Pending Call</title>


    <!-- CALL CSS -->

    <link rel="stylesheet"
          href="call.css">


    <!-- FONT AWESOME -->

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

</head>


<body>


<!-- =================================================
     HEADER
================================================= -->

<header class="header">


    <!-- LEFT -->

    <div class="left-section">


        <!-- BACK -->

        <button class="back-btn"
                onclick="goBack()">

            <i class="fa fa-arrow-left"></i>

            Back

        </button>



        <!-- PENDING CALL -->

        <h2 class="call-title"
            onclick="toggleFilter()">

            <i class="fa fa-phone-volume"></i>

            Pending Call

        </h2>


    </div>



    <!-- =================================================
         PROFILE
    ================================================= -->

    <div class="profile">


        <div class="profile-head"
             onclick="toggleProfile()">


            <img id="profileImg"
                 src="assets/profile.png"
                 alt="Profile">


            <span id="username">
                User
            </span>


            <i class="fa fa-angle-down"></i>


        </div>



        <!-- PROFILE MENU -->

        <div class="profile-menu"
             id="profileMenu">


            <button type="button"
                    onclick="myAccount()">

                <i class="fa fa-user"></i>

                My Account

            </button>



            <button type="button"
                    onclick="logout()">

                <i class="fa fa-sign-out"></i>

                Logout

            </button>


        </div>


    </div>


</header>





<!-- =================================================
     FILTER AREA
================================================= -->

<div class="filter-bar"
     id="filterBar">


    <!-- FROM -->

    <div class="filter-group">

        <label for="fromDate">
            From
        </label>

        <input
            type="date"
            id="fromDate">

    </div>



    <!-- TO -->

    <div class="filter-group">

        <label for="toDate">
            To
        </label>

        <input
            type="date"
            id="toDate">

    </div>



    <!-- LAST DAYS -->

    <div class="filter-group">

        <label for="lastDays">
            Last Days
        </label>

        <input
            type="number"
            id="lastDays"
            min="1"
            placeholder="7">

    </div>



    <!-- SEARCH -->

    <div class="filter-group search-group">

        <label for="searchCall">
            Search
        </label>

        <input
            type="text"
            id="searchCall"
            placeholder="Search Customer ID / Problem / Reference">

    </div>



    <!-- APPLY -->

    <button
        type="button"
        class="filter-btn"
        onclick="applyFilter()">

        <i class="fa-solid fa-filter"></i>

        Apply

    </button>



    <!-- RESET -->

    <button
        type="button"
        class="reset-btn"
        onclick="resetFilter()">

        <i class="fa-solid fa-rotate-left"></i>

        Reset

    </button>


</div>





<!-- =================================================
     TABLE
================================================= -->

<div class="table-box">


    <table>


        <thead>


            <tr>


                <th>
                    Customer ID
                </th>


                <th>
                    Problem
                </th>


                <th>
                    Reference
                </th>


                <th>
                    Date
                </th>


                <th>
                    Support
                </th>


                <th>
                    Support Work
                </th>


                <th>
                    Action
                </th>


            </tr>


        </thead>



        <tbody id="callList">


            <tr>


                <td colspan="7">

                    Loading...

                </td>


            </tr>


        </tbody>


    </table>


</div>





<!-- =================================================
     EDIT MODAL
================================================= -->

<div class="modal"
     id="editModal">


    <div class="popup">


        <!-- CLOSE -->

        <button
            type="button"
            class="close-btn"
            onclick="closeEdit()">

            ×

        </button>



        <h2>

            <i class="fa-solid fa-phone-volume"></i>

            Edit Call

        </h2>



        <!-- CUSTOMER ID -->

        <label for="customerId">
            Customer ID
        </label>

        <input
            id="customerId"
            type="text">



        <!-- PROBLEM -->

        <label for="problem">
            Problem
        </label>

        <textarea
            id="problem"
            rows="4"></textarea>



        <!-- REFERENCE -->

        <label for="reference">
            Reference
        </label>

        <input
            id="reference"
            type="text">



        <!-- DATE -->

        <label for="date">
            Date
        </label>

        <input
            id="date"
            type="date">



        <!-- SUPPORT -->

        <label for="support">
            Support
        </label>

        <input
            id="support"
            type="text">



        <!-- SUPPORT WORK -->

        <label for="supportWork">
            Support Work
        </label>

        <textarea
            id="supportWork"
            rows="3"></textarea>



        <!-- CALL -->

        <label for="call">
            Call
        </label>

        <input
            id="call"
            type="text">



        <!-- CALL WORK -->

        <label for="callWork">
            Call Work
        </label>

        <textarea
            id="callWork"
            rows="3"></textarea>



        <!-- BUTTONS -->

        <div class="popup-buttons">


            <!-- UPDATE -->

            <button
                type="button"
                class="submit-btn"
                onclick="updateCall()">

                <i class="fa-solid fa-save"></i>

                Submit

            </button>



            <!-- CANCEL -->

            <button
                type="button"
                class="cancel-btn"
                onclick="closeEdit()">

                Cancel

            </button>



            <!-- DELETE -->

            <button
                type="button"
                class="delete-btn"
                onclick="deleteCall()">

                <i class="fa-solid fa-trash"></i>

                Delete

            </button>


        </div>


    </div>


</div>





<!-- =================================================
     SUCCESS MESSAGE MODAL
================================================= -->

<div class="modal"
     id="messageModal">


    <div class="message-box">


        <div class="message-icon"
             id="messageIcon">

            <i class="fa-solid fa-circle-check"></i>

        </div>



        <h3 id="messageTitle">

            Success

        </h3>



        <p id="messageText">

            Done

        </p>



        <button
            type="button"
            onclick="closeMessage()">

            OK

        </button>


    </div>


</div>





<!-- =================================================
     DELETE CONFIRM MODAL
================================================= -->

<div class="modal"
     id="confirmModal">


    <div class="confirm-box">


        <div class="confirm-icon">

            <i class="fa-solid fa-triangle-exclamation"></i>

        </div>



        <h3>

            Delete Call?

        </h3>



        <p>

            Are you sure you want to delete this record?

        </p>



        <div class="confirm-buttons">


            <!-- CONFIRM DELETE -->

            <button
                type="button"
                class="confirm-delete"
                onclick="confirmDelete()">

                <i class="fa-solid fa-trash"></i>

                Delete

            </button>



            <!-- CANCEL -->

            <button
                type="button"
                class="confirm-cancel"
                onclick="closeConfirm()">

                Cancel

            </button>


        </div>


    </div>


</div>





<!-- =================================================
     CALL JS
================================================= -->

<script src="call.js"></script>


</body>

</html>
