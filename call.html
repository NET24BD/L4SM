<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Pending Call</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<link rel="stylesheet"
      href="call.css">

</head>


<body>


<!-- ===============================
HEADER
=============================== -->

<div class="header">


    <div class="left-section">


        <button class="back-btn"
                onclick="goBack()">

            <i class="fa fa-arrow-left"></i>

            Back

        </button>


        <h2>

            <i class="fa fa-phone-volume"></i>

            Pending Call

        </h2>


    </div>



    <!-- ===============================
    PROFILE
    =============================== -->

    <div class="profile">


        <div class="profile-head"
             onclick="toggleProfile()">


            <img id="profileImg"
                 src="assets/profile.png"
                 alt="Profile">


            <span id="username">
                User
            </span>


            <i class="fa fa-angle-down"></i>


        </div>



        <!-- PROFILE MENU -->

        <div class="profile-menu"
             id="profileMenu">


            <button onclick="myAccount()">

                <i class="fa fa-user"></i>

                My Account

            </button>


            <button onclick="logout()">

                <i class="fa fa-sign-out"></i>

                Logout

            </button>


        </div>


    </div>


</div>





<!-- ===============================
FILTER AREA
=============================== -->

<div class="filter-box">


    <!-- SEARCH -->

    <div class="filter-item search-item">

        <label>

            <i class="fa-solid fa-magnifying-glass"></i>

            Search

        </label>


        <input
            type="text"
            id="searchInput"
            placeholder="Customer ID, Problem, Reference...">

    </div>




    <!-- FROM DATE -->

    <div class="filter-item">

        <label>

            <i class="fa-solid fa-calendar-days"></i>

            From Date

        </label>


        <input
            type="date"
            id="fromDate">

    </div>




    <!-- TO DATE -->

    <div class="filter-item">

        <label>

            <i class="fa-solid fa-calendar-days"></i>

            To Date

        </label>


        <input
            type="date"
            id="toDate">

    </div>




    <!-- LAST DAYS -->

    <div class="filter-item">

        <label>

            <i class="fa-solid fa-clock-rotate-left"></i>

            Last Days

        </label>


        <select id="lastDays">

            <option value="">
                All
            </option>

            <option value="1">
                Last 1 Day
            </option>

            <option value="3">
                Last 3 Days
            </option>

            <option value="7">
                Last 7 Days
            </option>

            <option value="15">
                Last 15 Days
            </option>

            <option value="30">
                Last 30 Days
            </option>

            <option value="60">
                Last 60 Days
            </option>

            <option value="90">
                Last 90 Days
            </option>

        </select>

    </div>




    <!-- FILTER BUTTON -->

    <div class="filter-buttons">


        <button
            class="filter-btn"
            onclick="applyFilter()">

            <i class="fa-solid fa-filter"></i>

            Filter

        </button>



        <button
            class="clear-btn"
            onclick="clearFilter()">

            <i class="fa-solid fa-rotate-left"></i>

            Clear

        </button>


    </div>


</div>





<!-- ===============================
TABLE
=============================== -->

<div class="table-box">


    <div class="table-header">


        <h3>

            <i class="fa-solid fa-list"></i>

            Pending Call List

        </h3>


        <span id="resultCount">

            0 Records

        </span>


    </div>



    <div class="table-scroll">


        <table>


            <thead>

                <tr>

                    <th>
                        Customer ID
                    </th>

                    <th>
                        Problem
                    </th>

                    <th>
                        Reference
                    </th>

                    <th>
                        Date
                    </th>

                    <th>
                        Support
                    </th>

                    <th>
                        Support Work
                    </th>

                    <th>
                        Call
                    </th>

                    <th>
                        Call Work
                    </th>

                    <th>
                        Action
                    </th>

                </tr>

            </thead>



            <tbody id="callList">


                <tr>

                    <td colspan="9">

                        Loading...

                    </td>

                </tr>


            </tbody>


        </table>


    </div>


</div>





<!-- ===============================
EDIT MODAL
=============================== -->

<div class="modal"
     id="editModal">


    <div class="popup">


        <button
            class="close-btn"
            onclick="closeEdit()">

            ×

        </button>



        <h2>

            <i class="fa-solid fa-pen-to-square"></i>

            Edit Call

        </h2>



        <!-- CUSTOMER ID -->

        <label>
            Customer ID
        </label>

        <input
            id="customerId"
            type="text">



        <!-- PROBLEM -->

        <label>
            Problem
        </label>

        <textarea
            id="problem"
            rows="4"></textarea>



        <!-- REFERENCE -->

        <label>
            Reference
        </label>

        <input
            id="reference"
            type="text">



        <!-- DATE -->

        <label>
            Date
        </label>

        <input
            id="date"
            type="date">



        <!-- SUPPORT -->

        <label>
            Support
        </label>

        <input
            id="support"
            type="text">



        <!-- SUPPORT WORK -->

        <label>
            Support Work
        </label>

        <textarea
            id="supportWork"
            rows="3"></textarea>



        <!-- CALL -->

        <label>
            Call
        </label>

        <input
            id="call"
            type="text">



        <!-- CALL WORK -->

        <label>
            Call Work
        </label>

        <textarea
            id="callWork"
            rows="3"></textarea>



        <!-- BUTTONS -->

        <div class="popup-buttons">


            <button
                class="submit-btn"
                onclick="updateCall()">

                <i class="fa-solid fa-save"></i>

                Submit

            </button>



            <button
                class="cancel-btn"
                onclick="closeEdit()">

                Cancel

            </button>



            <button
                class="delete-btn"
                onclick="deleteCall()">

                <i class="fa-solid fa-trash"></i>

                Delete

            </button>


        </div>


    </div>


</div>





<!-- ===============================
MESSAGE POPUP
=============================== -->

<div class="message-modal"
     id="messageModal">


    <div class="message-box">


        <div class="message-icon"
             id="messageIcon">

            <i class="fa-solid fa-circle-check"></i>

        </div>



        <h3 id="messageTitle">

            Success

        </h3>



        <p id="messageText">

            Done

        </p>



        <button onclick="closeMessage()">

            OK

        </button>


    </div>


</div>





<!-- ===============================
DELETE CONFIRMATION
=============================== -->

<div class="confirm-modal"
     id="confirmModal">


    <div class="confirm-box">


        <div class="confirm-icon">

            <i class="fa-solid fa-triangle-exclamation"></i>

        </div>



        <h3>

            Delete Call?

        </h3>



        <p>

            Are you sure you want to delete this record?

        </p>



        <div class="confirm-buttons">


            <button
                class="confirm-delete"
                onclick="confirmDelete()">

                <i class="fa-solid fa-trash"></i>

                Delete

            </button>



            <button
                class="confirm-cancel"
                onclick="closeConfirm()">

                Cancel

            </button>


        </div>


    </div>


</div>





<!-- ===============================
JAVASCRIPT
=============================== -->

<script src="call.js"></script>


</body>

</html>
