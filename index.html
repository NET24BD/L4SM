<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>System Management</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Poppins',sans-serif;
        }

        body{

            display:flex;
            justify-content:center;
            align-items:center;

            min-height:100vh;

            background:#698D94;

            padding:20px;

        }

        .card{

            width:100%;
            max-width:420px;

            background:#ffffff;

            border-radius:15px;

            padding:40px 30px;

            text-align:center;

            box-shadow:0 10px 30px rgba(0,0,0,.15);

        }

        .logo{

            width:80px;
            height:80px;

            margin:0 auto 20px;

            background:#698D94;

            color:#fff;

            border-radius:50%;

            display:flex;
            justify-content:center;
            align-items:center;

            font-size:32px;
            font-weight:bold;

        }

        h1{

            color:#333;
            margin-bottom:10px;

        }

        p{

            color:#666;
            line-height:1.7;
            margin-bottom:30px;

        }

        .btn{

            width:100%;

            height:50px;

            border:none;

            border-radius:8px;

            background:#698D94;

            color:#fff;

            font-size:16px;

            font-weight:600;

            cursor:pointer;

            transition:.3s;

        }

        .btn:hover{

            background:#5d7c83;

        }

        .footer{

            margin-top:25px;

            color:#888;

            font-size:13px;

        }

        @media(max-width:480px){

            .card{

                padding:30px 20px;

            }

            h1{

                font-size:28px;

            }

        }

    </style>

</head>

<body>

    <div class="card">

        <div class="logo">
            SM
        </div>

        <h1>Welcome</h1>

        <p>
            Welcome to the <strong>System Management</strong> Portal.<br>
            Please click the button below to login.
        </p>

        <button class="btn" id="loginBtn">
            Login
        </button>

        <div class="footer">
            © 2026 System Management. All Rights Reserved.
        </div>

    </div>

    <script>

        document.getElementById("loginBtn").addEventListener("click", function(){

            window.location.href = "./login.html";

        });

    </script>

</body>

</html>
