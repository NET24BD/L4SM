<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dashboard | Link4 Support Team</title>


<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:"Segoe UI",Arial,sans-serif;
}


body{
background:#f1f5f4;
}



/* HEADER */

.header{

height:65px;
background:#0b5c45;
color:white;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 25px;

}


.header h2{

font-size:22px;

}


.logout{

background:white;
color:#0b5c45;
padding:9px 18px;
border-radius:10px;
font-weight:bold;
cursor:pointer;

}



/* USER BOX */

.user-box{

margin:20px;
background:white;
padding:20px;
border-radius:15px;
box-shadow:0 5px 20px rgba(0,0,0,.12);

}


.user-box h3{

color:#0b5c45;

}


.user-box p{

color:#666;
margin-top:5px;

}



/* MENU */

.menu{

padding:20px;
display:grid;
grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
gap:20px;

}



.card{

background:white;
padding:25px 15px;
border-radius:18px;
text-align:center;
box-shadow:0 5px 20px rgba(0,0,0,.1);
transition:.3s;

}


.card:hover{

transform:translateY(-6px);

}


a{

text-decoration:none;
color:black;

}



.icon{

font-size:40px;

}


.title{

font-size:18px;
font-weight:bold;
color:#0b5c45;
margin-top:12px;

}


.short{

margin-top:8px;
font-size:14px;
color:#888;

}



.footer{

text-align:center;
padding:20px;
font-size:13px;
color:#777;

}


</style>

</head>



<body>



<div class="header">


<h2>
Link4 Support Team
</h2>


<div class="logout" onclick="logout()">
Logout
</div>


</div>




<div class="user-box">


<h3 id="name">
Welcome User
</h3>


<p id="role">
Role :
</p>


</div>





<div class="menu">



<a href="NS.html">
<div class="card">
<div class="icon">🆕</div>
<div class="title">New Support</div>
<div class="short">NS</div>
</div>
</a>



<a href="PS.html">
<div class="card">
<div class="icon">⏳</div>
<div class="title">Pending Support</div>
<div class="short">PS</div>
</div>
</a>



<a href="PC.html">
<div class="card">
<div class="icon">📞</div>
<div class="title">Pending Call</div>
<div class="short">PC</div>
</div>
</a>



<a href="H.html">
<div class="card">
<div class="icon">📜</div>
<div class="title">History</div>
<div class="short">H</div>
</div>
</a>



<a href="ON.html">
<div class="card">
<div class="icon">📝</div>
<div class="title">Offline Entry</div>
<div class="short">ON</div>
</div>
</a>



<a href="OF.html">
<div class="card">
<div class="icon">📂</div>
<div class="title">Offline</div>
<div class="short">OF</div>
</div>
</a>



<a href="OC.html">
<div class="card">
<div class="icon">💰</div>
<div class="title">Offline Collect</div>
<div class="short">OC</div>
</div>
</a>



</div>





<div class="footer">

© Link4 Support Management System

</div>






<script>


// CHECK LOGIN


let user = localStorage.getItem("user");


if(!user){

window.location.replace("login.html");

}

else{


try{


let data = JSON.parse(user);



document.getElementById("name").innerHTML =
"Welcome, " + 
(data.name || data.username || "User");



document.getElementById("role").innerHTML =
"Role : " + 
(data.role || "User");



}

catch(error){


localStorage.removeItem("user");

window.location.replace("login.html");


}



}




// LOGOUT


function logout(){


localStorage.removeItem("user");


window.location.replace("login.html");


}



</script>




</body>

</html>
