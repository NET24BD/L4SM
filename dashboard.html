<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>L4SM Dashboard</title>


<link rel="stylesheet" href="dashboard.css">


<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">


</head>


<body>



<!-- SIDEBAR -->

<div class="sidebar">


<div class="logo">

<i class="fa-solid fa-layer-group"></i>

L4SM

</div>




<ul>


<li class="active"
onclick="openPage('dashboard.html')">

<i class="fa-solid fa-house"></i>

Dashboard

</li>



<li onclick="openPage('usercontrol.html')">

<i class="fa-solid fa-users"></i>

User Control

</li>




<li onclick="openPage('support.html')">

<i class="fa-solid fa-headset"></i>

Support

</li>




<li onclick="openPage('call.html')">

<i class="fa-solid fa-phone"></i>

Caller

</li>




<li onclick="openPage('manager.html')">

<i class="fa-solid fa-user-tie"></i>

Manager

</li>



</ul>


</div>










<!-- MAIN AREA -->

<div class="main">



<header>


<h2>
Dashboard
</h2>




<div class="profile"
onclick="toggleProfileMenu()">



<img id="profileImg"
src="assets/profile.png">



<span id="username">
User
</span>



<i class="fa-solid fa-angle-down"></i>





<div id="profileMenu"
class="profile-menu">



<button onclick="openMyAccount()">

<i class="fa-solid fa-user"></i>

My Account

</button>





<button onclick="logout()">

<i class="fa-solid fa-right-from-bracket"></i>

Logout

</button>



</div>



</div>



</header>









<!-- WELCOME -->


<div class="welcome">


<h1>

Welcome Back,
<span id="username">
User
</span>

</h1>



<p>
Manage your L4SM system easily
</p>



</div>










<!-- CARDS -->


<div class="cards">



<div class="card blue">


<i class="fa-solid fa-users"></i>


<div>

<h3>
Users
</h3>

<p>
Manage Users
</p>


</div>


</div>






<div class="card green">


<i class="fa-solid fa-headset"></i>


<div>

<h3>
Support
</h3>

<p>
Support Panel
</p>


</div>


</div>







<div class="card orange">


<i class="fa-solid fa-phone"></i>


<div>

<h3>
Calls
</h3>

<p>
Call Management
</p>


</div>


</div>







<div class="card purple">


<i class="fa-solid fa-chart-line"></i>


<div>

<h3>
Reports
</h3>

<p>
System Reports
</p>


</div>


</div>



</div>









<!-- QUICK ACTION -->


<div class="quick">


<h2>
Quick Access
</h2>



<div class="quick-buttons">


<button onclick="openPage('usercontrol.html')">

<i class="fa-solid fa-user-plus"></i>

Add User

</button>





<button onclick="openMyAccount()">

<i class="fa-solid fa-key"></i>

Change Password

</button>


</div>



</div>








</div>








<script src="session.js"></script>

<script src="dashboard.js"></script>


</body>

</html>
