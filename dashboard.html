<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>L4SM Dashboard</title>



<link rel="stylesheet" href="dashboard.css">


<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">


</head>



<body>



<!-- =========================
HEADER
========================= -->


<header class="topbar">


<div class="logo">

<i class="fa-solid fa-chart-line"></i>

L4SM

</div>





<div class="profile">



<div class="profile-box"
onclick="toggleProfileMenu()">



<img 
id="profileImg"
src="assets/profile.png"
alt="Profile">



<span id="username">
User
</span>



<i class="fa-solid fa-chevron-down"></i>



</div>






<!-- PROFILE MENU -->


<div id="profileMenu"
class="profile-menu">



<button onclick="openMyAccount()">

<i class="fa-solid fa-user"></i>

My Account

</button>





<button onclick="logout()">

<i class="fa-solid fa-right-from-bracket"></i>

Logout

</button>



</div>



</div>



</header>









<!-- =========================
SIDEBAR
========================= -->


<div class="sidebar">



<h3>
MENU
</h3>





<button onclick="openPage('dashboard.html')">

<i class="fa-solid fa-house"></i>

Dashboard

</button>






<button onclick="openPage('usercontrol.html')">

<i class="fa-solid fa-users"></i>

User Control

</button>






<button onclick="openPage('support.html')">

<i class="fa-solid fa-headset"></i>

Support

</button>






<button onclick="openPage('call.html')">

<i class="fa-solid fa-phone"></i>

Caller

</button>






<button onclick="openPage('manager.html')">

<i class="fa-solid fa-user-tie"></i>

Manager

</button>





</div>









<!-- =========================
MAIN CONTENT
========================= -->


<div class="main">





<h1>
Welcome,
<span id="username">
User
</span>
</h1>





<div class="cards">





<div class="card">


<i class="fa-solid fa-users"></i>


<h2>
Users
</h2>


<p>
Manage Users
</p>


</div>








<div class="card">


<i class="fa-solid fa-headset"></i>


<h2>
Support
</h2>


<p>
Support Panel
</p>


</div>








<div class="card">


<i class="fa-solid fa-phone"></i>


<h2>
Caller
</h2>


<p>
Call Management
</p>


</div>







</div>








</div>




<script src="session.js"></script>

<script src="dashboard.js"></script>



</body>

</html>
