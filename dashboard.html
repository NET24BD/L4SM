<style>


*{

margin:0;
padding:0;
box-sizing:border-box;
font-family:"Segoe UI",Arial,sans-serif;

}



body{

background:#f4f7f6;

}


.sidebar{

position:fixed;

top:0;

left:0;

width:260px;

height:100vh;

background:#062b25;

color:white;

padding:20px;

display:flex;

flex-direction:column;

transition:.3s;

z-index:1000;

}



.sidebar.hide{

left:-260px;

}





.logo{

text-align:center;

padding-bottom:20px;

border-bottom:1px solid rgba(255,255,255,.2);

}



.logo i{

font-size:45px;

color:#00d084;

}



.logo h2{

margin-top:10px;

font-size:22px;

}


.menu{

margin-top:20px;

flex:1;

overflow-y:auto;

}



.menu a{


display:flex;

align-items:center;

gap:15px;

padding:13px;

margin-bottom:8px;

border-radius:12px;

color:white;

text-decoration:none;

transition:.3s;


}



.menu a:hover{

background:#00a86b;

}



.menu i{

width:25px;

font-size:18px;

}


.logout{


background:#d63031;

padding:14px;

border-radius:12px;

display:flex;

align-items:center;

gap:15px;

cursor:pointer;

}



.logout:hover{

background:#ff4757;

}



.main{


margin-left:260px;

padding:20px;

transition:.3s;


}



.main.full{

margin-left:0;

}




.topbar{


height:65px;

background:white;

border-radius:15px;

display:flex;

align-items:center;

justify-content:space-between;

padding:0 20px;

box-shadow:0 5px 20px rgba(0,0,0,.1);


}




.toggle{

font-size:25px;

cursor:pointer;

color:#062b25;

}




.profile{


position:relative;

display:flex;

align-items:center;

gap:12px;

cursor:pointer;


}




.profile img{


width:45px;

height:45px;

border-radius:50%;

object-fit:cover;

border:2px solid #00a86b;


}



.profile h4{


color:#062b25;

}



.profile span{


font-size:12px;

color:#777;


}



.profile-menu{


display:none;

position:absolute;

right:20px;

top:80px;

width:190px;

background:white;

border-radius:15px;

box-shadow:0 10px 30px rgba(0,0,0,.2);

overflow:hidden;

z-index:2000;


}



.profile-menu.show{

display:block;

}



.profile-menu a,
.profile-menu div{


display:flex;

align-items:center;

gap:12px;

padding:14px;

color:#062b25;

text-decoration:none;

cursor:pointer;


}



.profile-menu a:hover,
.profile-menu div:hover{


background:#f1f5f4;


}


@media(max-width:768px){


.sidebar{

left:-260px;

}


.sidebar.show{

left:0;

}



.main{

margin-left:0;

}



}

<script>


let user = localStorage.getItem("user");



if(!user){


window.location.replace("login.html");


}

else{


let data = JSON.parse(user);



document.getElementById("name").innerHTML =
data.name || "User";



document.getElementById("role").innerHTML =
data.role || "User";





if(data.photo && data.photo!=""){


document.getElementById("profileImg").src =
data.photo;


}



}



function toggleMenu(){


let sidebar = document.getElementById("sidebar");

let main = document.getElementById("main");



if(window.innerWidth <= 768){



sidebar.classList.toggle("show");



}

else{



sidebar.classList.toggle("hide");


main.classList.toggle("full");



}



}


function openProfile(){


document
.getElementById("profileMenu")
.classList.toggle("show");


}


document.addEventListener("click",function(e){


let profile =
document.querySelector(".profile");


let menu =
document.getElementById("profileMenu");



if(!profile.contains(e.target)){


menu.classList.remove("show");


}



});



function logout(){


localStorage.removeItem("user");


window.location.replace("login.html");


}




let logoutTime = 10 * 60 * 1000;


let timer;



function resetTimer(){



clearTimeout(timer);




timer = setTimeout(function(){



localStorage.removeItem("user");



alert("Session expired. Please login again");



window.location.replace("login.html");



}, logoutTime);



}



window.onload = resetTimer;


document.onclick = resetTimer;


document.onmousemove = resetTimer;


document.onkeypress = resetTimer;


document.onscroll = resetTimer;


document.ontouchstart = resetTimer;





</script>
