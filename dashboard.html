<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dashboard | Link4 Support Team</title>


<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">


<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:"Segoe UI",sans-serif;
}


body{

background:#f4f7f6;

}



/* SIDEBAR */

.sidebar{

position:fixed;
top:0;
left:0;
width:260px;
height:100vh;
background:#062b25;
color:white;
padding:20px;
transition:.35s;
z-index:1000;

}


.sidebar.hide{

left:-260px;

}



/* LOGO */

.logo{

text-align:center;
padding-bottom:20px;
border-bottom:1px solid rgba(255,255,255,.2);

}


.logo i{

font-size:45px;
color:#00d084;

}


.logo h2{

margin-top:10px;

}




/* MENU */

.menu{

margin-top:25px;

}


.menu a{

display:flex;
align-items:center;
gap:15px;
padding:14px;
margin-bottom:10px;
border-radius:12px;
color:white;
text-decoration:none;
transition:.3s;

}



.menu a:hover{

background:#00a86b;

}



.menu i{

width:25px;
font-size:20px;

}





/* MAIN */

.main{

margin-left:260px;
padding:20px;
transition:.35s;

}


.main.full{

margin-left:0;

}




/* TOPBAR */

.topbar{

background:white;
height:65px;
border-radius:15px;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 20px;
box-shadow:0 5px 20px rgba(0,0,0,.1);

}


.toggle{

font-size:25px;
cursor:pointer;
color:#062b25;

}



.logout{

background:#062b25;
color:white;
padding:10px 18px;
border-radius:10px;
cursor:pointer;

}





/* PROFILE */

.profile{

margin-top:20px;
padding:25px;
border-radius:20px;
color:white;
background:linear-gradient(135deg,#062b25,#00a86b);

}


.profile h2{

margin-bottom:8px;

}




/* CARDS */

.cards{

margin-top:25px;
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;

}



.card{

background:white;
padding:25px;
border-radius:20px;
text-align:center;
box-shadow:0 5px 20px rgba(0,0,0,.1);
transition:.3s;

}



.card:hover{

transform:translateY(-7px);

}



.card i{

font-size:40px;
color:#00a86b;

}



.card h3{

margin-top:15px;
color:#062b25;

}



.code{

color:#888;
font-weight:bold;
margin-top:5px;

}



a{

text-decoration:none;

}





/* MOBILE */


@media(max-width:768px){


.sidebar{

left:-260px;

}


.sidebar.show{

left:0;

}


.main{

margin-left:0;

}


}



</style>


</head>



<body>




<!-- SIDEBAR -->


<div class="sidebar" id="sidebar">


<div class="logo">

<i class="fa-solid fa-headset"></i>

<h2>
Link4 Support
</h2>


</div>




<div class="menu">


<a href="dashboard.html">

<i class="fa-solid fa-house"></i>
Dashboard

</a>



<a href="NS.html">

<i class="fa-solid fa-headset"></i>
New Support

</a>



<a href="PS.html">

<i class="fa-solid fa-clock"></i>
Pending Support

</a>



<a href="PC.html">

<i class="fa-solid fa-phone"></i>
Pending Call

</a>



<a href="H.html">

<i class="fa-solid fa-history"></i>
History

</a>



<a href="ON.html">

<i class="fa-solid fa-pen"></i>
Offline Entry

</a>



<a href="OF.html">

<i class="fa-solid fa-folder"></i>
Offline

</a>



<a href="OC.html">

<i class="fa-solid fa-money-bill"></i>
Offline Collect

</a>



</div>


</div>







<!-- MAIN -->


<div class="main" id="main">



<div class="topbar">


<div class="toggle" onclick="toggleMenu()">

<i class="fa-solid fa-bars"></i>

</div>



<div class="logout" onclick="logout()">

<i class="fa-solid fa-right-from-bracket"></i>
Logout

</div>


</div>






<div class="profile">


<h2 id="name">
Welcome User
</h2>


<p id="role">
Role :
</p>


</div>






<div class="cards">



<a href="NS.html">
<div class="card">

<i class="fa-solid fa-headset"></i>

<h3>New Support</h3>

<div class="code">
NS
</div>

</div>
</a>




<a href="PS.html">
<div class="card">

<i class="fa-solid fa-clock"></i>

<h3>Pending Support</h3>

<div class="code">
PS
</div>

</div>
</a>




<a href="PC.html">
<div class="card">

<i class="fa-solid fa-phone-volume"></i>

<h3>Pending Call</h3>

<div class="code">
PC
</div>

</div>
</a>




<a href="H.html">
<div class="card">

<i class="fa-solid fa-file-lines"></i>

<h3>History</h3>

<div class="code">
H
</div>

</div>
</a>




<a href="ON.html">
<div class="card">

<i class="fa-solid fa-file-circle-plus"></i>

<h3>Offline Entry</h3>

<div class="code">
ON
</div>

</div>
</a>




<a href="OF.html">
<div class="card">

<i class="fa-solid fa-folder-open"></i>

<h3>Offline</h3>

<div class="code">
OF
</div>

</div>
</a>




<a href="OC.html">
<div class="card">

<i class="fa-solid fa-coins"></i>

<h3>Offline Collect</h3>

<div class="code">
OC
</div>

</div>
</a>



</div>



</div>






<script>


// LOGIN CHECK


let user = localStorage.getItem("user");


if(!user){

window.location.replace("login.html");

}

else{


let data=JSON.parse(user);


document.getElementById("name").innerHTML =
"Welcome, "+(data.name || "User");


document.getElementById("role").innerHTML =
"Role : "+(data.role || "User");


}




// MENU TOGGLE


function toggleMenu(){


let sidebar=document.getElementById("sidebar");

let main=document.getElementById("main");



if(window.innerWidth <= 768){


sidebar.classList.toggle("show");


}

else{


sidebar.classList.toggle("hide");

main.classList.toggle("full");


}


}





// LOGOUT


function logout(){


localStorage.removeItem("user");


window.location.replace("login.html");


}



</script>



</body>

</html>
