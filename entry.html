<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>New Entry | Support System</title>


<link 
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
rel="stylesheet">



<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}


body{

min-height:100vh;

background:
linear-gradient(
135deg,
#0f172a,
#2563eb,
#06b6d4
);

font-family:"Segoe UI",sans-serif;

}



.entry-wrapper{

min-height:100vh;

display:flex;

align-items:center;

justify-content:center;

padding:20px;

}



.entry-card{

width:430px;

background:white;

border-radius:25px;

overflow:hidden;

box-shadow:
0 25px 60px rgba(0,0,0,.35);

}



.entry-header{

padding:35px;

text-align:center;

color:white;

background:
linear-gradient(
135deg,
#2563eb,
#06b6d4
);

}



.logo{

width:80px;

height:80px;

border-radius:50%;

background:white;

color:#2563eb;

display:flex;

align-items:center;

justify-content:center;

margin:auto;

font-size:40px;

}


.entry-header h2{

margin-top:15px;

font-weight:700;

}



.entry-header p{

opacity:.9;

}



.entry-body{

padding:30px;

}



.input-box{

display:flex;

align-items:center;

background:#f1f5f9;

border-radius:15px;

padding:14px;

margin-bottom:20px;

border:2px solid transparent;

}



.input-box:focus-within{

border-color:#2563eb;

background:white;

}



.input-box i{

font-size:22px;

color:#2563eb;

margin-right:12px;

}



.input-box input,
.input-box textarea{

width:100%;

border:none;

outline:none;

background:transparent;

font-size:16px;

}



.input-box textarea{

resize:none;

}



.input-box input[readonly]{

color:#64748b;

cursor:not-allowed;

}



.submit-btn{

width:100%;

padding:15px;

border:none;

border-radius:15px;

background:

linear-gradient(
135deg,
#2563eb,
#06b6d4
);

color:white;

font-size:18px;

font-weight:700;

cursor:pointer;

}



.submit-btn:hover{

opacity:.9;

}



</style>


</head>



<body>



<div class="entry-wrapper">


<div class="entry-card">



<div class="entry-header">


<div class="logo">

<i class="bi bi-headset"></i>

</div>


<h2>
Support System
</h2>


<p>
Create New Entry
</p>


</div>




<div class="entry-body">


<form id="entryForm">



<div class="input-box">

<i class="bi bi-person-circle"></i>

<input

type="text"

id="customerId"

placeholder="Customer ID"

required>

</div>






<div class="input-box">

<i class="bi bi-exclamation-triangle"></i>


<textarea

id="problem"

rows="4"

placeholder="Customer Problem"

required></textarea>


</div>






<div class="input-box">


<i class="bi bi-person-check"></i>


<input

type="text"

id="reference"

placeholder="Reference"

readonly>


</div>






<button

class="submit-btn"

type="submit">


<i class="bi bi-send-fill"></i>

Submit Entry


</button>




</form>


</div>



</div>



</div>





<script src="entry.js"></script>


</body>

</html>
