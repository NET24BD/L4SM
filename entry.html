<!-- ENTRY POPUP -->

<div id="entryModal" class="entry-modal">


    <div class="entry-box">


        <!-- HEADER -->

        <div class="entry-header">


            <h2>
                <i class="fa-solid fa-circle-plus"></i>
                New Entry
            </h2>



            <button class="close-entry"
                    onclick="closeEntry()">

                <i class="fa-solid fa-xmark"></i>

            </button>


        </div>





        <!-- BODY -->

        <div class="entry-body">



            <!-- CUSTOMER ID -->

            <div class="input-group">


                <label>
                    Customer ID
                </label>


                <input type="text"
                       id="customerId"
                       placeholder="Enter Customer ID">


            </div>







            <!-- PROBLEM -->


            <div class="input-group">


                <label>
                    Problem
                </label>



                <textarea
                    id="problem"
                    rows="4"
                    placeholder="Write customer problem..."></textarea>


            </div>







            <!-- REFERENCE -->


            <div class="input-group">


                <label>
                    Reference
                </label>



                <input type="text"
                       id="reference"
                       placeholder="Auto Login User"
                       readonly>


            </div>




        </div>







        <!-- FOOTER -->


        <div class="entry-footer">



            <button class="cancel-btn"
                    onclick="closeEntry()">

                Cancel

            </button>





            <button class="submit-btn"
                    id="submitEntry">

                Submit

            </button>




        </div>




    </div>



</div>
