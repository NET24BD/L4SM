<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>New Entry</title>


<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">


<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}


body{

min-height:100vh;

background:
linear-gradient(135deg,#0f172a,#2563eb,#06b6d4);

font-family:Arial,sans-serif;

}


.container{

height:100vh;

display:flex;

justify-content:center;

align-items:center;

padding:20px;

}



.card{

width:420px;

background:white;

border-radius:25px;

overflow:hidden;

box-shadow:0 20px 50px rgba(0,0,0,.3);

}



.header{

background:
linear-gradient(135deg,#2563eb,#06b6d4);

color:white;

text-align:center;

padding:35px;

}



.icon{

width:80px;

height:80px;

background:white;

color:#2563eb;

border-radius:50%;

display:flex;

align-items:center;

justify-content:center;

font-size:40px;

margin:auto;

}



.header h2{

margin-top:15px;

}



.body{

padding:30px;

}



.input{

display:flex;

align-items:center;

background:#f1f5f9;

padding:14px;

border-radius:15px;

margin-bottom:20px;

}



.input i{

color:#2563eb;

font-size:22px;

margin-right:10px;

}



.input input,
.input textarea{

border:none;

outline:none;

background:none;

width:100%;

font-size:16px;

}



textarea{

resize:none;

}



input[readonly]{

color:#64748b;

cursor:not-allowed;

}



button{

width:100%;

padding:15px;

border:none;

border-radius:15px;

background:
linear-gradient(135deg,#2563eb,#06b6d4);

color:white;

font-size:18px;

font-weight:bold;

cursor:pointer;

}


button:hover{

opacity:.9;

}


</style>


</head>


<body>



<div class="container">


<div class="card">


<div class="header">

<div class="icon">

<i class="bi bi-headset"></i>

</div>


<h2>Support System</h2>

<p>New Customer Entry</p>


</div>





<div class="body">


<form id="entryForm">


<div class="input">

<i class="bi bi-person"></i>

<input

id="customerId"

type="text"

placeholder="Customer ID"

required>

</div>



<div class="input">

<i class="bi bi-exclamation-triangle"></i>

<textarea

id="problem"

rows="4"

placeholder="Problem"

required></textarea>

</div>




<div class="input">

<i class="bi bi-person-check"></i>

<input

id="reference"

type="text"

placeholder="Reference"

readonly>

</div>



<button type="submit">

<i class="bi bi-send"></i>

Submit Entry

</button>



</form>


</div>


</div>


</div>





<script src="entry.js"></script>


</body>

</html>
