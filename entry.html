<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>New Entry</title>


<link rel="stylesheet" href="entry.css">


<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">


</head>


<body>


<div class="entry-box">



<!-- HEADER -->

<div class="entry-header">


<button class="back-btn"
onclick="goBack()">

<i class="fa-solid fa-arrow-left"></i>
Back

</button>



<h2>

<i class="fa-solid fa-circle-plus"></i>

New Entry

</h2>


</div>







<!-- FORM -->


<div class="input-group">


<label>
Customer ID
</label>


<input 
type="text"
id="customerId"
placeholder="Enter Customer ID">


</div>







<div class="input-group">


<label>
Problem
</label>


<textarea
id="problem"
rows="5"
placeholder="Write customer problem"></textarea>


</div>







<div class="input-group">


<label>
Reference
</label>


<input
type="text"
id="reference"
readonly
placeholder="Auto Login User">


</div>







<button class="submit-btn"
onclick="submitEntry()">


Submit


</button>






<p id="msg"></p>




</div>







<script src="entry.js"></script>


<script>


function goBack(){

    window.location.href="dashboard.html";

}


</script>



</body>

</html>
